tech may face. Which apply depends on what the company does, so confirm each.","detail":"- **AML/ATF**: PCMLTFA and FINTRAC if the firm is a reporting entity (brokerage, developer, mortgage broker, lender or administrator, or a money services business).\n- **Licensing and conduct**: RECO/TRESA (real estate), FSRA and MBLAA (mortgages), provincial equivalents.\n- **Payments**: RPAA if it performs payment functions; trust and safeguarding duties for client funds.\n- **Privacy**: PIPEDA, Quebec Law 25, provincial laws; breach reporting; consent.\n- **Marketing**: CASL, Competition Act, lending disclosure rules, criminal interest rate.\n- **Sanctions** and **fraud**: screening, wire fraud and title fraud controls.\n- **Operational resilience and security**: SOC 2, ISO 27001, vendor oversight; OSFI guidelines if partnering with federally regulated banks.\n- **Records**: retention and e-signature rules.","example":"","related":["Compliance Officer (role)","PCMLTFA","RPAA","FSRA","PIPEDA","CASL","Real estate wire fraud","Title fraud"],"tags":["real-estate","map","start-here"],"links":[],"flagged":false,"createdAt":1793043845381,"updatedAt":1793043845381},{"id":"tell-me-about-yourself-compliance-angle","title":"Tell me about yourself (compliance angle)","kind":"question","category":"cofficer","summary":"Build a 60-second answer linking your background to the compliance officer role.","detail":"**Structure**: present, past, future.\n- Present: what you do and the skills most relevant (controls, evidence, risk, IT).\n- Past: one or two proof points, including your real estate background.\n- Future: why compliance officer in real estate fintech, and why this company.\n\n**Tip**: finish with a sentence that invites a question about a strength you want to discuss.","example":"","related":["Why my real estate background helps"],"tags":["interview"],"links":[],"flagged":false,"createdAt":1793043845382,"updatedAt":1793043845382},{"id":"why-compliance","title":"Why compliance?","kind":"question","category":"cofficer","summary":"Why do you want to work in compliance?","detail":"Good answers show you understand it is enabling trust, not just saying no.\n- It protects customers and the company's licence to operate.\n- It sits where law, risk, process and technology meet.\n- You like building clear, practical controls.\n\nAvoid: \"I like rules\" or \"it is stable\".","example":"","related":["Compliance Officer (role)"],"tags":["interview"],"links":[],"flagged":false,"createdAt":1793043845383,"updatedAt":1793043845383},{"id":"what-are-the-five-elements-of-an-aml-program","title":"What are the five elements of an AML program?","kind":"question","category":"cofficer","summary":"Likely a knowledge check. Answer from memory.","detail":"Compliance officer, written policies and procedures, risk assessment, training program and plan, and a two-year effectiveness review. Add that FINTRAC checks all five in an exam.","example":"","related":["Compliance program (PCMLTFA)","Two-year effectiveness review"],"tags":["interview","aml"],"links":[],"flagged":false,"createdAt":1793043845384,"updatedAt":1793043845384},{"id":"when-do-you-file-an-str","title":"When do you file an STR?","kind":"question","category":"cofficer","summary":"Explain the threshold and timing.","detail":"When you have reasonable grounds to suspect a transaction or attempt is related to money laundering or terrorist financing. No minimum amount, attempted transactions count, and it must be sent as soon as practicable once you have completed the measures that let you reach that level of suspicion. Never tip off the client.","example":"","related":["Suspicious transaction report (STR)","Reasonable grounds to suspect","Tipping off"],"tags":["interview","aml"],"links":[],"flagged":false,"createdAt":1793043845385,"updatedAt":1793043845385},{"id":"a-client-wants-to-pay-a-large-deposit-in-cash-what-do-you-do","title":"A client wants to pay a large deposit in cash. What do you do?","kind":"question","category":"cofficer","summary":"Scenario question: walk through your steps calmly.","detail":"1. Check whether it hits the $10,000 cash threshold, including the 24-hour rule. If yes, an LCTR is needed.\n2. Verify identity and do a third party determination.\n3. Ask neutrally about source of funds and why cash.\n4. Assess risk factors and look for red flags.\n5. If suspicion arises, escalate to the compliance officer for an STR decision, without tipping off.\n6. Document each step.","example":"","related":["Large cash transaction report (LCTR)","24-hour rule","Source of funds vs source of wealth","Suspicious transaction report (STR)"],"tags":["interview","aml","scenario"],"links":[],"flagged":false,"createdAt":1793043845386,"updatedAt":1793043845386},{"id":"how-do-you-assess-the-risk-of-a-new-product","title":"How do you assess the risk of a new product?","kind":"question","category":"cofficer","summary":"Show a repeatable method.","detail":"- Identify the obligations the product touches (AML, privacy, advertising, licensing).\n- Rate inherent risk by customers, channels, geography and complexity.\n- Identify existing controls and gaps. Rate residual risk.\n- Recommend conditions: extra controls, limits, a pilot, or a go-live approval.\n- Record the decision and revisit after launch.","example":"","related":["Compliance risk assessment","Risk-based approach (AML)"],"tags":["interview","risk"],"links":[],"flagged":false,"createdAt":1793043845387,"updatedAt":1793043845387},{"id":"how-do-you-handle-a-business-team-that-wants-to-skip-a-contr","title":"How do you handle a business team that wants to skip a control?","kind":"question","category":"cofficer","summary":"Tests judgement and influence.","detail":"- Listen to the goal first. Understand the business pressure.\n- Explain the risk in plain terms: what could go wrong and what it would cost.\n- Offer options that meet the goal with acceptable risk (alternative control, phased rollout).\n- If it is still unsafe, escalate and document. Do not approve what you cannot defend.","example":"","related":["Compliance Officer (role)","Reporting to the board"],"tags":["interview","behavioural"],"links":[],"flagged":false,"createdAt":1793043845388,"updatedAt":1793043845388},{"id":"tell-me-about-a-time-you-found-a-mistake-or-a-gap","title":"Tell me about a time you found a mistake or a gap","kind":"question","category":"cofficer","summary":"Behavioural question. Use the STAR method.","detail":"- Situation and Task: what was happening and what was your role?\n- Action: what you did to investigate, fix and tell the right people.\n- Result: what changed, measured if possible.\n- Show honesty and ownership. A real estate or IT example works well.","example":"","related":["Issues log and corrective action","Why my real estate background helps"],"tags":["interview","behavioural"],"links":[],"flagged":false,"createdAt":1793043845389,"updatedAt":1793043845389},{"id":"what-would-you-do-if-you-found-a-past-reporting-failure","title":"What would you do if you found a past reporting failure?","kind":"question","category":"cofficer","summary":"Tests ethics and process.","detail":"- Contain it and fix the process.\n- Scope how many records or transactions are affected and for how long.\n- Brief senior management and legal quickly.\n- Consider whether to report late or self-declare to the regulator.\n- Fix the root cause and test the fix.","example":"","related":["Voluntary self-declaration of non-compliance","Issues log and corrective action"],"tags":["interview","ethics"],"links":[],"flagged":false,"createdAt":1793043845390,"updatedAt":1793043845390},{"id":"how-do-you-keep-up-with-regulatory-change","title":"How do you keep up with regulatory change?","kind":"question","category":"cofficer","summary":"Shows discipline.","detail":"- Subscribe to regulator bulletins (FINTRAC, FSRA, OPC, Bank of Canada) and the Canada Gazette.\n- Join industry groups and read law firm updates.\n- Keep a regulatory change log with owners and dates.\n- Tell them about a recent change you followed, such as the 2026 AML penalty increases.","example":"","related":["Regulatory change management","Bill C-12 and higher penalties"],"tags":["interview"],"links":[],"flagged":false,"createdAt":1793043845391,"updatedAt":1793043845391},{"id":"how-do-you-work-with-it-and-engineering","title":"How do you work with IT and engineering?","kind":"question","category":"cofficer","summary":"A strength for you, given your IT background.","detail":"- Agree on plain requirements. Engineers prefer clear rules, examples and acceptance tests.\n- Embed controls in the workflow (required fields, logging, approvals) instead of relying on memory.\n- Ask for evidence from systems: logs, access reviews, change tickets.\n- Join design reviews early so compliance is not a late surprise.","example":"","related":["Segregation of duties","Privacy impact assessment (PIA)"],"tags":["interview","it"],"links":[],"flagged":false,"createdAt":1793043845392,"updatedAt":1793043845392},{"id":"what-is-the-difference-between-a-policy-procedure-and-contro","title":"What is the difference between a policy, procedure and control?","kind":"question","category":"cofficer","summary":"Short definitions with a concrete example.","detail":"- Policy: the rule and why (\"We verify every client's identity.\")\n- Procedure: the steps (\"Check ID, record method, second review for high risk.\")\n- Control: the mechanism that makes it happen or catches failure (system block, approval, monthly QA test).","example":"","related":["Policy, standard, procedure"],"tags":["interview"],"links":[],"flagged":false,"createdAt":1793043845393,"updatedAt":1793043845393},{"id":"do-you-have-any-questions-for-us","title":"Do you have any questions for us?","kind":"question","category":"cofficer","summary":"Always ask 3 or 4. Good ones show you are thinking like the compliance officer.","detail":"- Which regulators and licences apply today, and what is on the roadmap?\n- Has the company had an exam or review, and what came out of it?\n- Who does the compliance officer report to, and how often to the board?\n- What does the compliance team look like and what tools do you use?\n- What would success look like in the first 6 months?","example":"","related":["First 90 days as compliance officer"],"tags":["interview"],"links":[],"flagged":false,"createdAt":1793043845394,"updatedAt":1793043845394},{"id":"zero-breach-toolkit","title":"Zero Breach Toolkit","kind":"note","category":"toolkit","summary":"Free, open-source tool that checks computers, Android phones and iPhone backups for traces of known mercenary spyware. This note is a study summary, not the tool.","detail":"**What it is**\n- A Python program you run on your own computer. It looks for published indicators of spyware such as Pegasus, Predator, Graphite and Candiru.\n- About 12,400 indicators from 25 published sources (Amnesty International's Security Lab, the Mobile Verification Toolkit project, Citizen Lab and others).\n- Made by an anonymous group (archivegenocide). Licensed Apache 2.0.\n\n**Design rules worth noticing (they are good control-design habits)**\n- **Read-only:** it does not change the evidence or the system.\n- **No network during a scan:** no uploads, and it never visits indicator addresses.\n- **States its limits:** every report lists what was found, how strong the evidence is, and what could not be checked.\n\n**It cannot run inside this guide.** It needs to read files on a device, so you run it separately. This guide only explains it and links to it.\n\n**Not a replacement** for endpoint protection or a professional investigation.","example":"","related":["Zero Breach Toolkit: what a result means","Zero Breach Toolkit: limits","Mercenary spyware","Verifying a tool before you run it"],"tags":["toolkit","security","start-here"],"links":[{"label":"Zero Breach Toolkit (GitHub)","url":"https://github.com/interplains/zero-breach-toolkit"},{"label":"What each check reads (Coverage)","url":"https://github.com/interplains/zero-breach-toolkit/blob/main/docs/COVERAGE.md"}],"flagged":false,"createdAt":1793138539425,"updatedAt":1793138539425},{"id":"mercenary-spyware","title":"Mercenary spyware","kind":"term","category":"toolkit","summary":"Commercial spyware sold to governments and agencies, used to secretly take over phones and computers. Targets often include journalists, activists and lawyers.","detail":"- Examples named by the toolkit: Pegasus, Predator, Graphite, Candiru.\n- Often delivered with little or no action by the victim.\n- Traces are published by researchers (Amnesty Security Lab, Citizen Lab) as **indicators**: file fingerprints, domain names, app names and similar.\n- For a company, the relevant risk is staff or executives with access to sensitive data being targeted, and the data exposure that follows.","example":"","related":["Indicator of compromise (IOC)","Incident Response Plan (IRP)"],"tags":["toolkit","threat"],"links":[{"label":"Zero Breach Toolkit (GitHub)","url":"https://github.com/interplains/zero-breach-toolkit"},{"label":"Access Now Digital Security Helpline","url":"https://www.accessnow.org/help/"}],"flagged":false,"createdAt":1793138539426,"updatedAt":1793138539426},{"id":"indicator-of-compromise-ioc","title":"Indicator of compromise (IOC)","kind":"term","category":"toolkit","summary":"A piece of evidence that a system may have been attacked: a known malicious file fingerprint, domain, IP address, app name or setting.","detail":"- Defenders match IOCs against what they find on a device or in logs.\n- IOCs go stale. Lists must be updated, and the age of each list matters.\n- A match means **look closer**, not **proven compromise**. The same domain may appear in a news article about the attack.\n- No match does not prove safety, since new or unpublished attacks have no indicators yet.","example":"A cookie from a known spyware domain on a laptop is a stronger sign than the same domain mentioned in a saved news page.","related":["Zero Breach Toolkit: what a result means","Mercenary spyware","Evidence"],"tags":["security","incident"],"links":[],"flagged":false,"createdAt":1793138539427,"updatedAt":1793138539427},{"id":"zero-breach-toolkit-what-a-result-means","title":"Zero Breach Toolkit: what a result means","kind":"term","category":"toolkit","summary":"Reports grade evidence by strength. A match means look closer, and a clean result is never proof of safety.","detail":"**Two headline results**\n- **No known indicators found:** nothing from the published lists turned up in the places the tool could check. Read the list of places it could not check.\n- **Something matched:** do **not** delete anything or visit the address it names. Keep the report and get expert help.\n\n**Evidence grades, strongest first (from the project's methodology)**\n- **on-disk:** a file matches a published spyware sample. Conclusive.\n- **on-device:** an app, certificate or setting researchers name is present.\n- **persistence:** the name is set to start automatically.\n- **execution-record / ran-command:** history shows something ran.\n- **contacted:** the device talked to a known address (for example a cookie).\n- **device-log, received, dns-record, attempted:** weaker traces, such as a lookup or blocked attempt.\n- **configured / referenced:** appears in settings or saved content. Usually not contact.\n\nThe grade, not the number of matches, decides the advice.","example":"","related":["Indicator of compromise (IOC)","Evidence","Zero Breach Toolkit: limits"],"tags":["toolkit","evidence"],"links":[{"label":"Methodology and evidence grades","url":"https://github.com/interplains/zero-breach-toolkit/blob/main/docs/METHODOLOGY.md"}],"flagged":false,"createdAt":1793138539428,"updatedAt":1793138539428},{"id":"zero-breach-toolkit-limits","title":"Zero Breach Toolkit: limits","kind":"term","category":"toolkit","summary":"The tool can only find traces that are published and readable. Gaps are reported, not hidden.","detail":"- Finds **known** spyware only. New or private tools may leave no published indicator.\n- A check that could not run (locked file, missing permission, unsupported format) is a **gap**, not a clean result.\n- A computer scan cannot tell you whether a **phone** is infected. Phones need a separate collection or backup.\n- Logs and records expire, and some are disabled by default, so old activity may be gone.\n- The privacy guard blocks Python network calls. It is not an operating-system network sandbox.\n\n**Control-testing lesson:** a test that passes only shows the controls you tested worked. Always state what was out of scope.","example":"","related":["Zero Breach Toolkit","Compliance monitoring and testing"],"tags":["toolkit","limits","audit"],"links":[{"label":"Coverage and limits","url":"https://github.com/interplains/zero-breach-toolkit/blob/main/docs/COVERAGE.md"}],"flagged":false,"createdAt":1793138539429,"updatedAt":1793138539429},{"id":"running-the-zero-breach-toolkit","title":"Running the Zero Breach Toolkit","kind":"note","category":"toolkit","summary":"Study summary of the project's steps for scanning a computer. Always follow the current README on the project page.","detail":"**Before you start**\n- Install Python 3.8 or newer. No administrator rights and no extra packages are needed.\n- Get the toolkit from the GitHub page (Code, then Download ZIP) and extract it.\n- Close browsers and chat apps so their records can be read.\n- On a Mac, give Terminal Full Disk Access first.\n\n**Run (macOS and Linux)**\n```\ncd ~/Downloads/Zero-Breach-Toolkit-main\npython3 -X utf8 scan/zero-breach-toolkit.py --update\npython3 -X utf8 scan/zero-breach-toolkit.py\n```\nThe first command downloads the latest indicator lists and is the only step that uses the internet. The second starts the menu. Press Enter for the standard check of this computer (about 15 minutes).\n\n**Useful options**\n```\n--quick                       # skips file fingerprints, faster\n--phone \"FOLDER\"              # check a phone collection or backup\n--json report.json            # machine-readable report\n--share-json summary.json     # minimal summary safe to share\n```\nOn Windows you can double-click `scan\\run-scan.cmd` instead. Reports are saved in a `findings` folder.","example":"","related":["Zero Breach Toolkit","Checking a phone with the Zero Breach Toolkit","Verifying a tool before you run it"],"tags":["toolkit","how-to","linux"],"links":[{"label":"Zero Breach Toolkit (GitHub)","url":"https://github.com/interplains/zero-breach-toolkit"}],"flagged":false,"createdAt":1793138539430,"updatedAt":1793138539430},{"id":"checking-a-phone-with-the-zero-breach-toolkit","title":"Checking a phone with the Zero Breach Toolkit","kind":"note","category":"toolkit","summary":"Phones are checked from a computer, using a backup (iPhone) or an AndroidQF collection (Android).","detail":"**iPhone**\n- Make a local backup on the computer (Finder, Apple Devices or iTunes). Encrypted backups work with the password entered privately at the terminal.\n- Run the toolkit, choose A phone, and point it at the backup folder.\n\n**Android**\n- Turn on Developer options and USB debugging, connect by USB.\n- Run **AndroidQF** (a separate tool from the Mobile Verification Toolkit project) and answer its prompts. The toolkit's README gives the recommended answers.\n- Extract the zip it creates and point the toolkit at that folder. Turn USB debugging off again afterward.\n\n**Remember**\n- The collection holds private data about the phone. Keep it on the computer, out of cloud-synced folders.\n- Acquisition can change the phone's state. Scanning the saved collection does not.","example":"","related":["Zero Breach Toolkit","Zero Breach Toolkit: handling reports and evidence"],"tags":["toolkit","mobile","how-to"],"links":[{"label":"Zero Breach Toolkit (GitHub)","url":"https://github.com/interplains/zero-breach-toolkit"},{"label":"Local iPhone evidence","url":"https://github.com/interplains/zero-breach-toolkit/blob/main/docs/IPHONE.md"},{"label":"AndroidQF (MVT project)","url":"https://github.com/mvt-project/androidqf"}],"flagged":false,"createdAt":1793138539431,"updatedAt":1793138539431},{"id":"verifying-a-tool-before-you-run-it","title":"Verifying a tool before you run it","kind":"note","category":"toolkit","summary":"Never run security software just because a page says it is safe. Check who made it, whether the build can be reproduced, and what it can touch.","detail":"The Zero Breach Toolkit makes a good worked example, because its authors are anonymous and say so: *do not take its word for anything*.\n\n**Checks the project offers**\n- **Run from source:** every line that executes is in the clone. Nothing is compiled or fetched to run it.\n- **Reproducible build:** rebuild the single-file release from its tag and compare the SHA-256 with the published value.\n- **Signed releases:** release files carry detached GPG signatures. Compare the key fingerprint with a record you already trust before importing it.\n- **Pinned downloads:** the optional Android collector is downloaded with a fixed expected hash, and refused if it does not match.\n\n**General due diligence for any tool**\n- Who maintains it, and how long has it been active?\n- Open source licence, code you can read, published changelog.\n- What access does it need (files, network, admin rights)?\n- Where does its data go?\n- Does your policy allow it on a company device? Get approval first.\n\nThis is the same thinking as vendor risk and software supply chain risk.","example":"","related":["Third-Party Risk Management (TPRM)","Change management","Zero Breach Toolkit"],"tags":["toolkit","tprm","supply-chain"],"links":[{"label":"Verifying a release","url":"https://github.com/interplains/zero-breach-toolkit/blob/main/docs/VERIFYING.md"}],"flagged":false,"createdAt":1793138539432,"updatedAt":1793138539432},{"id":"zero-breach-toolkit-handling-reports-and-evidence","title":"Zero Breach Toolkit: handling reports and evidence","kind":"note","category":"toolkit","summary":"Scan reports contain private details. Treat them like personal information and share the minimum.","detail":"**What a full report can contain:** your username, browser profile names, file paths, browsing details, SMS senders and message excerpts.\n\n**Good handling habits**\n- Keep reports out of shared and cloud-synced folders.\n- Use the **share summary** option (counts, verdict and fixed advice, no paths or text) when someone only needs the outcome.\n- Evidence bundles are **unencrypted** ZIP files. Send them only to someone you trust, over a secure route.\n- Do not paste a full report into a ticket or chat.\n- Temporary copies of browser databases are removed after the scan, but an interrupted run can leave some in the system temp folder. Check and clean up.\n- Write down who handled the evidence and when (a simple chain of custody log) if the matter may become a formal incident.\n\n**Compliance angle:** reports can hold personal information of the device owner and other people. Data minimization, access limits and retention rules apply.","example":"","related":["Personal information (PI)","Data minimization","Data retention","Evidence"],"tags":["toolkit","privacy","evidence"],"links":[{"label":"Privacy notes (project)","url":"https://github.com/interplains/zero-breach-toolkit/blob/main/PRIVACY.md"}],"flagged":false,"createdAt":1793138539433,"updatedAt":1793138539433},{"id":"zero-breach-toolkit-when-to-get-expert-help","title":"Zero Breach Toolkit: when to get expert help","kind":"note","category":"toolkit","summary":"If you think someone is targeted right now, call experts first. You do not need to run the tool before asking.","detail":"- Journalists, activists and human-rights defenders can contact the **Access Now Digital Security Helpline** (free, 24/7) or **Amnesty International's Security Lab**.\n- If a scan shows a match: do not delete anything, do not visit the address it names, keep the report.\n\n**In a company**\n- Follow the Incident Response Plan: report to security, preserve evidence, isolate the device as directed.\n- Consider legal duties: privacy breach assessment and notification if personal information may be at risk.\n- Record decisions and times for the post-incident review.","example":"","related":["Incident Response Plan (IRP)","Breach notification clocks","Real risk of significant harm (RROSH)","Post-incident review"],"tags":["toolkit","incident"],"links":[{"label":"Access Now Digital Security Helpline","url":"https://www.accessnow.org/help/"},{"label":"Amnesty International Security Lab","url":"https://securitylab.amnesty.org/get-help/"}],"flagged":false,"createdAt":1793138539434,"updatedAt":1793138539434},{"id":"where-the-toolkit-fits-in-compliance-work","title":"Where the toolkit fits in compliance work","kind":"note","category":"toolkit","summary":"A practical view: when a tool like this is useful, and what a compliance officer would ask before allowing it.","detail":"**Useful for**\n- Training and awareness: showing staff what spyware traces look like and why device hygiene matters.\n- Checking a high-risk person's device (executive, journalist-facing role, someone travelling) as part of an incident.\n- Learning how evidence grading and gap reporting work, which maps onto control testing and audit evidence.\n\n**Questions to ask before use at work**\n- Is it approved software? Who approved it and where is that recorded?\n- Whose device is it, and do we have consent or authority to scan it?\n- Where will the report be stored, who can read it, and for how long?\n- Does it replace or duplicate our endpoint protection (EDR)? It does not replace it.\n- Does a match trigger the Incident Response Plan and a privacy assessment?\n\n**Personal use:** if you scan your own computer to learn, you decide. For a work device, use company-approved tools.","example":"","related":["Verifying a tool before you run it","Incident Response Plan (IRP)","Compliance monitoring and testing","Zero trust"],"tags":["toolkit","compliance","governance"],"links":[],"flagged":false,"createdAt":1793138539435,"updatedAt":1793138539435},{"id":"zero-breach-scanner-web","title":"Zero Breach Scanner (browser version)","kind":"note","category":"toolkit","summary":"A browser port of the Zero Breach Toolkit in this repo (scanner/index.html). Pick a folder; it is checked locally against published spyware indicators.","detail":"**What it is**\n- One HTML file, open it in a browser. No install.\n- Your files are read in the page and never uploaded. The only network use is the Update button, which downloads public indicator lists from raw.githubusercontent.com.\n- Reads iPhone backups (including encrypted ones with the password), AndroidQF collections, browser history files and plain files.\n\n**Limits (read before trusting a result)**\n- Reduced independent port, tested only on synthetic data. Use the original desktop tool and get expert help for anything serious.\n- Finds known, published indicators only. Nothing found is not proof of safety.\n- No YARA rules, registry, Prefetch or event-log parsing.\n\n**Where**\n- Open `scanner/index.html` from this repo. Attribution and licence are in `scanner/NOTICE.md`.","example":"","flagged":false,"related":["Zero Breach Toolkit","Indicator of compromise (IOC)"],"tags":["toolkit","browser"],"createdAt":1793100000000,"updatedAt":1793100000000}];

const CATS=[
 {id:'cofficer',code:'CO',name:'Compliance officer'},
 {id:'aml',code:'AML',name:'AML & sanctions'},
 {id:'regs',code:'REG',name:'Laws & regulators'},
 {id:'foundations',code:'GOV',name:'Foundations & governance'},
 {id:'risk',code:'RSK',name:'Risk management'},
 {id:'controls',code:'CTL',name:'Controls'},
 {id:'privacy',code:'LAW',name:'Privacy & regulation'},
 {id:'frameworks',code:'FWK',name:'Frameworks & standards'},
 {id:'audit',code:'AUD',name:'Audit & evidence'},
 {id:'thirdparty',code:'TPR',name:'Third-party risk'},
 {id:'incident',code:'IR',name:'Incident response'},
 {id:'toolkit',code:'ZBT',name:'Zero Breach Toolkit'},
 {id:'security',code:'SEC',name:'IT & security'},
 {id:'linux',code:'LNX',name:'Linux basics'},
 {id:'military',code:'MIL',name:'Military & defence'},
 {id:'ai',code:'AI',name:'AI governance'},
 {id:'refintech',code:'REF',name:'Real estate fintech'},
 {id:'career',code:'CAR',name:'Career prep'},
 {id:'misc',code:'MSC',name:'Uncategorized'}
];
const CAT=Object.fromEntries(CATS.map(c=>[c.id,c]));
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').trim().toLowerCase();

let entries=[], loaded=false, db=null, canWrite=true, dbState='connecting';
let filt={cat:'all',kind:'all',q:''}, selId=null, mode='view', confirmDel=false, draft=null;

function kindOf(e){return e.kind==='note'?'note':e.kind==='question'?'question':'term'}
function catOf(e){return CAT[e.category]||CAT.misc}
function byTitle(t){const n=norm(t);return entries.find(e=>norm(e.title)===n)}
function visible(){
  const q=norm(filt.q);
  return entries.filter(e=>{
    if(filt.cat!=='all' && (CAT[e.category]?e.category:'misc')!==filt.cat) return false;
    if(filt.kind==='term' && kindOf(e)!=='term') return false;
    if(filt.kind==='question' && kindOf(e)!=='question') return false;
    if(filt.kind==='note' && e.kind!=='note') return false;
    if(filt.kind==='flagged' && !e.flagged) return false;
    if(!q) return true;
    return [e.title,e.summary,e.detail,e.example,(e.tags||[]).join(' '),(e.related||[]).join(' ')].some(f=>norm(f).includes(q));
  }).sort((a,b)=>{
    if(q){const at=norm(a.title).includes(q),bt=norm(b.title).includes(q); if(at!==bt) return at?-1:1;}
    return a.title.localeCompare(b.title,undefined,{sensitivity:'base'});
  });
}
function inl(s){return esc(s).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>')}
function rich(s){
  if(!s||!String(s).trim()) return '';
  return String(s).trim().split('```').map((part,i)=>{
    if(i%2===1){
      const code=part.replace(/^\n/,'').replace(/\s+$/,'');
      return '<div class="codewrap"><button class="btn copy" type="button" data-act="copy">Copy</button><pre><code>'+esc(code)+'</code></pre></div>';
    }
    if(!part.trim()) return '';
    return part.trim().split(/\n\s*\n/).map(b=>{
      const lines=b.split('\n').filter(l=>l.trim());
      if(lines.length && lines.every(l=>/^\s*[-•*]\s+/.test(l))) return '<ul>'+lines.map(l=>'<li>'+inl(l.replace(/^\s*[-•*]\s+/,''))+'</li>').join('')+'</ul>';
      return '<p>'+lines.map(inl).join('<br>')+'</p>';
    }).join('');
  }).join('');
}
function copyCode(btn){
  const c=btn.parentElement.querySelector('code'); if(!c) return;
  const pick=()=>{const r=document.createRange();r.selectNodeContents(c);const g=getSelection();g.removeAllRanges();g.addRange(r);toast('Press Ctrl+C to copy')};
  try{navigator.clipboard.writeText(c.textContent).then(()=>toast('Copied')).catch(pick)}catch(x){pick()}
}
function fmtDate(ms){if(!ms) return '';try{return new Date(ms).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})}catch{return ''}}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}

/* ---------- render ---------- */
function render(){
  const terms=entries.filter(e=>kindOf(e)==='term').length, notes=entries.filter(e=>kindOf(e)==='note').length, qs=entries.length-terms-notes;
  $('#count').textContent=loaded?`${terms} terms · ${notes} notes · ${qs} questions`:'';
  renderStatus(); renderRail(); renderChips(); renderLedger();
  if(mode==='view') renderDetail();
  $('#newBtn').disabled=!db||!canWrite;
}
function renderStatus(){
  const s=$('#status');
  const msg={offline:'Your saved entries can only load when this page is opened on claude.ai while signed in.',error:'The connection to your saved entries dropped. Reload the page to reconnect.',readonly:'You can read this guide but not change it.',nosave:'This browser is not keeping your changes. Use Export to keep a copy.'}[dbState];
  s.hidden=!msg; if(msg) s.textContent=msg;
}
function counts(){const c={};entries.forEach(e=>{const k=CAT[e.category]?e.category:'misc';c[k]=(c[k]||0)+1});return c}
function renderRail(){
  const c=counts();
  const cats=CATS.filter(x=>x.id!=='misc'||c.misc);
  const kinds=[['all','All'],['term','Terms'],['note','Notes'],['question','Questions'],['flagged','To review']];
  $('#rail').innerHTML=
    `<div class="label">Show</div><div class="kinds">${kinds.map(([k,l])=>`<button class="pill" data-kind="${k}" aria-pressed="${filt.kind===k}">${l}</button>`).join('')}</div>`+
    `<div class="label">Domains</div><nav>`+
    `<button class="catbtn" data-cat="all" aria-pressed="${filt.cat==='all'}"><span class="code">ALL</span><span>Everything</span><span class="n">${entries.length}</span></button>`+
    cats.map(x=>`<button class="catbtn" data-cat="${x.id}" aria-pressed="${filt.cat===x.id}"><span class="code">${x.code}</span><span>${esc(x.name)}</span><span class="n">${c[x.id]||0}</span></button>`).join('')+`</nav>`;
}
function renderChips(){
  const c=counts();
  const kinds=[['term','Terms'],['note','Notes'],['question','Questions'],['flagged','To review']];
  $('#chips').innerHTML=
    `<button class="pill" data-cat="all" aria-pressed="${filt.cat==='all'&&filt.kind==='all'}">All</button>`+
    kinds.map(([k,l])=>`<button class="pill" data-kind="${k}" aria-pressed="${filt.kind===k}">${l}</button>`).join('')+
    CATS.filter(x=>c[x.id]).map(x=>`<button class="pill" data-cat="${x.id}" aria-pressed="${filt.cat===x.id}">${x.code} · ${esc(x.name)}</button>`).join('');
}
function renderLedger(){
  const list=visible();
  const heading=filt.cat==='all'?'All entries':CAT[filt.cat].name;
  let body;
  if(!loaded){
    body=dbState==='offline'
      ?`<div class="empty"><strong>Nothing loaded</strong>Open this page on claude.ai while signed in to see your entries.</div>`
      :`<div class="empty"><strong>Loading your guide…</strong>Your terms and notes will appear here.</div>`;
  } else if(!entries.length){
    body=`<div class="empty"><strong>Your guide is empty</strong>Use “+ New entry” to add your first term or note.</div>`;
  } else if(!list.length){
    body=`<div class="empty"><strong>No matches</strong>${filt.q?`Nothing matches “${esc(filt.q)}”.`:'Nothing in this view yet.'} ${canWrite&&db?'<button class="btn" data-act="new-from-search" style="margin-top:10px">Add “'+esc(filt.q||'new entry')+'”</button>':''}</div>`;
  } else {
    body='<ul>'+list.map(e=>`<li><button class="row" data-id="${esc(e.id)}" aria-current="${e.id===selId}">
      <span class="t"><span class="tag-code">${catOf(e).code}</span>${kindOf(e)==='note'?'<span class="kind-note">NOTE</span>':kindOf(e)==='question'?'<span class="kind-note">Q</span>':''}<span class="title">${esc(e.title)}</span>${e.flagged?'<span class="flagdot" title="Marked to review"></span>':''}</span>
      <span class="s">${esc(e.summary||'')}</span></button></li>`).join('')+'</ul>';
  }
  $('#ledger').innerHTML=`<div class="ledger-head"><h2>${esc(heading)}</h2><span class="label">${loaded?list.length:''}</span></div>`+body;
}
function renderDetail(){
  const el=$('#detail');
  const e=entries.find(x=>x.id===selId);
  if(!e){renderWelcome();return}
  const c=catOf(e);
  const rel=(e.related||[]).filter(Boolean);
  const back=entries.filter(x=>x.id!==e.id && (x.related||[]).some(r=>norm(r)===norm(e.title)) && !rel.some(r=>norm(r)===norm(x.title)));
  el.innerHTML=`<article class="entry">
    <button class="btn ghost back" data-act="back">← All entries</button>
    <div class="eyebrow"><span class="code">${c.code}</span><span class="label">${esc(c.name)}</span><span class="label">· ${kindOf(e)==='note'?'Note':kindOf(e)==='question'?'Interview question':'Term'}</span></div>
    <h2 class="title">${esc(e.title)}</h2>
    ${e.flagged?'<div class="flagbanner"><span class="flagdot"></span>Marked to review</div>':''}
    ${e.summary?`<p class="lead">${esc(e.summary)}</p>`:''}
    ${e.detail?`<section class="sect"><h3 class="label">Notes</h3>${rich(e.detail)}</section>`:''}
    ${e.example?`<section class="sect"><h3 class="label">Example</h3><div class="example">${rich(e.example)}</div></section>`:''}
    ${rel.length?`<section class="sect"><h3 class="label">Related</h3><div class="links">${rel.map(r=>{const t=byTitle(r);return t?`<button class="link" data-id="${esc(t.id)}">${esc(t.title)}</button>`:`<span class="link missing" title="No entry yet">${esc(r)}</span>`}).join('')}</div></section>`:''}
    ${(e.links||[]).length?`<section class="sect"><h3 class="label">Official sources</h3><div class="links">${e.links.map(l=>`<a class="link" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label)} ↗</a>`).join('')}</div><p class="hint" style="margin:6px 0 0;font-size:12px;color:var(--muted)">Links can move. If one fails, search the name.</p></section>`:''}
    ${back.length?`<section class="sect"><h3 class="label">Linked from</h3><div class="links">${back.map(t=>`<button class="link" data-id="${esc(t.id)}">${esc(t.title)}</button>`).join('')}</div></section>`:''}
    ${(e.tags||[]).length?`<section class="sect"><div class="tags">${e.tags.map(t=>`<span>#${esc(t)}</span>`).join('')}</div></section>`:''}
    <div class="meta">
      <span class="when">${e.updatedAt?'Updated '+fmtDate(e.updatedAt):''}</span>
      ${db&&canWrite?`<button class="btn" data-act="flag">${e.flagged?'Mark reviewed':'Mark to review'}</button>
      <button class="btn" data-act="edit">Edit</button>
      <button class="btn danger" data-act="ask-delete">Delete</button>`:''}
      ${confirmDel?`<div class="confirm">Delete “${esc(e.title)}” for good? <button class="btn danger solid" data-act="delete">Delete</button><button class="btn" data-act="cancel-delete">Keep it</button></div>`:''}
    </div>
  </article>`;
}
function renderWelcome(){
  const terms=entries.filter(e=>kindOf(e)==='term').length, notes=entries.filter(e=>kindOf(e)==='note').length, flagged=entries.filter(e=>e.flagged).length;
  const recent=[...entries].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).slice(0,6);
  $('#detail').innerHTML=`<div class="entry welcome">
    <h2>Your GRC reference</h2>
    <p>Terms, notes and interview questions for a compliance officer role in real estate fintech, with GRC and IT behind it. Search from the top bar, filter by domain, and add to it as you learn. Each entry links to related terms, so the guide grows into a connected map.</p>
    ${loaded?`<div class="stats"><div><b>${terms}</b><span>terms</span></div><div><b>${notes}</b><span>notes</span></div><div><b>${entries.length-terms-notes}</b><span>questions</span></div><div><b>${counts()&&Object.keys(counts()).length}</b><span>domains</span></div><div><b>${flagged}</b><span>to review</span></div></div>`:''}
    ${(()=>{const st=['Compliance Officer (role)','Real estate fintech compliance map','Compliance program (PCMLTFA)','Red flags in real estate','Tell me about yourself (compliance angle)'].map(byTitle).filter(Boolean);return st.length?`<div class="label">Start here</div><div class="links recent">${st.map(t=>`<button class="link" data-id="${esc(t.id)}">${esc(t.title)}</button>`).join('')}</div>`:''})()}
    ${recent.length?`<div class="label">Recently updated</div><div class="links recent">${recent.map(t=>`<button class="link" data-id="${esc(t.id)}">${esc(t.title)}</button>`).join('')}</div>`:''}
  </div>`;
}

/* ---------- editor ---------- */
function openEditor(e,preset){
  mode=e?'edit':'new'; confirmDel=false;
  draft=e?{...e,related:(e.related||[]).join(', '),tags:(e.tags||[]).join(', '),links:(e.links||[]).map(l=>l.label+' | '+l.url).join('\n')}:{kind:'term',title:preset||'',category:filt.cat!=='all'?filt.cat:'foundations',summary:'',detail:'',example:'',related:'',tags:'',links:''};
  showView('detail');
  $('#detail').innerHTML=`<form class="editor" id="ed" novalidate>
    <button class="btn ghost back" type="button" data-act="cancel-edit">← Cancel</button>
    <h2>${e?'Edit entry':'New entry'}</h2>
    <div class="seg" role="group" aria-label="Entry type">
      <button type="button" data-k="term" aria-pressed="${kindOf(draft)==='term'}">Term</button>
      <button type="button" data-k="note" aria-pressed="${draft.kind==='note'}">Note</button>
      <button type="button" data-k="question" aria-pressed="${draft.kind==='question'}">Question</button>
    </div>
    <div class="two">
      <div class="field"><label for="f-title">Title</label><input id="f-title" value="${esc(draft.title)}" placeholder="e.g. Segregation of duties"></div>
      <div class="field"><label for="f-cat">Domain</label><select id="f-cat">${CATS.map(c=>`<option value="${c.id}" ${c.id===(CAT[draft.category]?draft.category:'misc')?'selected':''}>${c.code} · ${esc(c.name)}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label for="f-sum">Plain-language definition</label><span class="hint">One or two sentences you could say in an interview.</span><textarea id="f-sum" rows="3">${esc(draft.summary)}</textarea></div>
    <div class="field"><label for="f-det">Notes</label><span class="hint">Leave a blank line between paragraphs. Start lines with “- ” for a bulleted list. Put commands between lines of three backticks to make a code block.</span><textarea id="f-det" rows="7">${esc(draft.detail)}</textarea></div>
    <div class="field"><label for="f-ex">Example</label><textarea id="f-ex" rows="3">${esc(draft.example)}</textarea></div>
    <div class="two">
      <div class="field"><label for="f-rel">Related entries</label><span class="hint">Titles, separated by commas.</span><input id="f-rel" value="${esc(draft.related)}" list="titles"></div>
      <div class="field"><label for="f-tags">Tags</label><span class="hint">Separated by commas.</span><input id="f-tags" value="${esc(draft.tags)}" placeholder="interview, canada"></div>
    </div>
    <div class="field"><label for="f-links">Official sources</label><span class="hint">One per line: Label | https://link</span><textarea id="f-links" rows="2">${esc(draft.links)}</textarea></div>
    <datalist id="titles">${entries.map(x=>`<option value="${esc(x.title)}">`).join('')}</datalist>
    <div class="err" id="f-err" hidden></div>
    <div class="actions"><button class="btn primary" type="submit" id="f-save">${e?'Save changes':'Add to guide'}</button><button class="btn" type="button" data-act="cancel-edit">Cancel</button></div>
  </form>`;
  $('#f-title').focus();
}
const split=s=>String(s||'').split(',').map(x=>x.trim()).filter(Boolean);
function slug(t){return (norm(t).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'entry')+'-'+Math.random().toString(36).slice(2,6)}
async function saveEditor(ev){
  ev.preventDefault();
  const err=$('#f-err'); err.hidden=true;
  const title=$('#f-title').value.trim();
  if(!title){err.textContent='Add a title before saving.';err.hidden=false;$('#f-title').focus();return}
  const dup=byTitle(title);
  if(dup && dup.id!==draft.id){err.textContent=`“${dup.title}” is already in your guide. Edit that entry or choose a different title.`;err.hidden=false;return}
  const now=Date.now();
  const body={kind:draft.kind==='note'?'note':draft.kind==='question'?'question':'term',title,category:$('#f-cat').value,summary:$('#f-sum').value.trim(),detail:$('#f-det').value.trim(),example:$('#f-ex').value.trim(),
    related:split($('#f-rel').value),tags:split($('#f-tags').value).map(t=>t.replace(/^#/,'')),links:$('#f-links').value.split('\n').map(l=>{const i=l.indexOf('|');const u=(i<0?l:l.slice(i+1)).trim();const b=i<0?'':l.slice(0,i).trim();return /^https?:\/\//i.test(u)?{label:b||u,url:u}:null}).filter(Boolean),flagged:!!draft.flagged,createdAt:draft.createdAt||now,updatedAt:now};
  const id=draft.id||slug(title);
  const btn=$('#f-save'); btn.disabled=true; btn.textContent='Saving…';
  try{
    await db.collection('entries').doc(id).set(body);
    const wasEdit=mode==='edit'; mode='view'; selId=id; draft=null; toast(wasEdit?'Saved':'Added to your guide'); render();
  }catch(x){
    btn.disabled=false; btn.textContent='Try again';
    err.textContent=x&&x.code==='quota_exceeded'?'Your guide is full. Delete some entries, then save again.':x&&x.code==='invalid_argument'?'This entry could not be saved. You may not have permission to edit this guide.':'Saving failed. Check your connection and try again.';
    err.hidden=false;
  }
}

/* ---------- flashcards ---------- */
let deck=[],di=0,shown=false;
function openCards(){
  deck=visible().filter(e=>kindOf(e)!=='note'&&(e.summary||e.detail));
  if(!deck.length){toast('No terms with definitions in this view');return}
  deck=shuffle(deck); di=0; shown=false; drawCard();
}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function drawCard(){
  const o=$('#overlay'); const e=deck[di]; const c=catOf(e);
  o.className='overlay'; o.hidden=false;
  o.innerHTML=`<div class="card" role="dialog" aria-modal="true" aria-label="Flashcards">
    <div class="top"><span class="label">${c.code} · Card ${di+1} of ${deck.length}</span><button class="btn ghost" data-act="close-cards">Close</button></div>
    <div><div class="label">${kindOf(e)==='question'?'How would you answer?':'What does this mean?'}</div><div class="q">${esc(e.title)}</div></div>
    ${shown?`<div class="a">${kindOf(e)==='question'?rich(e.detail||e.summary):`<p>${esc(e.summary)}</p>`}${e.example?`<div class="example">${rich(e.example)}</div>`:''}</div>`:`<button class="btn primary" data-act="reveal">Show answer</button>`}
    <div class="nav"><button class="btn" data-act="prev" ${di===0?'disabled':''}>Previous</button>
      <span style="display:flex;gap:8px">${shown?`<button class="btn" data-act="open-card">Open entry</button>`:''}<button class="btn" data-act="next">${di===deck.length-1?'Start over':'Next'}</button></span></div>
  </div>`;
}
function closeCards(){const o=$('#overlay');o.hidden=true;o.innerHTML=''}

/* ---------- interactions ---------- */
function showView(v){$('#app').dataset.view=v}
function select(id){selId=id;mode='view';confirmDel=false;showView('detail');render();$('#detail').scrollTop=0}
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('button'); if(!t) return;
  if(t.dataset.cat){filt.cat=t.dataset.cat; if(t.closest('#chips')&&t.dataset.cat==='all') filt.kind='all'; render(); return}
  if(t.dataset.kind){filt.kind=filt.kind===t.dataset.kind&&t.closest('#chips')?'all':t.dataset.kind; render(); return}
  if(t.dataset.k){draft.kind=t.dataset.k; t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===t)); return}
  if(t.dataset.id && !t.closest('#overlay')){select(t.dataset.id); return}
  const a=t.dataset.act; if(!a) return;
  if(a==='copy'){copyCode(t);return}
  const e=entries.find(x=>x.id===selId);
  if(a==='back'){showView('list');return}
  if(a==='edit'&&e) openEditor(e);
  if(a==='cancel-edit'){mode='view';draft=null;showView(selId?'detail':'list');render()}
  if(a==='new-from-search') openEditor(null,filt.q);
  if(a==='ask-delete'){confirmDel=true;renderDetail()}
  if(a==='cancel-delete'){confirmDel=false;renderDetail()}
  if(a==='delete'&&e){try{await db.collection('entries').doc(e.id).delete();selId=null;confirmDel=false;showView('list');toast('Deleted');render()}catch{toast('Delete failed. Try again.')}}
  if(a==='flag'&&e){try{await db.collection('entries').doc(e.id).update({flagged:!e.flagged,updatedAt:Date.now()});toast(e.flagged?'Marked reviewed':'Marked to review')}catch{toast('Could not update. Try again.')}}
  if(a==='reveal'){shown=true;drawCard()}
  if(a==='next'){di=(di+1)%deck.length;shown=false;drawCard()}
  if(a==='prev'&&di>0){di--;shown=false;drawCard()}
  if(a==='close-cards') closeCards();
  if(a==='open-card'){const id=deck[di].id;closeCards();select(id)}
});
$('#overlay').addEventListener('click',ev=>{if(ev.target.id==='overlay') closeCards()});
document.addEventListener('keydown',ev=>{
  if($('#overlay').hidden) {
    if(ev.key==='/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ev.preventDefault();$('#q').focus()}
    return;
  }
  if(ev.key==='Escape') closeCards();
  else if(ev.key===' '||ev.key==='Enter'){if(!shown){ev.preventDefault();shown=true;drawCard()}}
  else if(ev.key==='ArrowRight'){di=(di+1)%deck.length;shown=false;drawCard()}
  else if(ev.key==='ArrowLeft'&&di>0){di--;shown=false;drawCard()}
});
document.addEventListener('submit',ev=>{if(ev.target.id==='ed') saveEditor(ev)});
$('#q').addEventListener('input',ev=>{filt.q=ev.target.value;renderLedger()});
$('#q').addEventListener('keydown',ev=>{if(ev.key==='Enter'){const v=visible();if(v[0]) select(v[0].id)}});
$('#newBtn').addEventListener('click',()=>openEditor(null));
$('#cardsBtn').addEventListener('click',openCards);
$('#exportBtn').addEventListener('click',()=>{
  const data=JSON.stringify({app:'grc-field-guide',version:1,exportedAt:new Date().toISOString(),entries:arr},null,2);
  const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));
  const a=document.createElement('a'); a.href=url; a.download='grc-field-guide-backup.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000); toast('Backup downloaded');
});
$('#importBtn').addEventListener('click',()=>$('#importFile').click());
$('#importFile').addEventListener('change',async ev=>{
  const f=ev.target.files[0]; ev.target.value=''; if(!f) return;
  try{
    const j=JSON.parse(await f.text()); const list=Array.isArray(j)?j:j.entries;
    if(!Array.isArray(list)) throw new Error('shape');
    let added=0, updated=0;
    list.forEach(x=>{
      if(!x||typeof x.title!=='string'||!x.title.trim()) return;
      const id=(typeof x.id==='string'&&x.id)?x.id:slug(x.title);
      const i=arr.findIndex(e=>e.id===id);
      if(i<0){arr.push({...x,id});added++}
      else if((x.updatedAt||0)>(arr[i].updatedAt||0)){arr[i]={...x,id};updated++}
    });
    persist(); emit(); toast('Imported: '+added+' new, '+updated+' updated');
  }catch(x){toast('That file is not a Field Guide backup')}
});

/* ---------- data ---------- */
/* ---------- data: built-in entries, edits kept in this browser ---------- */
const STORE_KEY='grc-field-guide-v1';
let arr=[], listeners=[];
function loadLocal(){
  try{const r=localStorage.getItem(STORE_KEY); if(r){const a=JSON.parse(r); if(Array.isArray(a)) return a}}catch(x){}
  return null;
}
function persist(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(arr))}catch(x){dbState='nosave'}
}
function snapshot(){
  return {docs:arr.map(e=>({id:e.id,exists:true,data:()=>{const o={...e};delete o.id;return o}}))};
}
function emit(){listeners.forEach(fn=>{try{fn(snapshot())}catch(x){}})}
const localDb={collection(){return {
  onSnapshot(next){listeners.push(next);next(snapshot());return ()=>{listeners=listeners.filter(f=>f!==next)}},
  doc(id){return {
    async set(body){const rec={...body,id};const i=arr.findIndex(e=>e.id===id);if(i>=0)arr[i]=rec;else arr.push(rec);persist();emit()},
    async update(patch){const i=arr.findIndex(e=>e.id===id);if(i<0) throw {code:'invalid_argument'};arr[i]={...arr[i],...patch};persist();emit()},
    async delete(){arr=arr.filter(e=>e.id!==id);persist();emit()}
  }}
}}};
const SEEN_KEY='grc-field-guide-seen-v1';
const LEGACY_IDS=["aar","accept-risk-response","access-review","adding-an-appimage-to-the-app-menu","administrative-control","ai-bias","air-gap-and-classified-networks","anti-money-laundering-aml","appimage-flatpak-or-rpm","appimage-troubleshooting","appimage","apt","archives-tar-and-zip","ato","audit","avoid-risk-response","backup-and-recovery","beneficial-ownership","bluf","breach-notification-clocks","bridge-letter","business-continuity-and-disaster-recovery-bcp-dr","business-email-compromise-bec","c2","c4isr","caf-and-dnd","cccs","chain-of-command","change-management","classification-levels","classifying-a-control","cmmc","coa-conops-and-opord","commander-s-intent","complementary-user-entity-controls-cuecs","compliance","comsec","consent","consumer-driven-banking","continuous-monitoring","control","coop","cop","corrective-control","cpcsc","cse","cui","cyber-insurance","cybercom","data-minimization","data-processing-agreement-dpa","data-retention","defense-in-depth","deficiency","detective-control","disa","disk-and-storage-commands","dnf-and-rpm","dod","electronic-signatures","electronic-warfare-ew","encryption","eu-ai-act","evidence","fedora-setup-checklist","fedora","file-permissions-chmod","fintrac","firewalld","five-eyes","flatpak","fourth-party","full-disk-encryption-luks","fuse","gdpr","grc-certifications","grc-roles","grc-tools","grc","hashing","identity-and-access-management-iam","incident-response-plan-irp","infosec","inherent-risk","insider-threat","intelligence-disciplines-sigint-humint-osint","internal-audit","iso-27001","iso-42001","itsg-33","key-risk-indicator-kri","kill-chain","know-your-customer-kyc","least-privilege","linux-distribution-distro","linux-filesystem-layout","linux-in-an-audit","linux-networking-commands","logging-and-monitoring","logs-with-journalctl","military-jobs-that-map-to-grc-and-it","mitigate-risk-response","mitre-att-ck","multi-factor-authentication-mfa","nato-phonetic-alphabet","nato","need-to-know","nist-ai-risk-management-framework","nist-cybersecurity-framework-csf","nist-sp-800-171","nist-sp-800-53","nsa","oco-and-dco","ooda-loop","operating-effectiveness","opsec","osfi-b-10","osfi-b-13","pace-plan","path-and-shell-config","pci-dss","personal-information-pi","phishing","physical-control","pipeda","pipes-and-redirects","poa-m","policy-standard-procedure","post-incident-review","preventive-control","privacy-impact-assessment-pia","processes-and-resource-use","quebec-law-25","ransomware","readiness-assessment","readiness-levels-defcon-fpcon-cpcon","real-estate-wire-fraud","real-risk-of-significant-harm-rrosh","red-blue-and-purple-teams","remediation-plan","residual-risk","right-to-audit","risk-appetite","risk-likelihood-impact","risk-management-cycle","risk-register","risk","rmf","roe","role-based-access-control-rbac","rto-and-rpo","running-an-appimage-on-fedora","sampling","scheduled-jobs-cron-and-systemd-timers","scif","search-and-text-tools-grep-and-find","security-questionnaire","segregation-of-duties","selinux","shared-responsibility-model","siem","single-sign-on-sso","sitrep","soc-2-type-i-vs-type-ii","soc-2","sop","ssh-and-keys","stig","sudo-and-root","systemd-and-systemctl","tabletop-exercise","technical-control","tenant-screening","terminal-and-shell","third-party-risk-management-tprm","three-lines-model","title-fraud","tlp","tokenization","transfer-risk-response","tresa-and-reco","trust-account","ttps","two-person-integrity","unified-control-framework","vendor-tiering","verifying-a-download","vulnerability-management","why-military-and-cyber-overlap","why-my-real-estate-background-helps","windows-exe-files-on-linux","you-can-transfer-the-work-not-the-responsibility","zero-trust","zulu-time-and-dtg"];
function loadSeen(saved){
  try{const r=localStorage.getItem(SEEN_KEY); if(r){const a=JSON.parse(r); if(Array.isArray(a)) return a}}catch(x){}
  return saved?LEGACY_IDS:[];
}
function init(){
  const saved=loadLocal();
  arr=(saved||SEED).map(e=>({...e}));
  /* bring in built-in entries added in newer versions, without touching edits or deletions */
  const seen=new Set(loadSeen(saved)); let added=0;
  SEED.forEach(e=>{ if(!seen.has(e.id) && !arr.some(x=>x.id===e.id)){arr.push({...e});added++} });
  try{localStorage.setItem(SEEN_KEY,JSON.stringify(SEED.map(e=>e.id)))}catch(x){}
  if(saved&&added) persist();
  db=localDb; canWrite=true; dbState='ok';
  db.collection('entries').onSnapshot(snap=>{
    entries=snap.docs.filter(d=>d.exists).map(d=>{const x=d.data()||{};return {id:d.id,title:String(x.title||'Untitled'),kind:x.kind,category:x.category,summary:x.summary||'',detail:x.detail||'',example:x.example||'',related:Array.isArray(x.related)?x.related:[],tags:Array.isArray(x.tags)?x.tags:[],links:Array.isArray(x.links)?x.links.filter(l=>l&&/^https?:\/\//i.test(l.url||'')):[],flagged:!!x.flagged,createdAt:x.createdAt,updatedAt:x.updatedAt}});
    loaded=true;
    if(selId && !entries.some(e=>e.id===selId) && mode==='view') selId=null;
    render();
  });
}
render();
init();
</script>
