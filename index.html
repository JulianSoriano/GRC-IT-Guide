anual on international law and cyber operations.\n- The NATO phonetic alphabet is the global standard for spelling by voice.","example":"","flagged":false,"kind":"term","related":["NATO phonetic alphabet","Five Eyes"],"summary":"North Atlantic Treaty Organization: a 32-member military alliance that includes Canada and the US.","tags":["organizations","military"],"title":"NATO","updatedAt":1792182599954,"id":"nato"},{"category":"military","createdAt":1792182600000,"detail":"It is least privilege for information. Role-based access and regular access reviews put it into practice.","example":"","flagged":false,"kind":"term","related":["Least privilege","Classification levels","Role-based access control (RBAC)"],"summary":"Even with the right clearance, a person gets only the information they need for their job.","tags":["classification","access","military"],"title":"Need to know","updatedAt":1792182599966,"id":"need-to-know"},{"category":"ai","createdAt":1790983894413,"detail":"","example":"","flagged":false,"kind":"term","related":["NIST Cybersecurity Framework (CSF)"],"summary":"A voluntary US framework for managing AI risk, organized into four functions: Govern, Map, Measure, Manage.","tags":["lesson-8"],"title":"NIST AI Risk Management Framework","updatedAt":1790983894326,"id":"nist-ai-risk-management-framework"},{"category":"frameworks","createdAt":1790983894413,"detail":"No certification; companies self-assess and set target maturity levels. The functions map to control types: Protect ≈ preventive, Detect ≈ detective, Recover ≈ corrective.","example":"","flagged":false,"kind":"term","related":["Preventive control","Unified control framework"],"summary":"A free, voluntary framework from the US standards agency, popular as a starting point. Version 2.0 has six functions: Govern, Identify, Protect, Detect, Respond, Recover.","tags":["lesson-5"],"title":"NIST Cybersecurity Framework (CSF)","updatedAt":1790983894372,"id":"nist-cybersecurity-framework-csf"},{"category":"military","createdAt":1792182600000,"detail":"Revision 2 has 110 requirements in 14 families. Revision 3 reorganizes them into 97. CMMC Level 2 is based on Revision 2.","example":"","flagged":false,"kind":"term","related":["CUI","CMMC","NIST SP 800-53"],"summary":"The requirements for protecting CUI on non-federal systems, such as a contractor's network.","tags":["frameworks","us","military"],"title":"NIST SP 800-171","updatedAt":1792182599948,"id":"nist-sp-800-171"},{"category":"military","createdAt":1792182600000,"detail":"- Revision 5 has 20 control families, including Access Control (AC), Audit and Accountability (AU), Incident Response (IR) and Risk Assessment (RA).\n- It is the basis for the RMF, FedRAMP and Canada's ITSG-33 catalogue.\n- Handy as a source when you write control descriptions.","example":"","flagged":false,"kind":"term","related":["RMF","ITSG-33","Unified control framework"],"summary":"A large catalogue of security and privacy controls for US federal systems, now used well beyond government.","tags":["frameworks","us","military"],"title":"NIST SP 800-53","updatedAt":1792182599949,"id":"nist-sp-800-53"},{"category":"military","createdAt":1792182600000,"detail":"It publishes security guidance and sets the cryptography rules for national security systems.","example":"","flagged":false,"kind":"term","related":["COMSEC","CYBERCOM","Five Eyes"],"summary":"National Security Agency: the US agency for signals intelligence and for securing national security systems.","tags":["us","organizations","military"],"title":"NSA","updatedAt":1792182599960,"id":"nsa"},{"category":"military","createdAt":1792182600000,"detail":"- The US also names a third mission, DODIN operations: running and securing DoD networks.\n- In Canada, the CSE Act (2019) authorizes CSE to conduct active and defensive cyber operations.\n- Commercial blue team work looks like DCO.","example":"","flagged":false,"kind":"term","related":["CSE","CYBERCOM","Red, blue and purple teams"],"summary":"Offensive and defensive cyber operations: military missions to act against an adversary's systems, or to defend one's own.","tags":["cyber","military"],"title":"OCO and DCO","updatedAt":1792182599987,"id":"oco-and-dco"},{"category":"military","createdAt":1792182600000,"detail":"In incident response it argues for fast detection, clear decision authority and rehearsed plans, so the defender cycles faster than the attacker.","example":"","flagged":false,"kind":"term","related":["Incident Response Plan (IRP)","SITREP","Chain of command"],"summary":"Observe, orient, decide, act. A decision cycle from US Air Force Colonel John Boyd: the side that cycles faster gets inside the other side's decisions.","tags":["cyber","incident","military"],"title":"OODA loop","updatedAt":1792182599989,"id":"ooda-loop"},{"category":"audit","createdAt":1790983894413,"detail":"","example":"","flagged":false,"kind":"term","related":["SOC 2 Type I vs Type II"],"summary":"Whether a control actually worked every time over a period. Contrasted with design, which asks whether the control would reduce the risk if it worked.","tags":["lesson-6"],"title":"Operating effectiveness","updatedAt":1790983894365,"id":"operating-effectiveness"},{"category":"military","createdAt":1792182600000,"detail":"The five steps:\n- Identify critical information\n- Analyze the threats\n- Analyze the vulnerabilities\n- Assess the risk\n- Apply countermeasures\n\nIt follows the same logic as the risk management cycle. In cyber, OPSEC failures are oversharing: staff posting about internal tools, job ads that list the whole tech stack, photos showing badges or screens.","example":"A broker posts a listing photo that shows a lockbox with the code visible.","flagged":false,"kind":"term","related":["Risk management cycle","Phishing","Business email compromise (BEC)","COMSEC"],"summary":"Operations security: a process for finding the information an adversary could piece together, and protecting it.","tags":["cyber","military"],"title":"OPSEC","updatedAt":1792182599996,"id":"opsec"},{"category":"privacy","createdAt":1790983894413,"detail":"Expects banks and insurers to assess, contract with and monitor vendors based on risk. If your fintech sells to a bank, you are their third party and will face their B-10 due diligence.","example":"","flagged":false,"kind":"term","related":["Third-Party Risk Management (TPRM)","OSFI B-13"],"summary":"OSFI's guideline on third-party risk management for federally regulated financial institutions. The current version took effect in May 2024.","tags":["canada","financial","vendors"],"title":"OSFI B-10","updatedAt":1790983894376,"id":"osfi-b-10"},{"category":"privacy","createdAt":1790983894413,"detail":"Covers governance, technology operations and resilience, and cyber security. Fintechs selling to Canadian banks often need to show they support their clients' B-13 obligations.","example":"","flagged":false,"kind":"term","related":["OSFI B-10","NIST Cybersecurity Framework (CSF)"],"summary":"OSFI's guideline on technology and cyber risk management for federally regulated financial institutions in Canada, in effect since January 2024.","tags":["canada","financial"],"title":"OSFI B-13","updatedAt":1790983894377,"id":"osfi-b-13"},{"category":"military","createdAt":1792182600000,"detail":"For incident communications when normal tools fail:\n- Primary: company email\n- Alternate: chat tool\n- Contingency: phone calls from a printed contact list\n- Emergency: in person, or text messages to personal phones","example":"","flagged":false,"kind":"term","related":["COOP","Incident Response Plan (IRP)"],"summary":"Primary, alternate, contingency, emergency: a way to plan several fallback methods in order.","tags":["resilience","communication","military"],"title":"PACE plan","updatedAt":1792182599977,"id":"pace-plan"},{"category":"linux","createdAt":1792173300000,"detail":"```\necho $PATH\nwhich python3\nexport PATH=\"$HOME/.local/bin:$PATH\"     # add a folder (put it in ~/.bashrc to keep it)\nsource ~/.bashrc                         # reload settings\nln -s ~/Applications/MyApp-x86_64.AppImage ~/.local/bin/myapp\n```\n\n- Fedora's default `.bashrc` already includes `~/.local/bin` in PATH.\n- After the `ln -s` line above, typing `myapp` runs the AppImage from anywhere.","example":"","flagged":false,"kind":"term","related":["Adding an AppImage to the app menu","Terminal and shell"],"summary":"PATH is the list of folders the shell searches when you type a command name. ~/.bashrc runs each time you open a terminal.","tags":["basics","appimage","linux"],"title":"PATH and shell config","updatedAt":1792173299973,"id":"path-and-shell-config"},{"category":"frameworks","createdAt":1790983894413,"detail":"Current version is 4.0.1. Using a payment provider so card numbers never touch your systems shrinks your scope a lot, but some responsibilities remain.","example":"A rent-payment app taking credit cards must comply.","flagged":false,"kind":"term","related":["Transfer (risk response)","Tokenization"],"summary":"The mandatory security standard for anyone who stores, processes or transmits payment card data. Enforced by the card brands through contracts, not by governments.","tags":["lesson-5","payments"],"title":"PCI DSS","updatedAt":1790983894371,"id":"pci-dss"},{"category":"privacy","createdAt":1790983894413,"detail":"Some PI is sensitive and needs stronger protection: health, financial, government ID, biometric data.","example":"In a rental application: name, SIN, income, employer, credit report, references.","flagged":false,"kind":"term","related":["PIPEDA","Data minimization"],"summary":"Any information about an identifiable person. Names, emails, addresses, IP addresses, purchase history, and credit scores all count.","tags":["lesson-4"],"title":"Personal information (PI)","updatedAt":1790983894386,"id":"personal-information-pi"},{"category":"security","createdAt":1790983894413,"detail":"","example":"","flagged":false,"kind":"term","related":["Business email compromise (BEC)","Multi-factor authentication (MFA)"],"summary":"Fake messages that trick people into clicking links, giving up passwords or sending money.","tags":["threats"],"title":"Phishing","updatedAt":1790983894332,"id":"phishing"},{"category":"controls","createdAt":1790983894413,"detail":"","example":"Badge access, locked server rooms, cameras.","flagged":false,"kind":"term","related":["Technical control"],"summary":"A control that protects a physical place or device.","tags":["lesson-3"],"title":"Physical control","updatedAt":1790983894389,"id":"physical-control"},{"category":"privacy","createdAt":1790983894413,"detail":"Built on 10 fair information principles: accountability, identifying purposes, consent, limiting collection, limiting use/disclosure/retention, accuracy, safeguards, openness, individual access, challenging compliance.\n\nBreaches that create a real risk of significant harm must be reported to the Privacy Commissioner and affected individuals, and every breach must be recorded and the records kept for 24 months.\n\nA proposed replacement (Bill C-27) died when Parliament was prorogued in 2025. Check current status before an interview.","example":"Real estate brokerages are covered. Client consent forms and brokerage privacy policies exist because of it.","flagged":false,"kind":"term","related":["Real risk of significant harm (RROSH)","Quebec Law 25","Data minimization"],"summary":"Canada's federal private-sector privacy law. It applies to organizations that collect, use or disclose personal information in commercial activity.","tags":["canada","lesson-4","interview"],"title":"PIPEDA","updatedAt":1790983894385,"id":"pipeda"},{"category":"linux","createdAt":1792173300000,"detail":"```\nls -l | less\nps aux | grep ssh | wc -l\necho \"note\" > file.txt        # overwrite\necho \"more\" >> file.txt       # append\ncommand 2> errors.txt         # save error messages\nmake && echo done             # second command only if the first succeeded\n```\n\n`>` replaces the file without asking.","example":"","flagged":false,"kind":"term","related":["Terminal and shell","Search and text tools (grep and find)"],"summary":"Pipes send one command's output into another command. Redirects send output to a file.","tags":["commands","linux"],"title":"Pipes and redirects","updatedAt":1792173299974,"id":"pipes-and-redirects"},{"category":"military","createdAt":1792182600000,"detail":"It works like a remediation plan and is tracked until every item closes. Overdue items are a common audit concern.","example":"","flagged":false,"kind":"term","related":["Remediation plan","Deficiency","Risk register","ATO"],"summary":"Plan of action and milestones: the list of known weaknesses, who will fix each one, and by when.","tags":["frameworks","us","military"],"title":"POA&M","updatedAt":1792182599951,"id":"poa-m"},{"category":"foundations","createdAt":1790983894413,"detail":"- Policy: high level, approved by leadership. \"We protect customer data.\"\n- Standard: specific and measurable. \"Passwords must be 14+ characters with MFA.\"\n- Procedure: the steps. \"How to reset a user's MFA device.\"\n\nGuidelines are a fourth, optional layer: recommendations, not requirements.","example":"Acceptable Use Policy → Password Standard → Account Reset Procedure.","flagged":false,"kind":"term","related":["Administrative control","GRC"],"summary":"The three layers of written rules. A policy says what and why, a standard sets specific measurable requirements, and a procedure gives step-by-step how-to.","tags":["documentation"],"title":"Policy, standard, procedure","updatedAt":1790983894410,"id":"policy-standard-procedure"},{"category":"incident","createdAt":1790983894413,"detail":"Keep it blameless so people share honestly.","example":"","flagged":false,"kind":"term","related":["Risk register","Incident Response Plan (IRP)"],"summary":"A meeting after an incident to learn what went wrong and what to change. Findings feed the risk register.","tags":["lesson-8"],"title":"Post-incident review","updatedAt":1790983894349,"id":"post-incident-review"},{"category":"controls","createdAt":1790983894413,"detail":"","example":"MFA at login; verifying a client's ID before a deal; a lock-your-screen policy.","flagged":false,"kind":"term","related":["Detective control","Corrective control"],"summary":"Stops a problem before it happens.","tags":["lesson-3"],"title":"Preventive control","updatedAt":1790983894394,"id":"preventive-control"},{"category":"privacy","createdAt":1790983894413,"detail":"Required in some cases under Quebec Law 25 and expected as good practice elsewhere. Covers what data, why, who sees it, how long it's kept, and the risks.","example":"Run a PIA before launching AI-based tenant scoring.","flagged":false,"kind":"term","related":["Quebec Law 25","AI bias"],"summary":"A structured review of a new product or process to find and fix privacy risks before launch.","tags":["process"],"title":"Privacy impact assessment (PIA)","updatedAt":1790983894379,"id":"privacy-impact-assessment-pia"},{"category":"linux","createdAt":1792173300000,"detail":"```\ntop                         # live view (q to quit)\nps aux | grep firefox       # find a process\nkill 1234                   # ask process 1234 to stop\nkill -9 1234                # force stop, last resort\nfree -h                     # memory\nuptime                      # load average\n```","example":"","flagged":false,"kind":"note","related":["systemd and systemctl","Pipes and redirects"],"summary":"Commands to see what is running and how much memory and CPU it uses, and to stop what is stuck.","tags":["system","commands","linux"],"title":"Processes and resource use","updatedAt":1792173299982,"id":"processes-and-resource-use"},{"category":"privacy","createdAt":1790983894413,"detail":"Penalties can reach $25 million or 4% of worldwide turnover. Applies to businesses handling personal information of people in Quebec.","example":"","flagged":false,"kind":"term","related":["PIPEDA","Privacy impact assessment (PIA)"],"summary":"Quebec's privacy law and the strictest in Canada. It adds requirements like a named person responsible for privacy and privacy impact assessments.","tags":["canada","lesson-4"],"title":"Quebec Law 25","updatedAt":1790983894383,"id":"quebec-law-25"},{"category":"security","createdAt":1790983894413,"detail":"","example":"","flagged":false,"kind":"term","related":["Backup and recovery","Incident Response Plan (IRP)"],"summary":"Malware that locks or steals data and demands payment.","tags":["threats"],"title":"Ransomware","updatedAt":1790983894331,"id":"ransomware"},{"category":"audit","createdAt":1790983894413,"detail":"","example":"","flagged":false,"kind":"term","related":["Internal audit","SOC 2"],"summary":"A practice audit before the real external audit, to find and fix gaps privately.","tags":["lesson-6"],"title":"Readiness assessment","updatedAt":1790983894362,"id":"readiness-assessment"},{"category":"military","createdAt":1792182600000,"detail":"The useful idea for a company is pre-agreed actions at each level. For example, at an elevated level you might block risky logins, pause deployments and increase monitoring.","example":"","flagged":false,"kind":"term","related":["Incident Response Plan (IRP)","Key risk indicator (KRI)"],"summary":"Graded alert levels. DEFCON is US military readiness, 5 lowest to 1 highest. FPCON is base protection: Normal, Alpha, Bravo, Charlie, Delta. CPCON is cyber protection, 5 lowest to 1 highest.","tags":["incident","military"],"title":"Readiness levels (DEFCON, FPCON, CPCON)","updatedAt":1792182599971,"id":"readiness-levels-defcon-fpcon-cpcon"},{"category":"refintech","createdAt":1790983894413,"detail":"Controls: verify payment details by phone using a known number, MFA on email, client education, secure portals instead of email for payment instructions.","example":"A buyer receives an email that appears to come from their lawyer with \"updated\" wiring details the day before closing.","flagged":false,"kind":"term","related":["Business email compromise (BEC)","Multi-factor authentication (MFA)"],"summary":"Criminals send fake payment or closing instructions, often by compromising an agent's or lawyer's email, so deposits go to the wrong account.","tags":["fraud","interview"],"title":"Real estate wire fraud","updatedAt":1790983894319,"id":"real-estate-wire-fraud"},{"category":"privacy","createdAt":1790983894413,"detail":"Factors: how sensitive the information is and how likely it is to be misused. Significant harm includes humiliation, damage to reputation, financial loss and identity theft.","example":"Leaked SINs and income data from tenant applications would almost certainly meet the test.","flagged":false,"kind":"term","related":["PIPEDA","Incident Response Plan (IRP)"],"summary":"PIPEDA's test for whether a breach must be reported. If a breach could reasonably cause significant harm, you must notify.","tags":["canada","breach"],"title":"Real risk of significant harm (RROSH)","updatedAt":1790983894384,"id":"real-risk-of-significant-harm-rrosh"},{"category":"military","createdAt":1792182600000,"detail":"- The idea comes from military wargames.\n- In cyber, red team work and penetration tests need written rules of engagement.\n- Purple team sessions improve detections quickly, because attackers and defenders compare notes as they go.\n- Findings should land in a remediation plan with owners and dates.","example":"","flagged":false,"kind":"term","related":["ROE","Tabletop exercise","Vulnerability management","Remediation plan"],"summary":"Exercise roles. The red team attacks like an adversary, the blue team defends, and the purple team has both work together. A white team referees.","tags":["cyber","exercises","military"],"title":"Red, blue and purple teams","updatedAt":1792182599990,"id":"red-blue-and-purple-teams"},{"category":"audit","createdAt":1790983894413,"detail":"A full plan does three things:\n- Fix it now (remove the access)\n- Find the root cause (HR didn't tell IT)\n- Prevent it (automate account disabling; check for other misses)","example":"","flagged":false,"kind":"term","related":["Deficiency"],"summary":"The plan to fix a deficiency: what went wrong, who fixes it, and by when.","tags":["lesson-6"],"title":"Remediation plan","updatedAt":1790983894363,"id":"remediation-plan"},{"category":"risk","createdAt":1790983894413,"detail":"If residual risk is still above the company's risk appetite, more controls are needed, or someone senior must formally accept it.","example":"After encryption and MFA, the database breach risk drops from high to medium.","flagged":false,"kind":"term","related":["Inherent risk","Risk appetite","Accept (risk response)"],"summary":"The risk left over after your controls are in place. It is never zero.","tags":["lesson-2"],"title":"Residual risk","updatedAt":1790983894402,"id":"residual-risk"},{"category":"thirdparty","createdAt":1790983894413,"detail":"","example":"","flagged":false,"kind":"term","related":["Third-Party Risk Management (TPRM)"],"summary":"A contract clause letting you check a vendor's compliance.","tags":["contracts"],"title":"Right to audit","updatedAt":1790983894353,"id":"right-to-audit"},{"category":"foundations","createdAt":1790983894413,"detail":"Risk appetite is usually set by the board or executives and written as statements. Risk tolerance is the acceptable variation around it, often expressed as numbers.\n\nWithout a stated appetite, nobody can say whether a residual risk is acceptable.","example":"\"We have zero appetite for loss of client funds held in trust, and moderate appetite for product experimentation.\"","flagged":false,"kind":"term","related":["Accept (risk response)","Residual risk","Key risk indicator (KRI)"],"summary":"How much risk leadership is willing to accept to reach its goals. It sets the line for which risks must be fixed and which can be accepted.","tags":["governance"],"title":"Risk appetite","updatedAt":1790983894409,"id":"risk-appetite"},{"category":"risk","createdAt":1790983894413,"detail":"Higher scores get attention first. Many companies show this on a heat map: likelihood on one axis, impact on the other, red in the top-right corner.","example":"Customer database theft: likelihood 3 × impact 5 = 15 (high). Office printer breaks: 4 × 1 = 4 (low).","flagged":false,"kind":"term","related":["Risk","Risk register"],"summary":"The basic formula for scoring a risk. Each factor is usually rated 1–5, giving a score from 1 to 25.","tags":["lesson-1","lesson-2"],"title":"Risk = Likelihood × Impact","updatedAt":1790983894406,"id":"risk-likelihood-impact"},{"category":"risk","createdAt":1790983894413,"detail":"- Identify: list what could go wrong\n- Assess: score likelihood and impact\n- Respond: mitigate, transfer, avoid or accept\n- Monitor: risks change, so review on a schedule\n\nPost-incident reviews feed new risks back into the cycle.","example":"","flagged":false,"kind":"term","related":["Risk register","Mitigate (risk response)","Post-incident review"],"summary":"The repeating loop companies use for risk: identify, assess, respond, monitor.","tags":["lesson-2"],"title":"Risk management cycle","updatedAt":1790983894405,"id":"risk-management-cycle"},{"category":"risk","createdAt":1790983894413,"detail":"Typical columns: risk ID, description, category, likelihood, impact, inherent score, controls, residual score, owner, response, due date, status.\n\nIt is a living document reviewed at least quarterly.","example":"Like a transaction-record spreadsheet, but each row is a danger instead of a deal.","flagged":false,"kind":"term","related":["Risk management cycle","Inherent risk","Residual risk"],"summary":"A list of every known risk with its score, owner, chosen response and status. The central tracking tool of risk management.","tags":["lesson-2","tools"],"title":"Risk register","updatedAt":1790983894404,"id":"risk-register"},{"category":"foundations","createdAt":1790983894413,"detail":"Risk = Likelihood × Impact.\n\nCompliance risk (the danger of breaking rules) is one category. Others include operational risk (outages, key staff leaving), security risk (breaches), financial and reputational risk.\n\nWhen a risk is serious enough, regulators usually write rules about it, so the biggest risks tend to become compliance requirements.","example":"A server room flood breaks no rule but is still a risk.","flagged":false,"kind":"term","related":["Risk = Likelihood × Impact","Compliance","Inherent risk","Residual risk"],"summary":"The chance that something harmful happens, combined with how bad it would be. It covers any possible harm, not only breaking rules.","tags":["core","lesson-1"],"title":"Risk","updatedAt":1790983894411,"id":"risk"},{"category":"military","createdAt":1792182600000,"detail":"The steps: Prepare, Categorize, Select, Implement, Assess, Authorize, Monitor.\n\nThe DoD uses it, replacing the older DIACAP process. Compare it with the risk management cycle: same logic, more formal paperwork.","example":"","flagged":false,"kind":"term","related":["ATO","NIST SP 800-53","Risk management cycle"],"summary":"Risk Management Framework (NIST SP 800-37): a seven-step process for choosing, implementing, assessing and monitoring security controls on a system, ending in a formal authorization.","tags":["frameworks","us","military"],"title":"RMF","updatedAt":1792182599953,"id":"rmf"},{"category":"military","createdAt":1792182600000,"detail":"In a penetration test or red team exercise, the ROE spell out:\n- Scope: which systems are in and out\n- Allowed techniques\n- Test windows\n- Who to call if something breaks\n- When to stop\n\nGet them in writing before testing starts. Without permission, testing can be illegal.","example":"","flagged":false,"kind":"term","related":["Red, blue and purple teams","Vulnerability management"],"summary":"Rules of engagement: written limits on what an operation is allowed to do.","tags":["process","exercises","military"],"title":"ROE","updatedAt":1792182599979,"id":"roe"},{"category":"security","createdAt":1790983894413,"detail":"","example":"Every \"Agent\" role can see listings; only \"Broker of record\" can approve trust withdrawals.","flagged":false,"kind":"term","related":["Least privilege"],"summary":"Granting access by job role instead of person by person.","tags":["access"],"title":"Role-based access control (RBAC)","updatedAt":1790983894345,"id":"role-based-access-control-rbac"},{"category":"security","createdAt":1790983894413,"detail":"","example":"RTO 4 hours, RPO 15 minutes: the system is back within 4 hours, losing at most the last 15 minutes of data.","flagged":false,"kind":"term","related":["Business continuity and disaster recovery (BCP/DR)"],"summary":"Recovery Time Objective: how fast a system must be back. Recovery Point Objective: how much data loss, measured in time, is acceptable.","tags":["resilience"],"title":"RTO and RPO","updatedAt":1790983894335,"id":"rto-and-rpo"},{"category":"linux","createdAt":1792173300000,"detail":"1. Download the build that matches your CPU. Check yours:\n\n```\nuname -m\n```\n\n2. Put it somewhere permanent, make it executable, and run it from the terminal the first time so you can see any error messages:\n\n```\nmkdir -p ~/Applications\nmv ~/Downloads/MyApp-x86_64.AppImage ~/Applications/\ncd ~/Applications\nchmod +x MyApp-x86_64.AppImage\n./MyApp-x86_64.AppImage\n```\n\n3. Once it works, double-click it in the file manager. If nothing happens, open the file's Properties, go to Permissions, and allow it to run as a program.\n\nIf you see \"AppImages require FUSE to run\" or \"Permission denied\", see AppImage troubleshooting. To get an app menu entry, see Adding an AppImage to the app menu.","example":"","flagged":false,"kind":"note","related":["AppImage","AppImage troubleshooting","Adding an AppImage to the app menu","File permissions (chmod)","Verifying a download"],"summary":"Step by step: download the right build, make it executable, and run it.","tags":["appimage","how-to","linux"],"title":"Running an AppImage on Fedora","updatedAt":1792173299990,"id":"running-an-appimage-on-fedora"},{"category":"audit","createdAt":1790983894413,"detail":"","example":"200 people left this year; the auditor checks 25 to confirm access was removed on time.","flagged":false,"kind":"term","related":["Evidence","Deficiency"],"summary":"Auditors test a selection of items instead of everything, then judge the whole population from the results.","tags":["lesson-6"],"title":"Sampling","updatedAt":1790983894366,"id":"sampling"},{"category":"linux","createdAt":1792173300000,"detail":"```\ncrontab -e                          # edit your schedule\ncrontab -l                          # list it\n# minute hour day month weekday command\n30 2 * * 1 /home/yourname/backup.sh     # Mondays at 2:30\nsystemctl list-timers               # systemd timers\n```\n\nForgotten scheduled jobs are a classic place for risk. Reviewers look at them.","example":"","flagged":false,"kind":"note","related":["systemd and systemctl","Backup and recovery"],"summary":"Ways to run a task automatically on a schedule.","tags":["system","linux"],"title":"Scheduled jobs (cron and systemd timers)","updatedAt":1792173299971,"id":"scheduled-jobs-cron-and-systemd-timers"},{"category":"military","createdAt":1792182600000,"detail":"A physical control with strict access, no personal devices and shielding against listening.","example":"","flagged":false,"kind":"term","related":["Physical control","Air gap and classified networks","Classification levels"],"summary":"Sensitive compartmented information facility: an accredited secure room built to protect classified discussions and systems.","tags":["classification","physical","military"],"title":"SCIF","updatedAt":1792182599965,"id":"scif"},{"category":"linux","createdAt":1792173300000,"detail":"```\ngrep -rni \"password\" ~/notes       # search text in files\ngrep -c error file.log             # count matching lines\nfind ~ -name \"*.AppImage\"          # find files by name\nfind /var/log -mtime -1            # changed in the last day\nwc -l file                         # count lines\nnano file                          # simple editor (Ctrl+O save, Ctrl+X exit)\n```\n\nIf you land in vim by accident, press Esc, type `:q!` and press Enter to leave without saving.","example":"","flagged":false,"kind":"note","related":["Pipes and redirects","Terminal and shell"],"summary":"Find text inside files, find files by name, and edit a file from the terminal.","tags":["commands","linux"],"title":"Search and text tools (grep and find)","updatedAt":1792173299975,"id":"search-and-text-tools-grep-and-find"},{"category":"thirdparty","createdAt":1790983894413,"detail":"Common templates: SIG (Shared Assessments) and CAIQ (Cloud Security Alliance).","example":"","flagged":false,"kind":"term","related":["Third-Party Risk Management (TPRM)"],"summary":"A standard list of security questions a vendor fills out, often used when they don't have a SOC 2 report.","tags":["lesson-7"],"title":"Security questionnaire","updatedAt":1790983894355,"id":"security-questionnaire"},{"category":"foundations","createdAt":1790983894413,"detail":"Also called separation of duties (SoD). Common in finance and in IT change management: the person who writes code should not be the only one who approves and deploys it.","example":"One employee creates a vendor payment; a second must approve it before money moves.","flagged":false,"kind":"term","related":["Least privilege","Change management","Preventive control"],"summary":"Splitting a sensitive task so no single person can complete it alone, which prevents fraud and catches mistakes.","tags":["controls","fraud"],"title":"Segregation of duties","updatedAt":1790983894407,"id":"segregation-of-duties"},{"category":"linux","createdAt":1792173300000,"detail":"```\ngetenforce                         # Enforcing, Permissive or Disabled\nsestatus                           # more detail\nls -Z file                         # a file's security label\nsudo ausearch -m avc -ts recent    # recent denials\nsudo restorecon -Rv /path          # reset labels to default\n```\n\n- Enforcing blocks. Permissive only logs. Disabled is off.\n- A mysterious \"permission denied\" can be SELinux even when normal permissions look right.\n- `sudo setenforce 0` switches to permissive until the next reboot. It is fine for testing and wrong as a permanent fix.\n\nThis is defense in depth: even a compromised program stays boxed in. Auditors check that it is enforcing.","example":"","flagged":false,"kind":"term","related":["Defense in depth","Preventive control","AppImage troubleshooting","Fedora"],"summary":"A Linux security layer that limits what each program can do, even when it runs as a powerful user. Fedora and the Red Hat family turn it on by default.","tags":["security","fedora","linux"],"title":"SELinux","updatedAt":1792173299979,"id":"selinux"},{"category":"security","createdAt":1790983894413,"detail":"Most cloud breaches come from customer-side mistakes such as misconfigured storage or weak access.","example":"","flagged":false,"kind":"term","related":["Transfer (risk response)"],"summary":"In cloud computing, the provider secures the infrastructure and the customer secures how they configure and use it.","tags":["cloud"],"title":"Shared responsibility model","updatedAt":1790983894333,"id":"shared-responsibility-model"},{"category":"security","createdAt":1790983894413,"detail":"","example":"Microsoft Sentinel, Splunk.","flagged":false,"kind":"term","related":["Detective control","Logging and monitoring"],"summary":"Security Information and Event Management: a system that collects logs from across the company and raises alerts on suspicious activity.","tags":["operations"],"title":"SIEM","updatedAt":1790983894338,"id":"siem"},{"category":"security","createdAt":1790983894413,"detail":"","example":"Okta, Microsoft Entra ID, Google Workspace.","flagged":false,"kind":"term","related":["Identity and access management (IAM)"],"summary":"One login that gives access to many apps. It makes MFA and offboarding easier because there's one account to protect or disable.","tags":["access"],"title":"Single sign-on (SSO)","updatedAt":1790983894346,"id":"single-sign-on-sso"},{"category":"military","createdAt":1792182600000,"detail":"In an incident, send SITREPs on a fixed rhythm, such as every 30 minutes. Include what you know, what you don't know yet, the actions under way and the time of the next update.","example":"","flagged":false,"kind":"term","related":["Incident Response Plan (IRP)","BLUF","COP"],"summary":"Situation report: a short status update on what is happening, what has been done and what comes next.","tags":["communication","incident","military"],"title":"SITREP","updatedAt":1792182599982,"id":"sitrep"},{"category":"frameworks","createdAt":1790983894413,"detail":"","example":"\"Do your controls actually work, or do they just look good on paper?\" Only Type II answers that.","flagged":false,"kind":"term","related":["SOC 2","Operating effectiveness"],"summary":"Type I checks control design at a single date. Type II checks that controls actually operated over a period of months.","tags":["lesson-5"],"title":"SOC 2 Type I vs Type II","updatedAt":1790983894374,"id":"soc-2-type-i-vs-type-ii"},{"category":"frameworks","createdAt":1790983894413,"detail":"Covers up to five Trust Services Criteria: Security (always required), Availability, Processing Integrity, Confidentiality, Privacy.\n\n- Type I: are controls designed properly at one point in time?\n- Type II: did controls actually work over a period, usually 3–12 months? More valuable.","example":"A large US bank asks a Canadian startup for its SOC 2 Type II before signing.","flagged":false,"kind":"term","related":["SOC 2 Type I vs Type II","Bridge letter","ISO 27001"],"summary":"An audit report, created under AICPA rules, showing a company protects customer data. The standard expectation for B2B software in North America.","tags":["lesson-5","audit"],"title":"SOC 2","updatedAt":1790983894375,"id":"soc-2"},{"category":"military","createdAt":1792182600000,"detail":"- The same thing as a procedure in the policy, standard and procedure hierarchy.\n- Good SOPs are tested with the people who use them.\n- Auditors ask for the SOP and then for evidence that people follow it.","example":"","flagged":false,"kind":"term","related":["Policy, standard, procedure","Administrative control","Evidence"],"summary":"Standard operating procedure: written, repeatable instructions for a routine task.","tags":["process","military"],"title":"SOP","updatedAt":1792182599980,"id":"sop"},{"category":"linux","createdAt":1792173300000,"detail":"```\nssh user@server.example.com\nssh-keygen -t ed25519 -C \"laptop\"\nssh-copy-id user@server.example.com\n```\n\n- The private key stays on your machine (`~/.ssh/id_ed25519`, permissions 600). The public key, the `.pub` file, goes on the server in `~/.ssh/authorized_keys`.\n- Never share the private key, and protect it with a passphrase.\n- Server settings are in `/etc/ssh/sshd_config`. Hardened servers set `PermitRootLogin no` and `PasswordAuthentication no`.\n\nOffboarding must include removing the person's keys, just like removing their accounts.","example":"","flagged":false,"kind":"term","related":["File permissions (chmod)","Multi-factor authentication (MFA)","Identity and access management (IAM)"],"summary":"SSH is the encrypted way to log in to and run commands on another computer. Key pairs can replace passwords.","tags":["network","access","linux"],"title":"SSH and keys","updatedAt":1792173299980,"id":"ssh-and-keys"},{"category":"military","createdAt":1792182600000,"detail":"- The CIS Benchmarks are the commercial equivalent.\n- A Red Hat Enterprise Linux STIG exists, and Fedora is closely related.\n- OpenSCAP can scan a Linux machine against hardening profiles like these.","example":"","flagged":false,"kind":"term","related":["DISA","Vulnerability management","Linux in an audit","SELinux"],"summary":"Security Technical Implementation Guide: detailed configuration hardening checklists published by DISA for operating systems, databases, browsers and more.","tags":["frameworks","hardening","military"],"title":"STIG","updatedAt":1792182599950,"id":"stig"},{"category":"linux","createdAt":1792173300000,"detail":"- On Fedora, members of the `wheel` group can use sudo.\n- Accounts are listed in `/etc/passwd`. Password hashes are in `/etc/shadow`, which only root can read.\n\n```\nwhoami\nid                           # your user and groups\nsudo dnf upgrade             # run one command as root\nsudo usermod -aG wheel newuser   # give a user sudo rights\nsudo visudo                  # safely edit sudo rules\nsudo -l                      # list what you may run with sudo\n```\n\nUse sudo only when a command needs it. A downloaded script run with sudo has full control of the machine.\n\nWho has sudo is one of the first things an access review asks about.","example":"","flagged":false,"kind":"term","related":["Least privilege","Access review","Hashing","Identity and access management (IAM)"],"summary":"root is the all-powerful administrator account. sudo lets an allowed user run one command with root's power.","tags":["basics","security","access","linux"],"title":"sudo and root","updatedAt":1792173299995,"id":"sudo-and-root"},{"category":"linux","createdAt":1792173300000,"detail":"```\nsystemctl status sshd\nsudo systemctl start sshd\nsudo systemctl stop sshd\nsudo systemctl enable --now sshd    # start now and at every boot\nsystemctl --failed                  # what is broken?\nsystemctl list-timers               # scheduled jobs\n```\n\n- Service definitions are \"unit files\" under `/etc/systemd/system` and `/usr/lib/systemd/system`.\n- Add `--user` to manage your own services without root.","example":"","flagged":false,"kind":"term","related":["Logs with journalctl","Scheduled jobs (cron and systemd timers)","Processes and resource use"],"summary":"systemd starts and manages background services on most Linux distributions. systemctl is the command that controls it.","tags":["system","linux"],"title":"systemd and systemctl","updatedAt":1792173299984,"id":"systemd-and-systemctl"},{"category":"incident","createdAt":1790983894413,"detail":"","example":"The team discovers nobody has authority to take the website offline, a gap to fix in the Prepare stage.","flagged":false,"kind":"term","related":["Incident Response Plan (IRP)"],"summary":"A practice session where the team talks through a fake incident to test the response plan.","tags":["lesson-8"],"title":"Tabletop exercise","updatedAt":1790983894350,"id":"tabletop-exercise"},{"category":"controls","createdAt":1790983894413,"detail":"","example":"Encryption, firewalls, automatic screen lock after 5 minutes.","flagged":false,"kind":"term","related":["Administrative control","Physical control"],"summary":"A control built into technology.","tags":["lesson-3"],"title":"Technical control","updatedAt":1790983894391,"id":"technical-control"},{"category":"refintech","createdAt":1790983894413,"detail":"Compliance angles:\n- Express consent for credit checks\n- Collect only what's needed (data minimization)\n- Ontario's Human Rights Code bans discrimination in housing on protected grounds\n- Automated scoring raises AI bias risk","example":"","flagged":false,"kind":"term","related":["Consent","AI bias","Data minimization"],"summary":"Checking rental applicants' identity, income, credit and references. A core feature of tenant-placement platforms.","tags":["rental","ontario"],"title":"Tenant screening","updatedAt":1790983894317,"id":"tenant-screening"},{"category":"linux","createdAt":1792173300000,"detail":"```\npwd                  # where am I?\nls -la               # list files, including hidden ones\ncd ~/Downloads       # change folder (~ is your home folder)\ncd ..                # go up one folder\nmkdir -p notes/grc   # make folders\ncp file copy         # copy\nmv file newname      # move or rename\nrm file              # delete (there is no recycle bin)\ncat file             # print a file\nless file            # page through a file (q to quit)\nman ls               # manual for a command\n```\n\n- Tab completes names. Up arrow recalls earlier commands. Ctrl+C stops a running command. Ctrl+R searches your history.\n- `rm -r` deletes folders and `rm -rf` skips every warning. Check the path before you press Enter.\n- Most commands also accept `--help` for a short summary.","example":"","flagged":false,"kind":"term","related":["Linux filesystem layout","Pipes and redirects","File permissions (chmod)"],"summary":"The terminal is the window where you type commands. The shell, usually bash, is the program that reads and runs them.","tags":["basics","commands","linux"],"title":"Terminal and shell","updatedAt":1792173299998,"id":"terminal-and-shell"},{"category":"thirdparty","createdAt":1790983894413,"detail":"- Due diligence: tier the vendor, review SOC 2 / ISO / questionnaire\n- Contract: security terms, breach notice timeline, right to audit, DPA\n- Monitor: yearly reviews for high-risk vendors\n- Offboard: data returned or deleted, access removed","example":"","flagged":false,"kind":"term","related":["Vendor tiering","Data Processing Agreement (DPA)","Fourth party","OSFI B-10"],"summary":"Managing the risks that come from vendors and partners across the relationship: before signing, in the contract, during, and at exit.","tags":["lesson-7"],"title":"Third-Party Risk Management (TPRM)","updatedAt":1790983894357,"id":"third-party-risk-management-tprm"},{"category":"foundations","createdAt":1790983894413,"detail":"- First line: operations and product teams who run the controls\n- Second line: risk management, compliance, security governance who set frameworks and challenge the first line\n- Third line: internal audit, independent, reporting to the board's audit committee\n\nPublished by the Institute of Internal Auditors (IIA). Interviewers like asking where a GRC role sits.","example":"","flagged":false,"kind":"term","related":["Internal audit","GRC"],"summary":"A way to divide risk responsibilities: the business owns and manages risk, risk and compliance teams oversee it, and internal audit independently checks both.","tags":["governance","interview"],"title":"Three lines model","updatedAt":1790983894408,"id":"three-lines-model"},{"category":"refintech","createdAt":1790983894413,"detail":"Risk factors include properties that are mortgage-free or owner-absent. Controls: strong ID verification, title insurance, alerts on title changes.","example":"","flagged":false,"kind":"term","related":["Know your customer (KYC)","Transfer (risk response)"],"summary":"Fraud where criminals impersonate an owner to sell or mortgage a property they don't own.","tags":["fraud"],"title":"Title fraud","updatedAt":1790983894318,"id":"title-fraud"},{"category":"military","createdAt":1792182600000,"detail":"- TLP:RED: named recipients only\n- TLP:AMBER+STRICT: your organization only\n- TLP:AMBER: your organization and clients who need it\n- TLP:GREEN: the wider community, but not public\n- TLP:CLEAR: no limit\n\nUsed in advisories from the CCCS, CISA and information-sharing groups. Respect the label when forwarding.","example":"","flagged":false,"kind":"term","related":["CCCS","Classification levels","Need to know"],"summary":"Traffic Light Protocol: colour labels that say how widely shared threat information may be passed on.","tags":["intelligence","sharing","military"],"title":"TLP","updatedAt":1792182599963,"id":"tlp"},{"category":"security","createdAt":1790983894413,"detail":"","example":"","flagged":false,"kind":"term","related":["PCI DSS"],"summary":"Replacing sensitive data like a card number with a meaningless token, so the real value is stored only by a secure provider.","tags":["payments"],"title":"Tokenization","updatedAt":1790983894341,"id":"tokenization"},{"category":"risk","createdAt":1790983894413,"detail":"Key rule: you can transfer the work, but not the responsibility. If a vendor leaks your customers' data, regulators and customers still hold you accountable.","example":"Cyber insurance; using Stripe so card numbers never touch your servers.","flagged":false,"kind":"term","related":["Cyber insurance","Third-Party Risk Management (TPRM)","You can transfer the work, not the responsibility"],"summary":"Shift some of a risk to another party, usually through insurance or outsourcing.","tags":["lesson-2","risk-response"],"title":"Transfer (risk response)","updatedAt":1790983894400,"id":"transfer-risk-response"},{"category":"refintech","createdAt":1790983894413,"detail":"Its code of ethics covers duties to clients, disclosure and record keeping. Rules on trust accounts for deposits matter for any fintech touching client funds.","example":"","flagged":false,"kind":"term","related":["Trust account","FINTRAC"],"summary":"Ontario's Trust in Real Estate Services Act, 2002 (TRESA) governs registered real estate professionals; the Real Estate Council of Ontario (RECO) administers it.","tags":["ontario","regulation"],"title":"TRESA and RECO","updatedAt":1790983894321,"id":"tresa-and-reco"},{"category":"refintech","createdAt":1790983894413,"detail":"High-risk area: fraud, errors and reconciliation failures carry regulatory consequences. Expect strong segregation of duties and reconciliation controls.","example":"","flagged":false,"kind":"term","related":["TRESA and RECO","Segregation of duties"],"summary":"A separate account holding client money, such as deposits, that the brokerage must protect and can't mix with its own funds.","tags":["financial"],"title":"Trust account","updatedAt":1790983894320,"id":"trust-account"},{"category":"military","createdAt":1792182600000,"detail":"- Tactic: the goal, such as stealing credentials.\n- Technique: the general method, such as phishing.\n- Procedure: the exact steps a specific group uses.\n\nThreat reports list TTPs so defenders can build detections around behaviour, which is harder for an attacker to change than a single indicator like an IP address.","example":"","flagged":false,"kind":"term","related":["MITRE ATT&CK","APT","Kill chain"],"summary":"Tactics, techniques and procedures: how a particular attacker operates.","tags":["cyber","threats","military"],"title":"TTPs","updatedAt":1792182599993,"id":"ttps"},{"category":"military","createdAt":1792182600000,"detail":"- Used for nuclear weapons and for handling COMSEC keys.\n- It is the same idea as segregation of duties and dual control: large payments, key ceremonies and production changes.","example":"","flagged":false,"kind":"term","related":["Segregation of duties","COMSEC","Trust account"],"summary":"A rule that two authorized people must be present or approve for a sensitive action.","tags":["controls","military"],"title":"Two-person integrity","updatedAt":1792182599968,"id":"two-person-integrity"},{"category":"frameworks","createdAt":1790983894413,"detail":"Frameworks overlap heavily (MFA, encryption, access reviews, training appear in nearly all). GRC tools help maintain the mapping.","example":"One access-review control satisfies SOC 2 CC6, ISO 27001 Annex A access controls and PCI DSS Requirement 7.","flagged":false,"kind":"term","related":["SOC 2","ISO 27001","GRC tools"],"summary":"One set of internal controls mapped to several frameworks at once, so you test once and satisfy many requirements.","tags":["lesson-5","efficiency"],"title":"Unified control framework","updatedAt":1790983894370,"id":"unified-control-framework"},{"category":"thirdparty","createdAt":1790983894413,"detail":"Drivers: what data they access, how critical they are to operations, and whether they connect to your systems.","example":"A vendor storing customer records is high risk; an office snack supplier is low.","flagged":false,"kind":"term","related":["Third-Party Risk Management (TPRM)"],"summary":"Classifying vendors by risk so high-risk ones get deeper review.","tags":["lesson-7"],"title":"Vendor tiering","updatedAt":1790983894356,"id":"vendor-tiering"},{"category":"linux","createdAt":1792173300000,"detail":"```\nsha256sum MyApp-x86_64.AppImage\n```\n\nCompare the output with the checksum on the project's release page. If a signature file is published, check it too:\n\n```\ngpg --verify MyApp.AppImage.sig MyApp.AppImage\n```\n\nA mismatch means a corrupted download or a tampered file. Do not run it.\n\nThis is a small version of software supply chain risk, the same idea as reviewing a vendor before you rely on them.","example":"","flagged":false,"kind":"note","related":["Third-Party Risk Management (TPRM)","Hashing","AppImage"],"summary":"Checking that a file is exactly what the publisher released before you run it.","tags":["security","how-to","linux"],"title":"Verifying a download","updatedAt":1792173299985,"id":"verifying-a-download"},{"category":"security","createdAt":1790983894413,"detail":"Tracks patching deadlines by severity, for example critical within 15–30 days. Overdue criticals are a common KRI.","example":"","flagged":false,"kind":"term","related":["Key risk indicator (KRI)"],"summary":"Continuously finding, ranking and fixing security weaknesses in systems.","tags":["operations"],"title":"Vulnerability management","updatedAt":1790983894340,"id":"vulnerability-management"},{"category":"military","createdAt":1792182600000,"detail":"- Ideas borrowed from the military: defense in depth, the kill chain, red teams, OPSEC, after-action reviews, tabletop exercises and a clear chain of command during incidents.\n- Government and defence frameworks became the base for many commercial ones. NIST SP 800-53 feeds the RMF, FedRAMP and Canada's ITSG-33, and the NIST Cybersecurity Framework grew out of a US effort on critical infrastructure.\n- Banks and large enterprise customers often hand vendors government-style requirements, so this language shows up in security questionnaires, audit meetings and threat reports.\n- Agency threat reports (CCCS, CISA, NSA) use terms like TTPs and APT without explaining them.","example":"","flagged":false,"kind":"note","related":["Defense in depth","Kill chain","Red, blue and purple teams","RMF","NIST SP 800-53"],"summary":"Cyberspace is treated as an operating domain alongside land, sea, air and space, so a lot of security vocabulary and structure comes from defence.","tags":["overview","military"],"title":"Why military and cyber overlap","updatedAt":1792182600000,"id":"why-military-and-cyber-overlap"},{"category":"career","createdAt":1790983894413,"detail":"- FINTRAC client ID verification and record keeping = KYC and evidence\n- Brokerage file reviews = audit and sampling\n- Handling client IDs, pre-approvals and addresses = PIPEDA in practice\n- Knowing wire fraud and title fraud from the front line = risk identification\n- Explaining complex rules to clients = the communication GRC roles need","example":"","flagged":false,"kind":"note","related":["FINTRAC","Real estate wire fraud","GRC roles"],"summary":"Talking points for interviews: I already work under AML, privacy and regulatory rules every day.","tags":["interview"],"title":"Why my real estate background helps","updatedAt":1790983894310,"id":"why-my-real-estate-background-helps"},{"category":"linux","createdAt":1792173300000,"detail":"- Ask the developer for a Linux build or an AppImage, or build from source if the code is available.\n- Run it through Wine. Bottles, available as a Flatpak, makes Wine easier to manage. Steam's Proton does the same for games.\n- Treat an unknown .exe as untrusted. Wine is not a security sandbox.","example":"","flagged":false,"kind":"note","related":["Flatpak","AppImage"],"summary":"A Windows .exe will not run natively on Linux. You have a few options.","tags":["packages","troubleshooting","linux"],"title":"Windows .exe files on  {id:'foundations',code:'GOV',name:'Foundations & governance'},

const CAT=Object.fromEntries(CATS.map(c=>[c.id,c]));
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').trim().toLowerCase();

let entries=[], loaded=false, db=null, canWrite=true, dbState='connecting';
let filt={cat:'all',kind:'all',q:''}, selId=null, mode='view', confirmDel=false, draft=null;

function catOf(e){return CAT[e.category]||CAT.misc}
function byTitle(t){const n=norm(t);return entries.find(e=>norm(e.title)===n)}
function visible(){
  const q=norm(filt.q);
  return entries.filter(e=>{
    if(filt.cat!=='all' && (CAT[e.category]?e.category:'misc')!==filt.cat) return false;
    if(filt.kind==='term' && e.kind==='note') return false;
    if(filt.kind==='note' && e.kind!=='note') return false;
    if(filt.kind==='flagged' && !e.flagged) return false;
    if(!q) return true;
    return [e.title,e.summary,e.detail,e.example,(e.tags||[]).join(' '),(e.related||[]).join(' ')].some(f=>norm(f).includes(q));
  }).sort((a,b)=>{
    if(q){const at=norm(a.title).includes(q),bt=norm(b.title).includes(q); if(at!==bt) return at?-1:1;}
    return a.title.localeCompare(b.title,undefined,{sensitivity:'base'});
  });
}
function inl(s){return esc(s).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>')}
function rich(s){
  if(!s||!String(s).trim()) return '';
  return String(s).trim().split('```').map((part,i)=>{
    if(i%2===1){
      const code=part.replace(/^\n/,'').replace(/\s+$/,'');
      return '<div class="codewrap"><button class="btn copy" type="button" data-act="copy">Copy</button><pre><code>'+esc(code)+'</code></pre></div>';
    }
    if(!part.trim()) return '';
    return part.trim().split(/\n\s*\n/).map(b=>{
      const lines=b.split('\n').filter(l=>l.trim());
      if(lines.length && lines.every(l=>/^\s*[-•*]\s+/.test(l))) return '<ul>'+lines.map(l=>'<li>'+inl(l.replace(/^\s*[-•*]\s+/,''))+'</li>').join('')+'</ul>';
      return '<p>'+lines.map(inl).join('<br>')+'</p>';
    }).join('');
  }).join('');
}
function copyCode(btn){
  const c=btn.parentElement.querySelector('code'); if(!c) return;
  const pick=()=>{const r=document.createRange();r.selectNodeContents(c);const g=getSelection();g.removeAllRanges();g.addRange(r);toast('Press Ctrl+C to copy')};
  try{navigator.clipboard.writeText(c.textContent).then(()=>toast('Copied')).catch(pick)}catch(x){pick()}
}
function fmtDate(ms){if(!ms) return '';try{return new Date(ms).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})}catch{return ''}}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}

/* ---------- render ---------- */
function render(){
  const terms=entries.filter(e=>e.kind!=='note').length, notes=entries.length-terms;
  $('#count').textContent=loaded?`${terms} terms · ${notes} notes`:'';
  renderStatus(); renderRail(); renderChips(); renderLedger();
  if(mode==='view') renderDetail();
  $('#newBtn').disabled=!db||!canWrite;
}
function renderStatus(){
  const s=$('#status');
  const msg={offline:'Your saved entries can only load when this page is opened on claude.ai while signed in.',error:'The connection to your saved entries dropped. Reload the page to reconnect.',readonly:'You can read this guide but not change it.',nosave:'This browser is not keeping your changes. Use Export to keep a copy.'}[dbState];
  s.hidden=!msg; if(msg) s.textContent=msg;
}
function counts(){const c={};entries.forEach(e=>{const k=CAT[e.category]?e.category:'misc';c[k]=(c[k]||0)+1});return c}
function renderRail(){
  const c=counts();

    `<div class="label">Domains</div><nav>`+
    `<button class="catbtn" data-cat="all" aria-pressed="${filt.cat==='all'}"><span class="code">ALL</span><span>Everything</span><span class="n">${entries.length}</span></button>`+
    cats.map(x=>`<button class="catbtn" data-cat="${x.id}" aria-pressed="${filt.cat===x.id}"><span class="code">${x.code}</span><span>${esc(x.name)}</span><span class="n">${c[x.id]||0}</span></button>`).join('')+`</nav>`;
}
function renderChips(){
  const c=counts();
  const kinds=[['term','Terms'],['note','Notes'],['flagged','To review']];

    kinds.map(([k,l])=>`<button class="pill" data-kind="${k}" aria-pressed="${filt.kind===k}">${l}</button>`).join('')+

}
function renderLedger(){
  const list=visible();
  const heading=filt.cat==='all'?'All entries':CAT[filt.cat].name;
  let body;
  if(!loaded){
    body=dbState==='offline'
      ?`<div class="empty"><strong>Nothing loaded</strong>Open this page on claude.ai while signed in to see your entries.</div>`
      :`<div class="empty"><strong>Loading your guide…</strong>Your terms and notes will appear here.</div>`;
  } else if(!entries.length){
    body=`<div class="empty"><strong>Your guide is empty</strong>Use “+ New entry” to add your first term or note.</div>`;
  } else if(!list.length){
    body=`<div class="empty"><strong>No matches</strong>${filt.q?`Nothing matches “${esc(filt.q)}”.`:'Nothing in this view yet.'} ${canWrite&&db?'<button class="btn" data-act="new-from-search" style="margin-top:10px">Add “'+esc(filt.q||'new entry')+'”</button>':''}</div>`;
  } else {
    body='<ul>'+list.map(e=>`<li><button class="row" data-id="${esc(e.id)}" aria-current="${e.id===selId}">
      <span class="t"><span class="tag-code">${catOf(e).code}</span>${e.kind==='note'?'<span class="kind-note">NOTE</span>':''}<span class="title">${esc(e.title)}</span>${e.flagged?'<span class="flagdot" title="Marked to review"></span>':''}</span>
      <span class="s">${esc(e.summary||'')}</span></button></li>`).join('')+'</ul>';
  }
  $('#ledger').innerHTML=`<div class="ledger-head"><h2>${esc(heading)}</h2><span class="label">${loaded?list.length:''}</span></div>`+body;
}
function renderDetail(){
  const el=$('#detail');
  const e=entries.find(x=>x.id===selId);
  if(!e){renderWelcome();return}
  const c=catOf(e);
  const rel=(e.related||[]).filter(Boolean);
  const back=entries.filter(x=>x.id!==e.id && (x.related||[]).some(r=>norm(r)===norm(e.title)) && !rel.some(r=>norm(r)===norm(x.title)));
  el.innerHTML=`<article class="entry">
    <button class="btn ghost back" data-act="back">← All entries</button>
    <div class="eyebrow"><span class="code">${c.code}</span><span class="label">${esc(c.name)}</span><span class="label">· ${e.kind==='note'?'Note':'Term'}</span></div>
    <h2 class="title">${esc(e.title)}</h2>
    ${e.flagged?'<div class="flagbanner"><span class="flagdot"></span>Marked to review</div>':''}
    ${e.summary?`<p class="lead">${esc(e.summary)}</p>`:''}
    ${e.detail?`<section class="sect"><h3 class="label">Notes</h3>${rich(e.detail)}</section>`:''}
    ${e.example?`<section class="sect"><h3 class="label">Example</h3><div class="example">${rich(e.example)}</div></section>`:''}
    ${rel.length?`<section class="sect"><h3 class="label">Related</h3><div class="links">${rel.map(r=>{const t=byTitle(r);return t?`<button class="link" data-id="${esc(t.id)}">${esc(t.title)}</button>`:`<span class="link missing" title="No entry yet">${esc(r)}</span>`}).join('')}</div></section>`:''}
    ${back.length?`<section class="sect"><h3 class="label">Linked from</h3><div class="links">${back.map(t=>`<button class="link" data-id="${esc(t.id)}">${esc(t.title)}</button>`).join('')}</div></section>`:''}
    ${(e.tags||[]).length?`<section class="sect"><div class="tags">${e.tags.map(t=>`<span>#${esc(t)}</span>`).join('')}</div></section>`:''}
    <div class="meta">
      <span class="when">${e.updatedAt?'Updated '+fmtDate(e.updatedAt):''}</span>
      ${db&&canWrite?`<button class="btn" data-act="flag">${e.flagged?'Mark reviewed':'Mark to review'}</button>
      <button class="btn" data-act="edit">Edit</button>
      <button class="btn danger" data-act="ask-delete">Delete</button>`:''}
      ${confirmDel?`<div class="confirm">Delete “${esc(e.title)}” for good? <button class="btn danger solid" data-act="delete">Delete</button><button class="btn" data-act="cancel-delete">Keep it</button></div>`:''}
    </div>
  </article>`;
}
function renderWelcome(){
  const terms=entries.filter(e=>e.kind!=='note').length, notes=entries.length-terms, flagged=entries.filter(e=>e.flagged).length;
  const recent=[...entries].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).slice(0,6);
  $('#detail').innerHTML=`<div class="entry welcome">
    <h2>Your GRC reference</h2>
    <p>Terms and notes for a GRC and IT role in real estate fintech. Search from the top bar, filter by domain, and add to it as you learn. Each entry links to related terms, so the guide grows into a connected map.</p>
    ${loaded?`<div class="stats"><div><b>${terms}</b><span>terms</span></div><div><b>${notes}</b><span>notes</span></div><div><b>${counts()&&Object.keys(counts()).length}</b><span>domains</span></div><div><b>${flagged}</b><span>to review</span></div></div>`:''}
    ${recent.length?`<div class="label">Recently updated</div><div class="links recent">${recent.map(t=>`<button class="link" data-id="${esc(t.id)}">${esc(t.title)}</button>`).join('')}</div>`:''}
  </div>`;
}

/* ---------- editor ---------- */
function openEditor(e,preset){
  mode=e?'edit':'new'; confirmDel=false;
  draft=e?{...e,related:(e.related||[]).join(', '),tags:(e.tags||[]).join(', ')}:{kind:'term',title:preset||'',category:filt.cat!=='all'?filt.cat:'foundations',summary:'',detail:'',example:'',related:'',tags:''};
  showView('detail');
  $('#detail').innerHTML=`<form class="editor" id="ed" novalidate>
    <button class="btn ghost back" type="button" data-act="cancel-edit">← Cancel</button>
    <h2>${e?'Edit entry':'New entry'}</h2>
    <div class="seg" role="group" aria-label="Entry type">
      <button type="button" data-k="term" aria-pressed="${draft.kind!=='note'}">Term</button>
      <button type="button" data-k="note" aria-pressed="${draft.kind==='note'}">Note</button>
    </div>
    <div class="two">
      <div class="field"><label for="f-title">Title</label><input id="f-title" value="${esc(draft.title)}" placeholder="e.g. Segregation of duties"></div>
      <div class="field"><label for="f-cat">Domain</label><select id="f-cat">${CATS.map(c=>`<option value="${c.id}" ${c.id===(CAT[draft.category]?draft.category:'misc')?'selected':''}>${c.code} · ${esc(c.name)}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label for="f-sum">Plain-language definition</label><span class="hint">One or two sentences you could say in an interview.</span><textarea id="f-sum" rows="3">${esc(draft.summary)}</textarea></div>
    <div class="field"><label for="f-det">Notes</label><span class="hint">Leave a blank line between paragraphs. Start lines with “- ” for a bulleted list. Put commands between lines of three backticks to make a code block.</span><textarea id="f-det" rows="7">${esc(draft.detail)}</textarea></div>
    <div class="field"><label for="f-ex">Example</label><textarea id="f-ex" rows="3">${esc(draft.example)}</textarea></div>
    <div class="two">
      <div class="field"><label for="f-rel">Related entries</label><span class="hint">Titles, separated by commas.</span><input id="f-rel" value="${esc(draft.related)}" list="titles"></div>
      <div class="field"><label for="f-tags">Tags</label><span class="hint">Separated by commas.</span><input id="f-tags" value="${esc(draft.tags)}" placeholder="interview, canada"></div>
    </div>
    <datalist id="titles">${entries.map(x=>`<option value="${esc(x.title)}">`).join('')}</datalist>
    <div class="err" id="f-err" hidden></div>
    <div class="actions"><button class="btn primary" type="submit" id="f-save">${e?'Save changes':'Add to guide'}</button><button class="btn" type="button" data-act="cancel-edit">Cancel</button></div>
  </form>`;
  $('#f-title').focus();
}
const split=s=>String(s||'').split(',').map(x=>x.trim()).filter(Boolean);
function slug(t){return (norm(t).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'entry')+'-'+Math.random().toString(36).slice(2,6)}
async function saveEditor(ev){
  ev.preventDefault();
  const err=$('#f-err'); err.hidden=true;
  const title=$('#f-title').value.trim();
  if(!title){err.textContent='Add a title before saving.';err.hidden=false;$('#f-title').focus();return}
  const dup=byTitle(title);
  if(dup && dup.id!==draft.id){err.textContent=`“${dup.title}” is already in your guide. Edit that entry or choose a different title.`;err.hidden=false;return}
  const now=Date.now();
  const body={kind:draft.kind==='note'?'note':'term',title,category:$('#f-cat').value,summary:$('#f-sum').value.trim(),detail:$('#f-det').value.trim(),example:$('#f-ex').value.trim(),
    related:split($('#f-rel').value),tags:split($('#f-tags').value).map(t=>t.replace(/^#/,'')),flagged:!!draft.flagged,createdAt:draft.createdAt||now,updatedAt:now};
  const id=draft.id||slug(title);
  const btn=$('#f-save'); btn.disabled=true; btn.textContent='Saving…';
  try{
    await db.collection('entries').doc(id).set(body);
    const wasEdit=mode==='edit'; mode='view'; selId=id; draft=null; toast(wasEdit?'Saved':'Added to your guide'); render();
  }catch(x){
    btn.disabled=false; btn.textContent='Try again';
    err.textContent=x&&x.code==='quota_exceeded'?'Your guide is full. Delete some entries, then save again.':x&&x.code==='invalid_argument'?'This entry could not be saved. You may not have permission to edit this guide.':'Saving failed. Check your connection and try again.';
    err.hidden=false;
  }
}

/* ---------- flashcards ---------- */
let deck=[],di=0,shown=false;
function openCards(){
  deck=visible().filter(e=>e.kind!=='note'&&e.summary);
  if(!deck.length){toast('No terms with definitions in this view');return}
  deck=shuffle(deck); di=0; shown=false; drawCard();
}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function drawCard(){
  const o=$('#overlay'); const e=deck[di]; const c=catOf(e);
  o.className='overlay'; o.hidden=false;
  o.innerHTML=`<div class="card" role="dialog" aria-modal="true" aria-label="Flashcards">
    <div class="top"><span class="label">${c.code} · Card ${di+1} of ${deck.length}</span><button class="btn ghost" data-act="close-cards">Close</button></div>
    <div><div class="label">What does this mean?</div><div class="q">${esc(e.title)}</div></div>
    ${shown?`<div class="a"><p>${esc(e.summary)}</p>${e.example?`<div class="example">${rich(e.example)}</div>`:''}</div>`:`<button class="btn primary" data-act="reveal">Show answer</button>`}
    <div class="nav"><button class="btn" data-act="prev" ${di===0?'disabled':''}>Previous</button>
      <span style="display:flex;gap:8px">${shown?`<button class="btn" data-act="open-card">Open entry</button>`:''}<button class="btn" data-act="next">${di===deck.length-1?'Start over':'Next'}</button></span></div>
  </div>`;
}
function closeCards(){const o=$('#overlay');o.hidden=true;o.innerHTML=''}

/* ---------- interactions ---------- */
function showView(v){$('#app').dataset.view=v}
function select(id){selId=id;mode='view';confirmDel=false;showView('detail');render();$('#detail').scrollTop=0}
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('button'); if(!t) return;
  if(t.dataset.cat){filt.cat=t.dataset.cat; if(t.closest('#chips')&&t.dataset.cat==='all') filt.kind='all'; render(); return}
  if(t.dataset.kind){filt.kind=filt.kind===t.dataset.kind&&t.closest('#chips')?'all':t.dataset.kind; render(); return}
  if(t.dataset.k){draft.kind=t.dataset.k; t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===t)); return}
  if(t.dataset.id && !t.closest('#overlay')){select(t.dataset.id); return}
  const a=t.dataset.act; if(!a) return;
  if(a==='copy'){copyCode(t);return}
  const e=entries.find(x=>x.id===selId);
  if(a==='back'){showView('list');return}
  if(a==='edit'&&e) openEditor(e);
  if(a==='cancel-edit'){mode='view';draft=null;showView(selId?'detail':'list');render()}
  if(a==='new-from-search') openEditor(null,filt.q);
  if(a==='ask-delete'){confirmDel=true;renderDetail()}
  if(a==='cancel-delete'){confirmDel=false;renderDetail()}
  if(a==='delete'&&e){try{await db.collection('entries').doc(e.id).delete();selId=null;confirmDel=false;showView('list');toast('Deleted');render()}catch{toast('Delete failed. Try again.')}}
  if(a==='flag'&&e){try{await db.collection('entries').doc(e.id).update({flagged:!e.flagged,updatedAt:Date.now()});toast(e.flagged?'Marked reviewed':'Marked to review')}catch{toast('Could not update. Try again.')}}
  if(a==='reveal'){shown=true;drawCard()}
  if(a==='next'){di=(di+1)%deck.length;shown=false;drawCard()}
  if(a==='prev'&&di>0){di--;shown=false;drawCard()}
  if(a==='close-cards') closeCards();
  if(a==='open-card'){const id=deck[di].id;closeCards();select(id)}
});
$('#overlay').addEventListener('click',ev=>{if(ev.target.id==='overlay') closeCards()});
document.addEventListener('keydown',ev=>{
  if($('#overlay').hidden) {
    if(ev.key==='/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ev.preventDefault();$('#q').focus()}
    return;
  }
  if(ev.key==='Escape') closeCards();
  else if(ev.key===' '||ev.key==='Enter'){if(!shown){ev.preventDefault();shown=true;drawCard()}}
  else if(ev.key==='ArrowRight'){di=(di+1)%deck.length;shown=false;drawCard()}
  else if(ev.key==='ArrowLeft'&&di>0){di--;shown=false;drawCard()}
});
document.addEventListener('submit',ev=>{if(ev.target.id==='ed') saveEditor(ev)});
$('#q').addEventListener('input',ev=>{filt.q=ev.target.value;renderLedger()});
$('#q').addEventListener('keydown',ev=>{if(ev.key==='Enter'){const v=visible();if(v[0]) select(v[0].id)}});
$('#newBtn').addEventListener('click',()=>openEditor(null));
$('#cardsBtn').addEventListener('click',openCards);
$('#exportBtn').addEventListener('click',()=>{
  const data=JSON.stringify({app:'grc-field-guide',version:1,exportedAt:new Date().toISOString(),entries:arr},null,2);
  const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));
  const a=document.createElement('a'); a.href=url; a.download='grc-field-guide-backup.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000); toast('Backup downloaded');
});
$('#importBtn').addEventListener('click',()=>$('#importFile').click());
$('#importFile').addEventListener('change',async ev=>{
  const f=ev.target.files[0]; ev.target.value=''; if(!f) return;
  try{
    const j=JSON.parse(await f.text()); const list=Array.isArray(j)?j:j.entries;
    if(!Array.isArray(list)) throw new Error('shape');
    let added=0, updated=0;
    list.forEach(x=>{
      if(!x||typeof x.title!=='string'||!x.title.trim()) return;
      const id=(typeof x.id==='string'&&x.id)?x.id:slug(x.title);
      const i=arr.findIndex(e=>e.id===id);
      if(i<0){arr.push({...x,id});added++}
      else if((x.updatedAt||0)>(arr[i].updatedAt||0)){arr[i]={...x,id};updated++}
    });
    persist(); emit(); toast('Imported: '+added+' new, '+updated+' updated');
  }catch(x){toast('That file is not a Field Guide backup')}
});

/* ---------- data ---------- */
/* ---------- data: built-in entries, edits kept in this browser ---------- */
const STORE_KEY='grc-field-guide-v1';
let arr=[], listeners=[];
function loadLocal(){
  try{const r=localStorage.getItem(STORE_KEY); if(r){const a=JSON.parse(r); if(Array.isArray(a)) return a}}catch(x){}
  return null;
}
function persist(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(arr))}catch(x){dbState='nosave'}
}
function snapshot(){
  return {docs:arr.map(e=>({id:e.id,exists:true,data:()=>{const o={...e};delete o.id;return o}}))};
}
function emit(){listeners.forEach(fn=>{try{fn(snapshot())}catch(x){}})}
const localDb={collection(){return {
  onSnapshot(next){listeners.push(next);next(snapshot());return ()=>{listeners=listeners.filter(f=>f!==next)}},
  doc(id){return {
    async set(body){const rec={...body,id};const i=arr.findIndex(e=>e.id===id);if(i>=0)arr[i]=rec;else arr.push(rec);persist();emit()},
    async update(patch){const i=arr.findIndex(e=>e.id===id);if(i<0) throw {code:'invalid_argument'};arr[i]={...arr[i],...patch};persist();emit()},
    async delete(){arr=arr.filter(e=>e.id!==id);persist();emit()}
  }}
}}};
function init(){
  const saved=loadLocal();
  arr=(saved||SEED).map(e=>({...e}));
  db=localDb; canWrite=true; dbState='ok';
  db.collection('entries').onSnapshot(snap=>{
    entries=snap.docs.filter(d=>d.exists).map(d=>{const x=d.data()||{};return {id:d.id,title:String(x.title||'Untitled'),kind:x.kind,category:x.category,summary:x.summary||'',detail:x.detail||'',example:x.example||'',related:Array.isArray(x.related)?x.related:[],tags:Array.isArray(x.tags)?x.tags:[],flagged:!!x.flagged,createdAt:x.createdAt,updatedAt:x.updatedAt}});
    loaded=true;
    if(selId && !entries.some(e=>e.id===selId) && mode==='view') selId=null;
    render();
  });
}
render();
init();
</script>
