<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GRC Field Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: three-pane working file — category index | entry ledger | open entry. Collapses to chips + list/detail on phones. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#E4E9EE; --fg:#15202B; --muted:#5B6876; --line:#D3DAE1;
  --accent:#1C5B87; --accent-fg:#FFFFFF; --accent-soft:#DAE7F1; --flag:#A35F00; --flag-soft:#F7E8CC; --danger:#B3261E; --danger-soft:#F8DEDB;
  --f-display:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151C; --surface:#161F29; --surface-2:#1E2935; --fg:#E3E9EF; --muted:#93A1B0; --line:#293543;
  --accent:#82B8DF; --accent-fg:#0F151C; --accent-soft:#1A3246; --flag:#E5A851; --flag-soft:#38290F; --danger:#F08B80; --danger-soft:#3B1C1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#161F29; --surface-2:#1E2935; --fg:#E3E9EF; --muted:#93A1B0; --line:#293543;
  --accent:#82B8DF; --accent-fg:#0F151C; --accent-soft:#1A3246; --flag:#E5A851; --flag-soft:#38290F; --danger:#F08B80; --danger-soft:#3B1C1A; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em;margin:0;white-space:nowrap}
.brand .count{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.search{position:relative;flex:1 1 260px;max-width:420px}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}

.panes{display:grid;grid-template-columns:230px minmax(280px,360px) minmax(0,1fr);min-height:0}
.rail,.ledger,.detail{min-height:0;overflow-y:auto}
.rail{border-right:1px solid var(--line);padding:18px 12px}
.ledger{border-right:1px solid var(--line);background:var(--surface)}
.detail{padding:28px 32px 48px}

.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rail .label{padding:0 10px 6px}
.rail nav{display:flex;flex-direction:column;gap:1px;margin-bottom:18px}
.catbtn{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:6px;width:100%;text-align:left;padding:6px 10px;border:0;border-radius:6px;background:transparent;cursor:pointer;font-size:14px}
.catbtn:hover{background:var(--surface-2)}
.catbtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg);font-weight:600}
.catbtn .code{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.catbtn[aria-pressed="true"] .code{color:var(--accent)}
.catbtn .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.kinds{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 18px}
.pill{padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px}
.pill[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chiprow{display:none}

.ledger-head{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.ledger-head h2{font-family:var(--f-display);font-size:15px;font-weight:700;margin:0}
.ledger ul{list-style:none;margin:0;padding:0}
.row{display:block;width:100%;text-align:left;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer}
.row:hover{background:var(--surface-2)}
.row[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.row .t{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.row .t span.title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.tag-code{font-family:var(--f-mono);font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--surface-2);color:var(--muted);flex:none}
.kind-note{font-family:var(--f-mono);font-size:10.5px;padding:1px 6px;border-radius:4px;border:1px dashed var(--muted);color:var(--muted);flex:none}
.flagdot{width:8px;height:8px;border-radius:50%;background:var(--flag);flex:none}
.empty{padding:28px 18px;color:var(--muted);font-size:14px}
.empty strong{display:block;color:var(--fg);font-family:var(--f-display);font-size:16px;margin-bottom:4px}

/* detail */
.entry{max-width:720px}
.back{display:none;margin-bottom:14px}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.eyebrow .code{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:500}
.entry h2.title{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,4vw,36px);line-height:1.12;letter-spacing:-.02em;margin:0 0 14px;text-wrap:balance}
.lead{font-size:18px;line-height:1.55;margin:0 0 24px;max-width:65ch}
.sect{margin:0 0 24px;max-width:65ch}
.sect h3{margin:0 0 8px}
.sect p{margin:0 0 10px}
.sect ul{margin:0 0 10px;padding-left:20px}
.sect li{margin-bottom:4px}
.example{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 var(--r) var(--r) 0;padding:12px 16px}
.example p:last-child{margin-bottom:0}
.links{display:flex;flex-wrap:wrap;gap:6px}
.link{padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px}
.link:hover{border-color:var(--accent);color:var(--accent)}
.link.missing{border-style:dashed;color:var(--muted);cursor:default}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.flagbanner{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--r);background:var(--flag-soft);color:var(--flag);font-size:14px;font-weight:500;margin-bottom:18px;max-width:65ch}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:16px;margin-top:8px}
.meta .when{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-right:auto}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r);background:var(--danger-soft);color:var(--danger);font-size:14px;width:100%}

/* welcome */
.welcome h2{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.02em;margin:0 0 8px}
.welcome p{color:var(--muted);max-width:60ch}
.welcome .links.recent{margin-bottom:20px}
.stats{display:flex;flex-wrap:wrap;gap:28px;margin:22px 0}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted)}
.recent{margin-top:12px}

/* form */
form.editor{max-width:720px;display:flex;flex-direction:column;gap:16px}
form.editor h2{font-family:var(--f-display);font-weight:800;font-size:24px;margin:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
.field .hint{font-size:12.5px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.field textarea{resize:vertical;min-height:80px;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;width:max-content}
.seg button{padding:7px 14px;border:0;background:var(--surface);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.err{color:var(--danger);font-size:13.5px}
.actions{display:flex;gap:10px;flex-wrap:wrap}

/* flashcards */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.card{width:min(560px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:16px;max-height:100%;overflow:auto}
.card .top{display:flex;justify-content:space-between;align-items:center}
.card .q{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance;margin:6px 0}
.card .a{border-top:1px dashed var(--line);padding-top:14px}
.card .a p{margin:0 0 10px}
.card .nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}

code{font-family:var(--f-mono);font-size:.88em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.codewrap{position:relative;margin:0 0 12px;max-width:100%}
.codewrap pre{margin:0;padding:12px 70px 12px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.codewrap pre code{background:none;padding:0;font-size:13px;line-height:1.55;white-space:pre}
.codewrap .copy{position:absolute;top:6px;right:6px;padding:3px 10px;font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20}
.status{padding:8px 20px;font-size:13px;background:var(--flag-soft);color:var(--flag)}

@media (max-width:1000px){
  .panes{grid-template-columns:minmax(260px,330px) minmax(0,1fr)}
  .rail{display:none}
  .chiprow{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
  .chiprow .pill{flex:none}
}
@media (max-width:700px){
  header.top{padding:12px 16px}
  .search{max-width:none;order:3;flex-basis:100%}
  .panes{grid-template-columns:minmax(0,1fr)}
  .app[data-view="list"] .detail{display:none}
  .app[data-view="detail"] .ledger,.app[data-view="detail"] .chiprow{display:none}
  .detail{padding:18px 16px 40px}
  .back{display:inline-flex}
  .two{grid-template-columns:1fr}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:no-preference){.row,.catbtn,.btn{transition:background .12s}}

/* COBOL Workbench section (the whole app runs in an isolated frame) */
#cobolView{position:fixed;inset:0;z-index:15;display:grid;grid-template-rows:auto 1fr;background:var(--bg)}
#cobolView .cbar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
#cobolView .cbar h2{font-family:var(--f-display);font-weight:800;font-size:17px;margin:0 auto 0 0}
#cobolView iframe{width:100%;height:100%;border:0;background:#fff;min-height:0}
</style>
</head>
<body>

<div class="app" id="app" data-view="list">
  <header class="top">
    <div class="brand"><h1>GRC Field Guide</h1><span class="count" id="count"></span></div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search terms, notes, tags" autocomplete="off" aria-label="Search">
    </div>
    <button class="btn" id="cobolBtn" type="button" title="Learn and run COBOL in the browser">COBOL Workbench</button>
    <button class="btn" id="cardsBtn" type="button">Flashcards</button>
    <button class="btn" id="exportBtn" type="button" title="Download a backup of all entries">Export</button>
    <button class="btn" id="importBtn" type="button" title="Add entries from a backup file">Import</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <button class="btn primary" id="newBtn" type="button">+ New entry</button>
  </header>
  <div style="min-height:0;display:grid;grid-template-rows:auto auto 1fr">
    <div id="status" class="status" hidden></div>
    <div class="chiprow" id="chips"></div>
    <div class="panes">
      <aside class="rail" id="rail"></aside>
      <section class="ledger" id="ledger" aria-label="Entries"></section>
      <main class="detail" id="detail"></main>
    </div>
  </div>
</div>
<div id="cobolView" hidden>
  <div class="cbar"><button class="btn" id="cobolBack" type="button">&larr; Back to guide</button><h2>COBOL Workbench</h2><span class="label hide-sm">Esc to close</span></div>
  <iframe id="cobolFrame" title="COBOL Workbench" allow="clipboard-write"></iframe>
</div>
<script type="text/plain" id="cobol-src"><!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COBOL Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a coding-form workbench. Lesson rail on the left, punch-column editor on the right, green-bar SYSOUT printout underneath. */
:root {
  --paper: #F2F6F1;
  --panel: #FAFCF9;
  --ink: #17231D;
  --ink-2: #4A5D53;
  --rule: #C6D9CA;
  --band: #E2ECE3;
  --band-2: #D3E3D6;
  --accent: #1B5BAE;
  --accent-ink: #FFFFFF;
  --accent-soft: #E1EBF8;
  --margin: #C4442C;
  --ok: #1D7849;
  --ok-soft: #DDF0E4;
  --bad: #B3261E;
  --bad-soft: #FAE3E0;
  --kw: #1B5BAE;
  --str: #8A5300;
  --num: #A0266A;
  --com: #6B8075;
  --para: #0D6B4A;
  --div: #5B3FA3;
  --sysout: #FFFFFF;
  --bar: #E8F3EA;
  --shadow: 0 1px 0 rgba(23, 35, 29, .06), 0 6px 18px rgba(23, 35, 29, .06);
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --f-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-cond: "IBM Plex Sans Condensed", "IBM Plex Sans", "Arial Narrow", system-ui, sans-serif;
  --lh: 21px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1412; --panel: #131B18; --ink: #D5E5DB; --ink-2: #92A79B; --rule: #263630; --band: #16211D; --band-2: #1C2A25;
    --accent: #82B3F7; --accent-ink: #0B1A2E; --accent-soft: #182A3E; --margin: #E2775F;
    --ok: #62D49C; --ok-soft: #12301F; --bad: #FF8E84; --bad-soft: #3A1714;
    --kw: #8EBAFF; --str: #E4BA6C; --num: #EE95C7; --com: #6F877A; --para: #70D7A9; --div: #BBA5F6;
    --sysout: #101816; --bar: #15211B; --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1412; --panel: #131B18; --ink: #D5E5DB; --ink-2: #92A79B; --rule: #263630; --band: #16211D; --band-2: #1C2A25;
  --accent: #82B3F7; --accent-ink: #0B1A2E; --accent-soft: #182A3E; --margin: #E2775F;
  --ok: #62D49C; --ok-soft: #12301F; --bad: #FF8E84; --bad-soft: #3A1714;
  --kw: #8EBAFF; --str: #E4BA6C; --num: #EE95C7; --com: #6F877A; --para: #70D7A9; --div: #BBA5F6;
  --sysout: #101816; --bar: #15211B; --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 15px/1.55 var(--f-sans);
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
}
button, input, select, textarea { font: inherit; color: inherit; }
code, kbd { font-family: var(--f-mono); font-size: .88em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- top bar ---------- */
.appbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--rule); background: var(--panel);
}
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0; }
.brand h1 { margin: 0; font: 600 19px/1 var(--f-cond); letter-spacing: .01em; }
.brand h1 span { color: var(--accent); }
.brand small { font: 500 12px/1 var(--f-mono); color: var(--ink-2); letter-spacing: .04em; white-space: nowrap; }
.toolbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.sep { width: 1px; height: 24px; background: var(--rule); margin: 0 4px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px;
  border: 1px solid var(--rule); background: var(--panel); border-radius: 6px; cursor: pointer;
  font: 500 14px/1 var(--f-sans); white-space: nowrap;
}
.btn:hover { border-color: var(--ink-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--band); }
.btn svg { width: 15px; height: 15px; flex: none; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; height: 34px; }
.seg button { border: 0; background: transparent; padding: 0 10px; cursor: pointer; font: 500 13px/1 var(--f-cond); letter-spacing: .03em; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

/* ---------- main layout ---------- */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); }
.rail { border-right: 1px solid var(--rule); background: var(--panel); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--rule); padding: 0 8px; gap: 2px; }
.tabs button {
  border: 0; background: none; padding: 12px 10px 10px; cursor: pointer; color: var(--ink-2);
  font: 600 13px/1 var(--f-cond); letter-spacing: .06em; text-transform: uppercase; border-bottom: 2px solid transparent;
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.pane { overflow: auto; padding: 16px 18px 28px; flex: 1; min-height: 0; }
.pane h2 { font: 600 22px/1.2 var(--f-cond); margin: 4px 0 10px; text-wrap: balance; }
.pane h3 { font: 600 13px/1 var(--f-cond); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin: 22px 0 8px; }
.pane p, .pane li { max-width: 62ch; }
.pane ul { padding-left: 20px; margin: 8px 0; }
.pane li { margin: 4px 0; }
.pane code { background: var(--band); padding: 1px 4px; border-radius: 3px; }
table.mini { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 14px; }
table.mini td { padding: 6px 8px; border-top: 1px solid var(--rule); vertical-align: top; }
table.mini td:first-child { white-space: nowrap; width: 1%; }
table.mini code { background: none; padding: 0; color: var(--kw); }

.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 6px; margin-bottom: 14px; }
.chip {
  height: 34px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); cursor: pointer;
  font: 600 13px/1 var(--f-mono); font-variant-numeric: tabular-nums; position: relative; color: var(--ink-2);
}
.chip.cur { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.chip.done::after { content: ""; position: absolute; right: 3px; top: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.eyebrow { font: 500 12px/1 var(--f-mono); color: var(--ink-2); letter-spacing: .06em; text-transform: uppercase; }

.challenge { margin-top: 18px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); padding: 14px; }
.challenge h3 { margin: 0 0 8px; }
.challenge p { margin: 0 0 10px; }
.challenge .row { display: flex; gap: 8px; flex-wrap: wrap; }
.hint { margin-top: 10px; font-size: 14px; color: var(--ink-2); }
.hint code { white-space: normal; }
.verdict { margin-top: 10px; padding: 10px 12px; border-radius: 6px; font-size: 14px; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.bad { background: var(--bad-soft); color: var(--bad); }
.verdict code { background: transparent; }
.lesson-nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 18px; }

.files { list-style: none; margin: 10px 0; padding: 0; display: grid; gap: 6px; }
.files li { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); }
.files li.cur { border-color: var(--accent); }
.files .fname { font: 500 14px/1.2 var(--f-mono); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; background: none; border: 0; text-align: left; padding: 0; }
.files .fdate { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.empty { color: var(--ink-2); font-size: 14px; padding: 12px; border: 1px dashed var(--rule); border-radius: 6px; }

.colmap { display: grid; grid-template-columns: 6fr 1fr 4fr 61fr 8fr; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; font: 500 11px/1.25 var(--f-cond); text-align: center; margin: 8px 0 4px; }
.colmap div { padding: 8px 2px; border-right: 1px solid var(--rule); background: var(--paper); min-width: 0; }
.colmap div:last-child { border-right: 0; }
.colmap b { display: block; font: 600 12px/1.2 var(--f-mono); }
.colmap .a { background: var(--accent-soft); }
.colmap .s, .colmap .x { background: var(--band); color: var(--ink-2); }

/* ---------- work area ---------- */
.work { display: grid; grid-template-rows: auto minmax(0, 1fr) minmax(170px, 36%); min-height: 0; min-width: 0; }
.docbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 14px; border-bottom: 1px solid var(--rule); background: var(--paper);
}
.docname { font: 600 14px/1 var(--f-mono); display: flex; align-items: center; gap: 6px; min-width: 0; }
.docname input { font: 600 14px/1 var(--f-mono); border: 1px solid transparent; background: transparent; padding: 5px 6px; border-radius: 4px; width: 22ch; max-width: 46vw; text-transform: uppercase; }
.docname input:hover, .docname input:focus { border-color: var(--rule); background: var(--panel); }
.docname .ext { color: var(--ink-2); }
.saved { font-size: 12px; color: var(--ink-2); margin-right: auto; }
.status { font: 500 12px/1 var(--f-mono); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.status b { color: var(--accent); font-weight: 600; }

.editor { position: relative; display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--panel); }
.ruler { min-width: 0; height: 24px; overflow: hidden; border-bottom: 1px solid var(--rule); background: var(--paper); display: flex; flex: none; }
.ruler .gutter-pad { flex: none; width: 52px; border-right: 1px solid var(--rule); font: 600 10px/24px var(--f-cond); color: var(--ink-2); text-align: center; letter-spacing: .06em; }
.ruler-clip { overflow: hidden; flex: 1; position: relative; min-width: 0; }
.ruler-inner { font: 13px/24px var(--f-mono); padding-left: 12px; white-space: pre; color: var(--ink-2); will-change: transform; }
.ruler-inner span.m { color: var(--accent); font-weight: 600; }
.ruler-inner span.r { color: var(--margin); font-weight: 600; }
.ruler-inner span.on { background: var(--accent); color: var(--accent-ink); border-radius: 2px; }
.ed-body { flex: 1; display: flex; min-height: 0; min-width: 0; position: relative; }
.gutter { flex: none; width: 52px; overflow: hidden; border-right: 1px solid var(--rule); background: var(--paper); }
.gutter-inner { padding: 10px 8px 10px 0; font: 13px/var(--lh) var(--f-mono); text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; will-change: transform; }
.gutter-inner div.err { color: var(--bad); font-weight: 600; background: var(--bad-soft); }
.code-wrap { position: relative; flex: 1; min-width: 0; overflow: hidden; }
.code-wrap pre, .code-wrap textarea {
  margin: 0; padding: 10px 12px; border: 0; font: 13px/var(--lh) var(--f-mono); tab-size: 4;
  white-space: pre; letter-spacing: 0; font-variant-ligatures: none;
}
.code-wrap pre {
  position: absolute; top: 0; left: 0; min-width: 100%; min-height: 100%; pointer-events: none; color: var(--ink);
  width: max-content; will-change: transform;
}
.code-wrap pre .bands { position: absolute; inset: 0 auto 0 12px; width: 80ch; pointer-events: none; }
.fixed .code-wrap pre .bands {
  background:
    linear-gradient(to right, var(--band) 0 6ch, var(--band-2) 6ch 7ch, transparent 7ch),
    linear-gradient(to right, transparent calc(7ch - 1px), var(--rule) calc(7ch - 1px) 7ch, transparent 7ch),
    linear-gradient(to right, transparent calc(11ch - 1px), var(--rule) calc(11ch - 1px) 11ch, transparent 11ch),
    linear-gradient(to right, transparent 72ch, var(--margin) 72ch calc(72ch + 1px), transparent calc(72ch + 1px)),
    linear-gradient(to right, transparent calc(72ch + 1px), var(--band) calc(72ch + 1px));
  opacity: .9;
}
.code-wrap pre .txt { position: relative; }
.code-wrap textarea {
  position: absolute; inset: 0; width: 100%; height: 100%; resize: none; outline: none; overflow: auto;
  background: transparent; color: transparent; caret-color: var(--ink); -webkit-text-fill-color: transparent;
}
.code-wrap textarea::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); -webkit-text-fill-color: transparent; }
.code-wrap.drop::after { content: "Drop a .cbl file to open it"; position: absolute; inset: 10px; border: 2px dashed var(--accent); border-radius: 8px; display: grid; place-items: center; background: color-mix(in srgb, var(--panel) 85%, transparent); font: 600 15px var(--f-cond); color: var(--accent); }
.tk-kw { color: var(--kw); font-weight: 500; }
.tk-div { color: var(--div); font-weight: 600; }
.tk-str { color: var(--str); }
.tk-num { color: var(--num); }
.tk-com { color: var(--com); font-style: italic; }
.tk-para { color: var(--para); font-weight: 600; }
.tk-seq { color: var(--ink-2); opacity: .7; }
.tk-pic { color: var(--num); }
.tk-err { text-decoration: wavy underline var(--bad); text-decoration-skip-ink: none; }

/* ---------- SYSOUT ---------- */
.sysout { display: flex; flex-direction: column; min-height: 0; border-top: 1px solid var(--rule); background: var(--sysout); }
.sysout header { display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 14px; border-bottom: 1px solid var(--rule); background: var(--paper); flex-wrap: wrap; }
.sysout header .lbl { font: 600 12px/1 var(--f-mono); letter-spacing: .12em; }
.runstate { font-size: 13px; color: var(--ink-2); margin-right: auto; display: flex; align-items: center; gap: 6px; }
.runstate .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rule); }
.runstate.running .dot { background: var(--accent); animation: pulse 1s infinite; }
.runstate.ok .dot { background: var(--ok); }
.runstate.bad .dot { background: var(--bad); }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .runstate.running .dot { animation: none; } }
.out {
  flex: 1; overflow: auto; padding: 0 0 12px; font: 13px/var(--lh) var(--f-mono);
  background-image: repeating-linear-gradient(to bottom, transparent 0 calc(var(--lh) * 3), var(--bar) calc(var(--lh) * 3) calc(var(--lh) * 6));
  background-attachment: local;
}
.out .ln { white-space: pre; padding: 0 14px; min-height: var(--lh); }
.out .ln.sys { color: var(--ink-2); font-style: italic; white-space: pre-wrap; }
.out .ln.err { color: var(--bad); white-space: pre-wrap; font-weight: 500; }
.out .ln.in { color: var(--accent); }
.out .ln.in::before { content: "> "; opacity: .6; }
.out .ln.ask { display: flex; align-items: center; gap: 6px; color: var(--accent); }
.out .ln.ask input { flex: 1; min-width: 0; border: 0; border-bottom: 1px solid var(--accent); background: transparent; font: 13px/var(--lh) var(--f-mono); padding: 0; outline: none; color: var(--ink); }
.out .placeholder { padding: 10px 14px; color: var(--ink-2); font: 13px/1.5 var(--f-sans); white-space: normal; }

.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--paper); padding: 9px 14px; border-radius: 6px; font-size: 14px; box-shadow: var(--shadow);
  opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; }

/* ---------- narrow screens ---------- */
@media (max-width: 900px) {
  html, body { height: auto; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .rail { border-right: 0; border-bottom: 1px solid var(--rule); max-height: 60vh; }
  .work { grid-template-rows: auto 56vh minmax(260px, auto); }
  .brand small { display: none; }
  .sep { display: none; }
  .btn .lbl-long { display: none; }
}
</style>
</head>
<body>
<header class="appbar">
  <div class="brand"><h1>COBOL <span>Workbench</span></h1><small>IDENTIFICATION · DATA · PROCEDURE</small></div>
  <div class="toolbar">
    <button class="btn primary" id="btnRun" title="Run (Ctrl+Enter)"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>Run</button>
    <button class="btn" id="btnStop" disabled title="Stop the running program"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="1"/></svg>Stop</button>
    <span class="sep"></span>
    <button class="btn ghost" id="btnNew" title="Start a new program"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>New</button>
    <button class="btn ghost" id="btnOpen" title="Open a .cbl file from your computer"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 4.5h4l1.5 1.5H14v6.5H2z"/></svg>Open<span class="lbl-long">&nbsp;.cbl</span></button>
    <button class="btn ghost" id="btnSave" title="Save as a .cbl file (Ctrl+S)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 2.5v8M4.5 7 8 10.5 11.5 7M3 13.5h10"/></svg>Save<span class="lbl-long">&nbsp;.cbl</span></button>
    <input type="file" id="fileInput" accept=".cbl,.cob,.cpy,.cbx,.txt" hidden>
    <button class="btn ghost" id="btnTheme" title="Switch light or dark theme" aria-label="Switch theme"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg><span id="themeLbl">Auto</span></button>
  </div>
</header>

<div class="main">
  <aside class="rail">
    <div class="tabs" role="tablist">
      <button role="tab" id="tabLessons" aria-selected="true" aria-controls="paneLessons">Lessons</button>
      <button role="tab" id="tabFiles" aria-selected="false" aria-controls="paneFiles">My programs</button>
      <button role="tab" id="tabRef" aria-selected="false" aria-controls="paneRef">Reference</button>
    </div>
    <section class="pane" id="paneLessons" role="tabpanel" aria-labelledby="tabLessons"></section>
    <section class="pane" id="paneFiles" role="tabpanel" aria-labelledby="tabFiles" hidden></section>
    <section class="pane" id="paneRef" role="tabpanel" aria-labelledby="tabRef" hidden>
      <h2>Quick reference</h2>
      <h3>Fixed-format columns</h3>
      <div class="colmap" aria-label="Column layout">
        <div class="s"><b>1–6</b>Seq</div>
        <div class="s"><b>7</b>*</div>
        <div class="a"><b>8</b>A</div>
        <div class="a"><b>12–72</b>Area B · statements</div>
        <div class="x"><b>73+</b>Ignored</div>
      </div>
      <p>Division, section and paragraph names start in Area A (column 8). Statements go in Area B (column 12 onward). Switch to <b>Free</b> format in the editor bar to type anywhere; free-format comments start with <code>*&gt;</code>.</p>
      <h3>PIC symbols</h3>
      <table class="mini"><tbody>
        <tr><td><code>X</code></td><td>any character</td></tr>
        <tr><td><code>A</code></td><td>letter or space</td></tr>
        <tr><td><code>9</code></td><td>digit</td></tr>
        <tr><td><code>V</code></td><td>implied decimal point (not printed)</td></tr>
        <tr><td><code>S</code></td><td>number can be negative</td></tr>
        <tr><td><code>(n)</code></td><td>repeat: <code>X(5)</code> is <code>XXXXX</code></td></tr>
        <tr><td><code>Z , .</code></td><td>zero suppression, comma, printed decimal</td></tr>
        <tr><td><code>$ * - + CR DB</code></td><td>currency, cheque stars, signs</td></tr>
      </tbody></table>
      <h3>Statements</h3>
      <table class="mini"><tbody>
        <tr><td><code>DISPLAY</code></td><td>print values; add <code>NO ADVANCING</code> to stay on the line</td></tr>
        <tr><td><code>ACCEPT</code></td><td>read typed input, or <code>FROM DATE</code> / <code>TIME</code></td></tr>
        <tr><td><code>MOVE</code></td><td>copy a value, fitted to the receiving PIC</td></tr>
        <tr><td><code>ADD SUBTRACT MULTIPLY DIVIDE</code></td><td>with <code>GIVING</code>, <code>ROUNDED</code>, <code>REMAINDER</code>, <code>ON SIZE ERROR</code></td></tr>
        <tr><td><code>COMPUTE</code></td><td>formulas with <code>+ - * / **</code></td></tr>
        <tr><td><code>IF / EVALUATE</code></td><td>decisions; close with <code>END-IF</code> / <code>END-EVALUATE</code></td></tr>
        <tr><td><code>PERFORM</code></td><td>paragraphs, <code>TIMES</code>, <code>UNTIL</code>, <code>VARYING</code>, inline with <code>END-PERFORM</code></td></tr>
        <tr><td><code>SET</code></td><td><code>SET name TO TRUE</code> for 88 levels; <code>UP BY</code> / <code>DOWN BY</code></td></tr>
        <tr><td><code>STRING UNSTRING</code></td><td>join and split text</td></tr>
        <tr><td><code>INSPECT</code></td><td><code>TALLYING</code>, <code>REPLACING</code>, <code>CONVERTING</code></td></tr>
        <tr><td><code>INITIALIZE</code></td><td>reset to spaces and zeros</td></tr>
        <tr><td><code>GO TO / EXIT</code></td><td>jump to a paragraph; <code>EXIT PARAGRAPH</code>, <code>EXIT PERFORM</code></td></tr>
        <tr><td><code>STOP RUN</code></td><td>end the program (<code>GOBACK</code> also works)</td></tr>
      </tbody></table>
      <h3>Functions</h3>
      <p><code>UPPER-CASE LOWER-CASE TRIM REVERSE LENGTH CONCATENATE NUMVAL SQRT ABS MOD REM INTEGER MAX MIN SUM MEAN MEDIAN RANDOM PI EXP LOG FACTORIAL CURRENT-DATE INTEGER-OF-DATE DATE-OF-INTEGER ORD CHAR</code></p>
      <h3>Not supported here</h3>
      <p>This workbench runs a teaching subset of COBOL in your browser. Files (<code>FD</code>, <code>OPEN</code>, <code>READ</code>, <code>WRITE</code>), <code>REDEFINES</code>, <code>COPY</code>, <code>CALL</code>, <code>SORT</code>, <code>SEARCH</code> and tables inside tables aren't available. Saved .cbl files are standard source, so they also compile with GnuCOBOL: <code>cobc -x HELLO.cbl</code>.</p>
    </section>
  </aside>

  <main class="work" id="work">
    <div class="docbar">
      <div class="docname" id="docname"></div>
      <span class="saved" id="savedNote"></span>
      <div class="seg" role="group" aria-label="Source format">

    </div>

      <div class="ruler" aria-hidden="true"><div class="gutter-pad">COL</div><div class="ruler-clip"><div class="ruler-inner" id="ruler"></div></div></div>

        <div class="gutter" aria-hidden="true"><div class="gutter-inner" id="gutter"></div></div>

          <pre id="hl" aria-hidden="true"><div class="bands"></div><div class="txt" id="hlTxt"></div></pre>

        </div>

    <section class="sysout" aria-label="Program output">
      <header>
        <span class="lbl">SYSOUT</span>
        <span class="runstate" id="runstate"><span class="dot"></span><span id="runtext">Ready</span></span>

      <div class="out" id="out" role="log" aria-live="polite"><div class="placeholder">Output from DISPLAY appears here, one line per DISPLAY, on green-bar paper like an old line printer. Press Run or Ctrl+Enter.</div></div>
    </section>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>

      if (it.pic) throw E(it.line, `${it.name} has a PIC clause and also items under it. A group item can't have a PIC.`);
      it.kind = 'G';
      it.children.forEach(c => finalize(c, owner));
      it.len = it.children.reduce((a, c) => a + c.len * (c.occurs || 1), 0);
    } else if (!it.isIndex) {
      if (!it.pic) throw E(it.line, `${it.name} needs a PIC clause, for example PIC X(10) or PIC 9(4).`);
      Object.assign(it, parsePic(it.pic, it.line));
    }
    it.conds.forEach(c => { c.owner = owner; });
  }
  top.forEach(it => finalize(it, null));
  for (const it of all) {
    if (it.name === 'FILLER') continue;
    if (!byName.has(it.name)) byName.set(it.name, []);
    byName.get(it.name).push(it);
  }

  /* ---- PROCEDURE DIVISION ---- */
  let ps = procAt + 2;
  while (ps < toks.length && toks[ps].t !== 'period') ps++;

  const ptoks = toks.slice(ps);
  for (let i = 0; i < ptoks.length; i++) {
    const t = ptoks[i];
    if (t.t !== 'word' || VERBS.has(t.u) || RESERVED.has(t.u) || UNSUP[t.u]) continue;

  while (P.peek().t !== 'eof') {
    const t = P.peek();
    if (t.t === 'period') { P.next(); continue; }
    if (t.t === 'word' && ctx.paraNames.has(t.u) && (P.peek(1).t === 'period' || P.is('SECTION', 1))) {
      P.next();
      const isSection = !!P.accept('SECTION');
      P.next();
      if (paras.some(p => p.name === t.u)) throw E(t.line, `there are two paragraphs called ${t.u}. Each paragraph name must be unique.`);
      paras.push({ name: t.u, isSection, stmts: [], line: t.line });

    }
    if (t.t === 'word' && t.u === 'END' && P.is('PROGRAM', 1)) { while (P.peek().t !== 'eof' && P.peek().t !== 'period') P.next(); continue; }

    const e = P.peek();
    if (e.t !== 'period' && e.t !== 'eof') throw E(e.line, `unexpected ${desc(e)}.`);
    paras[paras.length - 1].stmts.push(...stmts);
  }
  if (!paras[0].stmts.length && paras.length > 1) paras.shift();
  const paraIndex = new Map();
  paras.forEach((p, i) => { if (p.name) paraIndex.set(p.name, i); });
  paras.forEach((p, i) => {
    if (p.isSection) { let j = i + 1; while (j < paras.length && !paras[j].isSection) j++; p.end = j - 1; }
    else p.end = i;
  });
  return { name: progId || 'PROGRAM', all, top, byName, paras, paraIndex };
}

/* ===================== Runtime ===================== */
function padR(s, n) { return s.length >= n ? s.slice(0, n) : s + ' '.repeat(n - s.length); }
function fill(ch, n) { if (!ch.length) ch = ' '; let s = ''; while (s.length < n) s += ch; return s.slice(0, n); }
const tick = () => new Promise(r => setTimeout(r, 0));

class Runtime {

    for (const it of prog.top) this.applyValues(it);

  initStorage(it) {

</ul>
<p>One MOVE can fill several fields at once: <code>MOVE 0 TO WS-A WS-B</code>.</p>`,

/* ---------------- syntax highlighting ---------------- */
const KW = new Set(`ACCEPT ADD ADVANCING AFTER ALL ALSO AND ANY ARE ASCENDING AT BEFORE BINARY BLANK BY CHARACTERS COMP COMP-3 COMPUTE CONTINUE CONVERTING CORRESPONDING COUNT CYCLE DELIMITED DELIMITER DEPENDING DESCENDING DISPLAY DIVIDE DOWN ELSE END-ACCEPT END-ADD END-COMPUTE END-DISPLAY END-DIVIDE END-EVALUATE END-IF END-INSPECT END-MULTIPLY END-PERFORM END-STRING END-SUBTRACT END-UNSTRING EQUAL ERROR EVALUATE EXIT FALSE FILLER FIRST FOR FROM FUNCTION GIVING GO GOBACK GREATER IF IN INDEXED INITIAL INITIALIZE INSPECT INTO IS JUST JUSTIFIED KEY LEADING LESS MOVE MULTIPLY NEXT NO NOT NUMERIC ALPHABETIC NEGATIVE POSITIVE OCCURS OF ON OR OTHER OVERFLOW PARAGRAPH PERFORM PIC PICTURE POINTER PROGRAM REDEFINES REMAINDER REPLACING ROUNDED RUN SENTENCE SET SIGN SIZE STOP STRING SUBTRACT TALLYING TEST THAN THEN THROUGH THRU TIMES TO TRAILING TRUE UNSTRING UNTIL UP UPON USAGE VALUE VALUES VARYING WHEN WITH SPACE SPACES ZERO ZEROS ZEROES HIGH-VALUE HIGH-VALUES LOW-VALUE LOW-VALUES QUOTE QUOTES`.split(/\s+/));
const DIVW = new Set('IDENTIFICATION ID ENVIRONMENT DATA PROCEDURE DIVISION SECTION WORKING-STORAGE LOCAL-STORAGE FILE LINKAGE CONFIGURATION INPUT-OUTPUT PROGRAM-ID AUTHOR DATE-WRITTEN INSTALLATION'.split(' '));
function hlCode(s) {
  const head = /^(\s*)([A-Za-z0-9][A-Za-z0-9-]*)(\s*\.\s*)$/.exec(s);
  if (head && !KW.has(head[2].toUpperCase()) && !DIVW.has(head[2].toUpperCase()) && !/^\d+$/.test(head[2])) {
    return esc(head[1]) + `<span class="tk-para">${esc(head[2])}</span>` + esc(head[3]);
  }
  const re = /("(?:[^"]|"")*"?|'(?:[^']|'')*'?)|(\*>.*$)|([A-Za-z0-9][A-Za-z0-9-]*)|(\s+)|([^\sA-Za-z0-9"'])/g;
  let o = '', m, picNext = false;
  while ((m = re.exec(s))) {
    const u = m[3] ? m[3].toUpperCase() : '';
    if (picNext && !m[4] && u !== 'IS') {
      let p = /^\S*/.exec(s.slice(m.index))[0];
      if (p.endsWith('.')) p = p.slice(0, -1);
      o += `<span class="tk-pic">${esc(p)}</span>`;
      re.lastIndex = m.index + p.length; picNext = false; continue;
    }
    if (m[1]) o += `<span class="tk-str">${esc(m[1])}</span>`;
    else if (m[2]) o += `<span class="tk-com">${esc(m[2])}</span>`;
    else if (m[3]) {
      if (/^\d+$/.test(m[3])) o += `<span class="tk-num">${m[3]}</span>`;
      else if (DIVW.has(u)) o += `<span class="tk-div">${esc(m[3])}</span>`;
      else if (KW.has(u)) o += `<span class="tk-kw">${esc(m[3])}</span>`;
      else o += esc(m[3]);
      if (u === 'PIC' || u === 'PICTURE') picNext = true;
    } else o += esc(m[0]);
  }
  return o;
}
function hlLine(line) {
  line = line.replace(/\t/g, '    ');
  if (/^\s*>>/.test(line)) return `<span class="tk-div">${esc(line)}</span>`;
  if (fmt === 'fixed') {
    const seq = line.slice(0, 6), ind = line.slice(6, 7), rest = line.slice(7, 72), tail = line.slice(72);
    let h = seq ? `<span class="tk-seq">${esc(seq)}</span>` : '';
    if (ind === '*' || ind === '/') return h + `<span class="tk-com">${esc(line.slice(6))}</span>`;
    h += (ind === ' ' || ind === '') ? ind : `<span class="tk-err">${esc(ind)}</span>`;
    return h + hlCode(rest) + (tail ? `<span class="tk-seq tk-err">${esc(tail)}</span>` : '');
  }
  if (/^\s*\*>/.test(line)) return `<span class="tk-com">${esc(line)}</span>`;
  return hlCode(line);
}
let lastLineCount = -1, lastErr = -1, rafId = 0;
function render() {
  const lines = code.value.split('\n');
  hlTxt.innerHTML = lines.map(hlLine).join('\n') + '\n ';
  if (lines.length !== lastLineCount || errLine !== lastErr) {
    let g = '';
    for (let i = 1; i <= lines.length; i++) g += i === errLine ? `<div class="err">${i}</div>` : `<div>${i}</div>`;
    gutter.innerHTML = g;
    lastLineCount = lines.length; lastErr = errLine;
  }
}
function scheduleRender() { cancelAnimationFrame(rafId); rafId = requestAnimationFrame(render); }
function syncScroll() {
  const x = code.scrollLeft, y = code.scrollTop;
  hl.style.transform = `translate(${-x}px, ${-y}px)`;
  gutter.style.transform = `translateY(${-y}px)`;
  ruler.style.transform = `translateX(${-x}px)`;
}
code.addEventListener('scroll', syncScroll);

/* ---------------- ruler + status ---------------- */
let rulerCol = 0;
function buildRuler(active) {
  let h = '';
  for (let c = 1; c <= 80; c++) {
    let ch = c % 10 === 0 ? String((c / 10) % 10) : c % 5 === 0 ? '+' : '-', cls = '';
    if (fmt === 'fixed') {
      if (c === 7) ch = '*';
      if (c === 8) { ch = 'A'; cls = 'm'; }
      if (c === 12) { ch = 'B'; cls = 'm'; }
      if (c === 72) { ch = '|'; cls = 'r'; }
    }
    if (c === active) cls = 'on';
    h += cls ? `<span class="${cls}">${ch}</span>` : ch;
  }
  ruler.innerHTML = h;
  rulerCol = active;
}
function areaName(col) {
  if (fmt !== 'fixed') return 'Free format';
  if (col <= 6) return 'Sequence area';
  if (col === 7) return 'Indicator (column 7)';
  if (col <= 11) return 'Area A';
  if (col <= 72) return 'Area B';
  return 'Ignored (past 72)';
}
function updateStatus() {
  const a = code.selectionStart, v = code.value;
  const ls = v.lastIndexOf('\n', a - 1) + 1;
  const ln = v.slice(0, a).split('\n').length;
  const col = a - ls + 1;
  $('status').innerHTML = `Ln ${ln}, Col ${col} · <b>${areaName(col)}</b>`;
  if (col !== rulerCol) buildRuler(col);
}
['keyup', 'click', 'select', 'focus'].forEach(ev => code.addEventListener(ev, updateStatus));
document.addEventListener('selectionchange', () => { if (document.activeElement === code) updateStatus(); });

/* ---------------- editing keys ---------------- */
function insertText(t) {
  let ok = false;
  try { ok = document.execCommand('insertText', false, t); } catch (e) { ok = false; }
  if (!ok) {
    code.setRangeText(t, code.selectionStart, code.selectionEnd, 'end');
    code.dispatchEvent(new Event('input'));
  }
}
function stops() {
  if (fmt === 'fixed') { const s = [7, 11]; for (let c = 15; c < 76; c += 4) s.push(c); return s; }
  const s = []; for (let c = 4; c < 120; c += 4) s.push(c); return s;
}
code.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key === 'Enter') { e.preventDefault(); run(); return; }
  if (mod && (e.key === 's' || e.key === 'S')) { e.preventDefault(); saveCbl(); return; }
  if (e.key === 'Tab') {
    e.preventDefault();
    const a = code.selectionStart, b = code.selectionEnd, v = code.value;
    const ls = v.lastIndexOf('\n', a - 1) + 1;
    if (v.slice(a, b).includes('\n')) {
      const block = v.slice(ls, b);
      const nb = block.split('\n').map(l => e.shiftKey ? l.replace(/^ {1,4}/, '') : '    ' + l).join('\n');
      code.setSelectionRange(ls, b); insertText(nb); code.setSelectionRange(ls, ls + nb.length);
      return;
    }
    const col = a - ls;
    if (e.shiftKey) {
      const prev = [0, ...stops()].filter(s => s < col).pop() || 0;
      const seg = v.slice(ls + prev, a);
      if (seg && /^ +$/.test(seg)) { code.setSelectionRange(ls + prev, a); insertText(''); }
      return;
    }
    const next = stops().find(s => s > col) ?? col + 4;
    insertText(' '.repeat(next - col));
    return;
  }
  if (e.key === 'Enter' && !mod && !e.shiftKey && !e.altKey) {
    e.preventDefault();
    const a = code.selectionStart, v = code.value;
    const ls = v.lastIndexOf('\n', a - 1) + 1;
    const cur = v.slice(ls, a);
    let ind = /^ */.exec(cur)[0];
    const para = /^(\s*)([A-Za-z0-9][A-Za-z0-9-]*)\s*\.\s*$/.exec(cur);
    if (fmt === 'fixed' && para && para[1].length === 7 && !KW.has(para[2].toUpperCase()) && !DIVW.has(para[2].toUpperCase())) ind = ' '.repeat(11);
    insertText('\n' + ind);
  }
});
let saveT;
code.addEventListener('input', () => {
  scheduleRender();
  if (errLine) { errLine = 0; scheduleRender(); }
  clearTimeout(saveT);
  $('savedNote').textContent = 'Editing…';
  saveT = setTimeout(() => { saveCurrent(); noteSaved(); }, 450);
  updateStatus();
});

/* ---------------- format toggle ---------------- */
function setFmt(f, persist) {
  fmt = f;
  work.classList.toggle('fixed', f === 'fixed');
  $('fmtFixed').setAttribute('aria-pressed', String(f === 'fixed'));
  $('fmtFree').setAttribute('aria-pressed', String(f === 'free'));
  buildRuler(rulerCol);
  render(); updateStatus();
  if (persist) saveCurrent();
}
$('fmtFixed').onclick = () => setFmt('fixed', true);
$('fmtFree').onclick = () => setFmt('free', true);

/* ---------------- documents ---------------- */
function lessonById(id) { return LESSONS.find(l => l.id === id); }
function saveCurrent() {
  if (!doc) return;
  const v = code.value;
  if (doc.kind === 'lesson') {
    const L = lessonById(doc.id);
    if (v === L.code) delete drafts['lesson:' + doc.id]; else drafts['lesson:' + doc.id] = v;
    store.set('drafts', drafts);
  } else if (files[doc.name]) {
    files[doc.name] = { ...files[doc.name], code: v, fmt, updated: Date.now() };
    store.set('files', files);
  }
}
function noteSaved() {
  if (!doc) return;
  $('savedNote').textContent = doc.kind === 'lesson'
    ? (drafts['lesson:' + doc.id] ? 'Your edits are kept in this browser' : 'Starter code')
    : 'Kept in this browser';
}
function setCode(v, f) {
  code.value = v;
  errLine = 0;
  code.scrollTop = 0; code.scrollLeft = 0;
  setFmt(f || 'fixed', false);
  syncScroll();
  code.setSelectionRange(0, 0);
}
function renderDocbar() {
  const dn = $('docname');
  if (!doc) { dn.innerHTML = ''; return; }
  if (doc.kind === 'lesson') {
    const i = LESSONS.findIndex(l => l.id === doc.id);
    dn.innerHTML = `<span>Lesson ${i + 1}</span><span class="ext">· ${esc(LESSONS[i].title)}</span>
      <button class="btn ghost" id="btnKeep" style="height:28px" title="Copy this code into My programs">Copy to My programs</button>`;
    $('btnKeep').onclick = () => {
      const base = (programIdOf(code.value) || LESSONS[i].id).toUpperCase();
      const name = uniqueName(base);
      files[name] = { code: code.value, fmt, updated: Date.now() };
      store.set('files', files);
      openFile(name); showTab('Files');
      toast(`Copied to My programs as ${name}`);
    };
  } else {
    dn.innerHTML = `<input id="nameInput" value="${esc(doc.name)}" aria-label="Program name" maxlength="30"><span class="ext">.cbl</span>`;
    const ni = $('nameInput');
    const commit = () => {
      let n = ni.value.toUpperCase().replace(/[^A-Z0-9-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 30);
      if (!n || n === doc.name) { ni.value = doc.name; return; }
      n = uniqueName(n);
      files[n] = files[doc.name]; delete files[doc.name];
      doc = { kind: 'file', name: n }; store.set('files', files); store.set('last', doc);
      ni.value = n; renderFiles(); toast(`Renamed to ${n}`);
    };
    ni.addEventListener('change', commit);
    ni.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); ni.blur(); } });
  }
  noteSaved();
}
function programIdOf(v) { const m = /PROGRAM-ID\.?\s+([A-Za-z0-9-]+)/i.exec(v); return m ? m[1].toUpperCase() : null; }
function uniqueName(base) {
  base = (base || 'PROGRAM').toUpperCase().replace(/[^A-Z0-9-]+/g, '-').slice(0, 26) || 'PROGRAM';
  if (!files[base]) return base;
  for (let k = 2; ; k++) if (!files[`${base}-${k}`]) return `${base}-${k}`;
}
function openLesson(i) {
  saveCurrent();
  lessonIdx = Math.max(0, Math.min(LESSONS.length - 1, i));
  const L = LESSONS[lessonIdx];
  doc = { kind: 'lesson', id: L.id };
  store.set('last', doc); store.set('lastLesson', L.id);
  setCode(drafts['lesson:' + L.id] ?? L.code, 'fixed');
  renderLesson(); renderDocbar(); renderFiles();
  resetOutput();
}
function openFile(name) {
  saveCurrent();
  const f = files[name]; if (!f) return;
  doc = { kind: 'file', name };
  store.set('last', doc);
  setCode(f.code, f.fmt || COBOL.detectFormat(f.code));
  renderDocbar(); renderFiles(); renderLesson();
  resetOutput();
}

/* ---------------- lessons pane ---------------- */
function renderLesson() {
  const L = LESSONS[lessonIdx];
  const onLesson = doc && doc.kind === 'lesson';
  const chips = LESSONS.map((l, i) => `<button class="chip${i === lessonIdx && onLesson ? ' cur' : ''}${passed[l.id] ? ' done' : ''}" data-i="${i}" title="${esc(l.title)}${passed[l.id] ? ' (challenge done)' : ''}" aria-label="Lesson ${i + 1}: ${esc(l.title)}">${i + 1}</button>`).join('');
  const ch = L.challenge;
  $('paneLessons').innerHTML = `
    <div class="chips">${chips}</div>
    <div class="eyebrow">Lesson ${lessonIdx + 1} of ${LESSONS.length}</div>
    <h2>${esc(L.title)}</h2>
    ${onLesson ? '' : `<p class="verdict" style="background:var(--accent-soft);color:var(--accent)">You're editing one of your own programs. <button class="btn" id="btnBack" style="height:28px;margin-left:6px">Open this lesson's code</button></p>`}
    ${L.body}
    <div class="challenge">
      <h3>Challenge</h3>
      <p>${ch.task}</p>
      <div class="row">
        <button class="btn primary" id="btnCheck"${onLesson ? '' : ' disabled'}>Check my answer</button>
        <button class="btn" id="btnHint">Show hint</button>
        <button class="btn ghost" id="btnReset"${onLesson ? '' : ' disabled'} title="Put the original lesson code back">Reset code</button>
      </div>
      <div class="hint" id="hint" hidden><code>${esc(ch.hint)}</code></div>
      <div id="verdict">${passed[L.id] ? '<div class="verdict ok">You have completed this challenge.</div>' : ''}</div>
    </div>
    <div class="lesson-nav">
      <button class="btn" id="btnPrev"${lessonIdx === 0 ? ' disabled' : ''}>← Previous</button>
      <button class="btn" id="btnNext"${lessonIdx === LESSONS.length - 1 ? ' disabled' : ''}>Next lesson →</button>
    </div>`;
  $('paneLessons').querySelectorAll('.chip').forEach(b => b.onclick = () => openLesson(+b.dataset.i));
  $('btnHint').onclick = () => { const h = $('hint'); h.hidden = !h.hidden; $('btnHint').textContent = h.hidden ? 'Show hint' : 'Hide hint'; };
  $('btnCheck').onclick = check;
  const reset = $('btnReset');
  reset.onclick = () => {
    if (reset.dataset.arm) {
      delete drafts['lesson:' + L.id]; store.set('drafts', drafts);
      setCode(L.code, 'fixed'); noteSaved(); reset.textContent = 'Reset code'; delete reset.dataset.arm; toast('Starter code restored');
    } else { reset.dataset.arm = '1'; reset.textContent = 'Click again to reset'; setTimeout(() => { if (reset.isConnected) { reset.textContent = 'Reset code'; delete reset.dataset.arm; } }, 3000); }
  };
  $('btnPrev').onclick = () => { openLesson(lessonIdx - 1); $('paneLessons').scrollTop = 0; };
  $('btnNext').onclick = () => { openLesson(lessonIdx + 1); $('paneLessons').scrollTop = 0; };
  const back = $('btnBack'); if (back) back.onclick = () => openLesson(lessonIdx);
}

/* ---------------- files pane ---------------- */
function fmtDate(t) {
  const d = new Date(t), now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}
function renderFiles() {
  const names = Object.keys(files).sort((a, b) => (files[b].updated || 0) - (files[a].updated || 0));
  $('paneFiles').innerHTML = `
    <h2>My programs</h2>
    <div class="row" style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn primary" id="fNew">New program</button>
      <button class="btn" id="fOpen">Open .cbl file…</button>
    </div>
    ${names.length ? `<ul class="files">${names.map(n => `
      <li class="${doc && doc.kind === 'file' && doc.name === n ? 'cur' : ''}">
        <button class="fname" data-n="${esc(n)}" title="Open ${esc(n)}">${esc(n)}.cbl</button>
        <span class="fdate">${fmtDate(files[n].updated || Date.now())}</span>
        <button class="btn ghost" data-del="${esc(n)}" style="height:28px;padding:0 8px" aria-label="Delete ${esc(n)}">Delete</button>
      </li>`).join('')}</ul>`
    : `<p class="empty">No programs yet. Start a new one, open a .cbl file from your computer, or use "Copy to My programs" on any lesson.</p>`}
    <p style="font-size:14px;color:var(--ink-2)">Programs here are kept in this browser's storage. Use <b>Save .cbl</b> to keep a real file on your computer that you can open again later or compile with GnuCOBOL.</p>`;
  $('fNew').onclick = newProgram;
  $('fOpen').onclick = () => $('fileInput').click();
  $('paneFiles').querySelectorAll('.fname').forEach(b => b.onclick = () => openFile(b.dataset.n));
  $('paneFiles').querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const n = b.dataset.del;
    if (!b.dataset.arm) {
      b.dataset.arm = '1'; b.textContent = 'Confirm'; b.style.color = 'var(--bad)';
      setTimeout(() => { if (b.isConnected) { b.textContent = 'Delete'; b.style.color = ''; delete b.dataset.arm; } }, 3000);
      return;
    }
    delete files[n]; store.set('files', files);
    if (doc && doc.kind === 'file' && doc.name === n) { doc = null; openLesson(lessonIdx); }
    renderFiles(); toast(`Deleted ${n}`);
  });
}
function newProgram() {
  const name = uniqueName('MY-PROGRAM');
  files[name] = { code: TEMPLATE(name), fmt: 'fixed', updated: Date.now() };
  store.set('files', files);
  openFile(name); showTab('Files');
  code.focus();
}
$('btnNew').onclick = newProgram;

/* ---------------- open / save .cbl ---------------- */
$('btnOpen').onclick = () => $('fileInput').click();
$('fileInput').addEventListener('change', e => { const f = e.target.files[0]; if (f) loadFile(f); e.target.value = ''; });
function loadFile(f) {
  if (f.size > 2_000_000) { toast('That file is too large to open here.'); return; }
  const r = new FileReader();
  r.onload = () => {
    const text = String(r.result).replace(/\r\n?/g, '\n');
    const base = f.name.replace(/\.[^.]+$/, '');
    const name = uniqueName(base);
    files[name] = { code: text, fmt: COBOL.detectFormat(text), updated: Date.now() };
    store.set('files', files);
    openFile(name); showTab('Files');
    toast(`Opened ${f.name}`);
  };
  r.onerror = () => toast(`Couldn't read ${f.name}.`);
  r.readAsText(f);
}
async function saveCbl() {
  saveCurrent();
  const base = doc && doc.kind === 'file' ? doc.name : (programIdOf(code.value) || 'PROGRAM');
  const fname = base + '.cbl';
  const text = code.value.endsWith('\n') ? code.value : code.value + '\n';
  if (window.showSaveFilePicker) {
    try {
      const h = await window.showSaveFilePicker({ suggestedName: fname, types: [{ description: 'COBOL source', accept: { 'text/plain': ['.cbl', '.cob'] } }] });
      const w = await h.createWritable(); await w.write(text); await w.close();
      toast(`Saved ${h.name}`); return;
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
  }
  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = fname;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast(`Downloaded ${fname}`);
}
$('btnSave').onclick = saveCbl;
const cw = $('codeWrap');
cw.addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('Files')) { e.preventDefault(); cw.classList.add('drop'); } });
cw.addEventListener('dragleave', () => cw.classList.remove('drop'));
cw.addEventListener('drop', e => { cw.classList.remove('drop'); const f = e.dataTransfer.files[0]; if (f) { e.preventDefault(); loadFile(f); } });

['Lessons', 'Files', 'Ref'].forEach(t => $('tab' + t).onclick = () => showTab(t));

/* ---------------- running ---------------- */
function setState(kind, text) {
  const rs = $('runstate'); rs.className = 'runstate ' + (kind || '');
  $('runtext').textContent = text;
}
function resetOutput() {
  out.innerHTML = '<div class="placeholder">Output from DISPLAY appears here, one line per DISPLAY, on green-bar paper like an old line printer. Press Run or Ctrl+Enter.</div>';
  setState('', 'Ready');
}
$('btnClear').onclick = resetOutput;
function sysLine(text, cls) {
  const d = document.createElement('div'); d.className = 'ln ' + (cls || 'sys'); d.textContent = text; out.appendChild(d);
  out.scrollTop = out.scrollHeight; return d;
}
function showError(e) {
  const msg = e && e.message ? e.message : String(e);
  sysLine(msg, 'err');
  if (e && e.line) {
    errLine = e.line; render();
    const top = (e.line - 3) * parseFloat(getComputedStyle(code).lineHeight || 21);
    if (e.line * 21 < code.scrollTop || e.line * 21 > code.scrollTop + code.clientHeight - 30) code.scrollTop = Math.max(0, top);
  }
}
const MAX_LINES = 5000;
async function run(opts = {}) {
  if (running) return null;
  saveCurrent();
  errLine = 0; render();
  out.innerHTML = '';
  let prog;
  try { prog = COBOL.compile(code.value, fmt === 'fixed'); }
  catch (e) {
    if (!(e instanceof COBOL.CobolError)) console.error(e);
    showError(e); setState('bad', 'Could not compile'); return null;
  }
  const lines = []; let cur = null, shown = 0;
  const scroll = () => { out.scrollTop = out.scrollHeight; };
  const host = {
    write(t, nl) {
      if (!cur) {
        cur = { t: '', el: null };
        if (shown < MAX_LINES) { cur.el = document.createElement('div'); cur.el.className = 'ln'; out.appendChild(cur.el); }
        shown++;
        if (shown === MAX_LINES + 1) sysLine(`Showing the first ${MAX_LINES.toLocaleString()} lines only.`);
      }
      cur.t += t;
      if (cur.el) cur.el.textContent = cur.t;
      if (nl) { lines.push(cur.t); cur = null; }
      scroll();
    },
    input(name) {
      const prefix = cur ? cur.t : '';
      if (cur && cur.el) cur.el.remove();
      const finish = v => { lines.push(prefix + v); const d = sysLine(prefix + v, 'in'); if (prefix) { d.className = 'ln'; d.innerHTML = esc(prefix) + `<span style="color:var(--accent)">${esc(v)}</span>`; } cur = null; };
      if (opts.inputs) {
        const v = opts.inputs.shift();
        if (v == null) return Promise.reject(new COBOL.CobolError(`The program asked for more input than this challenge types in. It only answers ${opts.inputCount} ACCEPT${opts.inputCount === 1 ? '' : 's'}.`, runtime ? runtime.line : 0));
        finish(v); return Promise.resolve(v);
      }
      return new Promise(res => {
        const row = document.createElement('div'); row.className = 'ln ask';
        row.innerHTML = `${prefix ? `<span style="color:var(--ink)">${esc(prefix)}</span>` : '<span aria-hidden="true">&gt;</span>'}<input aria-label="Type a value for ${esc(name)} and press Enter" placeholder="type a value for ${esc(name)}, then Enter">`;
        out.appendChild(row); scroll();
        const inp = row.querySelector('input');
        setState('running', `Waiting for input (${name})`);
        setTimeout(() => inp.focus(), 0);
        pendingInput = v => { row.remove(); pendingInput = null; if (v != null) finish(v); res(v ?? ''); };
        inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); setState('running', 'Running…'); pendingInput(inp.value); } });
      });
    }
  };
  runtime = new COBOL.Runtime(prog, host);
  running = true;
  $('btnRun').disabled = true; $('btnStop').disabled = false;
  setState('running', 'Running…');
  const t0 = performance.now();
  try {
    await runtime.run();
    if (cur) lines.push(cur.t);
    const ms = Math.round(performance.now() - t0);
    if (!out.children.length) sysLine('The program ran but displayed nothing.');
    setState('ok', `Finished · ${runtime.steps.toLocaleString()} statements · ${ms} ms`);
    return { lines };
  } catch (e) {
    if (e instanceof COBOL.Halt) { sysLine('Stopped.'); setState('', 'Stopped'); return null; }
    if (!(e instanceof COBOL.CobolError)) console.error(e);
    showError(e); setState('bad', 'Stopped with an error');
    return null;
  } finally {
    running = false; runtime = null; pendingInput = null;
    $('btnRun').disabled = false; $('btnStop').disabled = true;
  }
}
$('btnRun').onclick = () => run();
$('btnStop').onclick = () => { if (runtime) { runtime.stopped = true; if (pendingInput) pendingInput(null); } };

async function check() {
  const L = LESSONS[lessonIdx], ch = L.challenge;
  const vd = $('verdict');
  vd.innerHTML = '';
  const inputs = [...(ch.inputs || [])];
  const r = await run({ inputs, inputCount: inputs.length });
  if (!r) { vd.innerHTML = `<div class="verdict bad">Your program didn't finish cleanly. Fix the error shown in SYSOUT, then check again.</div>`; return; }
  const norm = s => s.replace(/\s+/g, ' ').trim();
  const got = r.lines.map(norm);
  let pos = 0, missing = null;
  for (const exp of ch.expect) {
    const e = norm(exp);
    let found = -1;
    for (let k = pos; k < got.length; k++) if (got[k] === e) { found = k; break; }
    if (found < 0) { missing = exp; break; }
    pos = found + 1;
  }
  if (!missing) {
    passed[L.id] = true; store.set('passed', passed);
    renderLesson();
    $('verdict').innerHTML = `<div class="verdict ok">Correct. Your output has every line this challenge asks for.${lessonIdx < LESSONS.length - 1 ? ' On to the next lesson when you are ready.' : ' That was the last lesson.'}</div>`;
  } else {
    const count = ch.expect.filter(x => norm(x) === norm(missing)).length;
    vd.innerHTML = `<div class="verdict bad">Not yet. I was looking for ${count > 1 ? `${count} lines` : 'a line'} reading <code>${esc(missing)}</code> in the output. Spaces between words don't matter, but spelling and capitals do.</div>`;
  }
}

/* ---------------- start ---------------- */
window.addEventListener('beforeunload', saveCurrent);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveCurrent(); });
buildRuler(1);
const last = store.get('last', null);
if (last && last.kind === 'file' && files[last.name]) {
  const li = LESSONS.findIndex(l => l.id === store.get('lastLesson', LESSONS[0].id));
  lessonIdx = li < 0 ? 0 : li;
  openFile(last.name);
} else if (last && last.kind === 'lesson' && lessonById(last.id)) {
  openLesson(LESSONS.findIndex(l => l.id === last.id));
} else openLesson(0);
showTab(store.get('tab', 'Lessons'));
renderFiles();
})();

<script>const SEED=[{"category":"military","createdAt":1792182600000,"detail":"- The military equivalent of a post-incident review.\n- Works best when it is blameless, so people share honestly.\n- Use it after tabletop exercises and real incidents, and feed the results into the risk register.","example":"","flagged":false,"kind":"term","related":["Post-incident review","Tabletop exercise","Risk register"],"summary":"After-action review: a structured debrief that asks what was supposed to happen, what did happen, why they differ, and what to keep or change.","tags":["incident","process","military"],"title":"AAR","updatedAt":1792182599981,"id":"aar"},{"category":"risk","createdAt":1790983894413,"detail":"","example":"A few minutes of website downtime once a year.","flagged":false,"kind":"term","related":["Risk appetite","Residual risk"],"summary":"Knowingly live with a risk because it is small or fixing it costs more than the harm. Acceptance should be documented and signed off by someone with authority.","tags":["lesson-2","risk-response"],"title":"Accept (risk response)","updatedAt":1790983894398,"id":"accept-risk-response"},{"category":"security","createdAt":1790983894413,"detail":"","example":"","flagged":false,"kind":"term","related":["Least privilege","Evidence"],"summary":"A periodic check, often quarterly, that each person's access is still appropriate. Managers or system owners sign off.","tags":["access","audit"],"title":"Access review","updatedAt":1790983894344,"id":"access-review"},{"category":"linux","createdAt":1792173300000,"detail":"**Option 1: Gear Lever.** It is a Flatpak app that manages AppImages for you, including menu entries and updates for apps that support them.\n\n```\nflatpak install flathub it.mijorus.gearlever\n```\n\n**Option 2: write the launcher yourself.** Create `~/.local/share/applications/myapp.desktop`:\n\n```\n[Desktop Entry]\nType=Application\nName=My App\nExec=/home/yourname/Applications/MyApp-x86_64.AppImage\nIcon=/home/yourname/Applications/myapp.png\nTerminal=false\nCategories=Utility;\n```\n\nThen refresh the menu:\n\n```\nupdate-desktop-database ~/.local/share/applications\n```\n\n- Use the full path in `Exec` and `Icon`. A `~` does not work there.\n- To get an icon, run the AppImage with `--appimage-extract`, then copy a .png from the `squashfs-root` folder.\n- To run it from the terminal by name, see PATH and shell config.","example":"","flagged":false,"kind":"note","related":["Running an AppImage on Fedora","Flatpak","PATH and shell config"],"summary":"Two ways to make an AppImage show up in the app launcher: Gear Lever, or a hand-written .desktop file.","tags":["appimage","how-to","linux"],"title":"Adding an AppImage to the app menu","updatedAt":1792173299988,"id":"adding-an-appimage-to-the-app-menu"},{"category":"controls","createdAt":1790983894413,"detail":"","example":"Annual security training; a policy requiring employees to lock their computers.","flagged":false,"kind":"term","related":["Technical control","Policy, standard, procedure"],"summary":"A control made of policies, procedures and training that people must follow.","tags":["lesson-3"],"title":"Administrative control","updatedAt":1790983894390,"id":"administrative-control"},{"category":"ai","createdAt":1790983894413,"detail":"Location, postal code or name can act as proxies for protected grounds, so a model can discriminate without ever seeing them.","example":"AI rental screening that rejects far more applicants from certain neighbourhoods.","flagged":false,"kind":"term","related":["Tenant screening","EU AI Act"],"summary":"When an AI system produces unfair results for certain groups, often because of skewed training data or proxy variables.","tags":["lesson-8"],"title":"AI bias","updatedAt":1790983894329,"id":"ai-bias"},{"category":"military","createdAt":1792182600000,"detail":"- Air gaps are not perfect. The Stuxnet malware crossed one on infected USB drives.\n- Controls: strict rules on removable media and one-way transfer devices called data diodes.\n- Common in industrial control systems as well as defence.","example":"","flagged":false,"kind":"term","related":["Defense in depth","Classification levels","Physical control"],"summary":"An air gap is a network physically separated from the internet and other networks. US classified networks include NIPRNet (unclassified), SIPRNet (secret) and JWICS (top secret and SCI).","tags":["cyber","networks","military"],"title":"Air gap and classified networks","updatedAt":1792182599984,"id":"air-gap-and-classified-networks"},{"category":"refintech","createdAt":1790983894413,"detail":"Canada's law is the Proceeds of Crime (Money Laundering) and Terrorist Financing Act (PCMLTFA), enforced by FINTRAC.","example":"","flagged":false,"kind":"term","related":["FINTRAC","Know your customer (KYC)","Beneficial ownership"],"summary":"Laws and controls that stop criminals from disguising illegal money as legitimate, for example through property purchases.","tags":["aml"],"title":"Anti-money laundering (AML)","updatedAt":1790983894324,"id":"anti-money-laundering-aml"},{"category":"linux","createdAt":1792173300000,"detail":"- **RPM through dnf:** first choice when Fedora has it. Signed, and it updates with the system.\n- **Flatpak:** a good second choice. Sandboxed, large catalogue, one command updates everything.\n- **AppImage:** best when the developer only offers that. One file, easy to try and remove. Updates are on you and there is no sandbox.\n- **Tarball or building from source:** last resort.\n\nThe security angle: every app you install outside the distro's repositories is a vendor you are trusting. Prefer sources that sign their releases, and keep a list of what you installed by hand.","example":"","flagged":false,"kind":"note","related":["dnf and RPM","Flatpak","AppImage","Third-Party Risk Management (TPRM)"],"summary":"Which packaging to pick when an app offers more than one.","tags":["packages","comparison","linux"],"title":"AppImage, Flatpak or RPM","updatedAt":1792173299987,"id":"appimage-flatpak-or-rpm"},{"category":"linux","createdAt":1792173300000,"detail":"**FUSE error** (\"AppImages require FUSE to run\" or \"error loading libfuse.so.2\"). Install FUSE 2 support:\n\n```\nsudo dnf install fuse fuse-libs\n```\n\n**No FUSE, or you would rather not install it.** Run in extract mode, or unpack once and run the unpacked copy:\n\n```\n./MyApp-x86_64.AppImage --appimage-extract-and-run\n./MyApp-x86_64.AppImage --appimage-extract\n./squashfs-root/AppRun\n```\n\n- \"Permission denied\": you skipped `chmod +x`, or the file is on a drive mounted `noexec`. Move it into your home folder.\n- \"Exec format error\": wrong CPU build. Compare `uname -m` with the file name.\n- Closes with no message: start it from a terminal to see the error. Missing libraries are the usual cause.\n- Electron apps that complain about the \"SUID sandbox helper\": adding `--no-sandbox` works around it, but it switches off a protection, so do it only for apps you trust.\n- Still blocked with normal permissions correct: SELinux may be denying it. Look for recent denials with `sudo ausearch -m avc -ts recent`. Do not turn SELinux off to fix this.","example":"","flagged":false,"kind":"note","related":["FUSE","Running an AppImage on Fedora","SELinux","Disk and storage commands"],"summary":"Fixes for the usual reasons an AppImage will not start on Fedora.","tags":["appimage","troubleshooting","linux"],"title":"AppImage troubleshooting","updatedAt":1792173299989,"id":"appimage-troubleshooting"},{"category":"linux","createdAt":1792173300000,"detail":"- Nothing is installed system-wide and no root access is needed. Delete the file to remove the app.\n- It must match your CPU: x86_64 for most PCs, aarch64 for ARM. Check with `uname -m`.\n- It does not update through dnf. Check for new releases yourself unless the app has its own updater.\n- It runs with all your user permissions, because there is no sandbox by default.","example":"A download named something like MyApp-1.4.2-x86_64.AppImage.","flagged":false,"kind":"term","related":["Running an AppImage on Fedora","AppImage troubleshooting","FUSE","Verifying a download","AppImage, Flatpak or RPM"],"summary":"A single downloadable file that contains an app and what it needs to run on most Linux distributions. You make it executable and run it, with no install step.","tags":["packages","appimage","linux"],"title":"AppImage","updatedAt":1792173299992,"id":"appimage"},{"category":"military","createdAt":1792182600000,"detail":"- Researchers give groups names or numbers, such as APT29.\n- Typical targets: governments, defence suppliers, critical infrastructure and financial firms. Goals are espionage, disruption or theft.\n- Most companies are more likely to face criminals such as ransomware gangs, but threat reports use the term constantly.","example":"","flagged":false,"kind":"term","related":["TTPs","Ransomware","MITRE ATT&CK"],"summary":"Advanced persistent threat: a well-resourced attacker, often linked to a state, that stays inside a network for a long time.","tags":["cyber","threats","military"],"title":"APT","updatedAt":1792182599991,"id":"apt"},{"category":"linux","createdAt":1792173300000,"detail":"```\ntar -xf file.tar.gz              # extract (works for most tar formats)\ntar -czf backup.tar.gz folder/   # create\nunzip file.zip\nzip -r archive.zip folder/\n```","example":"","flagged":false,"kind":"note","related":["Terminal and shell"],"summary":"Pack and unpack the common archive formats.","tags":["commands","linux"],"title":"Archives (tar and zip)","updatedAt":1792173299972,"id":"archives-tar-and-zip"},{"category":"military","createdAt":1792182600000,"detail":"- Granted after an assessment, usually with conditions and an expiry date.\n- Equivalent to a risk acceptance sign-off, or a go-live approval in a commercial company.","example":"","flagged":false,"kind":"term","related":["RMF","Residual risk","POA&M","Accept (risk response)"],"summary":"Authority to operate: a formal decision by a senior official to accept the remaining risk and let a system run.","tags":["frameworks","us","military"],"title":"ATO","updatedAt":1792182599952,"id":"ato"},{"category":"audit","createdAt":1790983894413,"detail":"- Internal audit: the company's own team, finding problems before outsiders do\n- External audit: an independent firm; produces SOC 2 reports and ISO certifications","example":"","flagged":false,"kind":"term","related":["Internal audit","Evidence","Sampling"],"summary":"An independent check of whether a company does what it claims.","tags":["lesson-6"],"title":"Audit","updatedAt":1790983894369,"id":"audit"},{"category":"risk","createdAt":1790983894413,"detail":"Only realistic when the activity is optional. You can't avoid a data breach entirely if your business needs customer data.","example":"A startup with no security team decides not to collect health records yet.","flagged":false,"kind":"term","related":["Data minimization"],"summary":"Stop doing the activity that creates the risk.","tags":["lesson-2","risk-response"],"title":"Avoid (risk response)","updatedAt":1790983894399,"id":"avoid-risk-response"},{"category":"security","createdAt":1790983894413,"detail":"","example":"","flagged":false,"kind":"term","related":["Corrective control","RTO and RPO"],"summary":"Copying data so it can be restored after loss. A backup only counts if restores are tested.","tags":["resilience"],"title":"Backup and recovery","updatedAt":1790983894336,"id":"backup-and-recovery"},{"category":"refintech","createdAt":1790983894413,"detail":"Hidden ownership through numbered companies is a known money-laundering pattern in real estate.","example":"","flagged":false,"kind":"term","related":["Anti-money laundering (AML)"],"summary":"Identifying the real people who ultimately own or control a company or trust, not just the name on paper.","tags":["aml"],"title":"Beneficial ownership","updatedAt":1790983894322,"id":"beneficial-ownershi
