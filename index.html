o.","tags":["process","exercises","military"],"title":"ROE","updatedAt":1792182599979,"id":"roe"},{"category":"security","createdAt":1790983894413,"detail":"","example":"Every \"Agent\" role can see listings; only \"Broker of record\" can approve trust withdrawals.","flagged":false,"kind":"term","related":["Least privilege"],"summary":"Granting access by job role instead of person by person.","tags":["access"],"title":"Role-based access control (RBAC)","updatedAt":1790983894345,"id":"role-based-access-control-rbac"},{"category":"security","createdAt":1790983894413,"detail":"","example":"RTO 4 hours, RPO 15 minutes: the system is back within 4 hours, losing at most the last 15 minutes of data.","flagged":false,"kind":"term","related":["Business continuity and disaster recovery (BCP/DR)"],"summary":"Recovery Time Objective: how fast a system must be back. Recovery Point Objective: how much data loss, measured in time, is acceptable.","tags":["resilience"],"title":"RTO and RPO","updatedAt":1790983894335,"id":"rto-and-rpo"},{"category":"linux","createdAt":1792173300000,"detail":"1. Download the build that matches your CPU. Check yours:\n\n```\nuname -m\n```\n\n2. Put it somewhere permanent, make it executable, and run it from the terminal the first time so you can see any error messages:\n\n```\nmkdir -p ~/Applications\nmv ~/Downloads/MyApp-x86_64.AppImage ~/Applications/\ncd ~/Applications\nchmod +x MyApp-x86_64.AppImage\n./MyApp-x86_64.AppImage\n```\n\n3. Once it works, double-click it in the file manager. If nothing happens, open the file's Properties, go to Permissions, and allow it to run as a program.\n\nIf you see \"AppImages require FUSE to run\" or \"Permission denied\", see AppImage troubleshooting. To get an app menu entry, see Adding an AppImage to the app menu.","example":"","flagged":false,"kind":"note","related":["AppImage","AppImage troubleshooting","Adding an AppImage to the app menu","File permissions (chmod)","Verifying a download"],"summary":"Step by step: download the right build, make it executable, and run it.","tags":["appimage","how-to","linux"],"title":"Running an AppImage on Fedora","updatedAt":1792173299990,"id":"running-an-appimage-on-fedora"},{"category":"audit","createdAt":1790983894413,"detail":"","example":"200 people left this year; the auditor checks 25 to confirm access was removed on time.","flagged":false,"kind":"term","related":["Evidence","Deficiency"],"summary":"Auditors test a selection of items instead of everything, then judge the whole population from the results.","tags":["lesson-6"],"title":"Sampling","updatedAt":1790983894366,"id":"sampling"},{"category":"linux","createdAt":1792173300000,"detail":"```\ncrontab -e                          # edit your schedule\ncrontab -l                          # list it\n# minute hour day month weekday command\n30 2 * * 1 /home/yourname/backup.sh     # Mondays at 2:30\nsystemctl list-timers               # systemd timers\n```\n\nForgotten scheduled jobs are a classic place for risk. Reviewers look at them.","example":"","flagged":false,"kind":"note","related":["systemd and systemctl","Backup and recovery"],"summary":"Ways to run a task automatically on a schedule.","tags":["system","linux"],"title":"Scheduled jobs (cron and systemd timers)","updatedAt":1792173299971,"id":"scheduled-jobs-cron-and-systemd-timers"},{"category":"military","createdAt":1792182600000,"detail":"A physical control with strict access, no personal devices and shielding against listening.","example":"","flagged":false,"kind":"term","related":["Physical control","Air gap and classified networks","Classification levels"],"summary":"Sensitive compartmented information facility: an accredited secure room built to protect classified discussions and systems.","tags":["classification","physical","military"],"title":"SCIF","updatedAt":1792182599965,"id":"scif"},{"category":"linux","createdAt":1792173300000,"detail":"```\ngrep -rni \"password\" ~/notes       # search text in files\ngrep -c error file.log             # count matching lines\nfind ~ -name \"*.AppImage\"          # find files by name\nfind /var/log -mtime -1            # changed in the last day\nwc -l file                         # count lines\nnano file                          # simple editor (Ctrl+O save, Ctrl+X exit)\n```\n\nIf you land in vim by accident, press Esc, type `:q!` and press Enter to leave without saving.","example":"","flagged":false,"kind":"note","related":["Pipes and redirects","Terminal and shell"],"summary":"Find text inside files, find files by name, and edit a file from the terminal.","tags":["commands","linux"],"title":"Search and text tools (grep and find)","updatedAt":1792173299975,"id":"search-and-text-tools-grep-and-find"},{"category":"thirdparty","createdAt":1790983894413,"detail":"Common templates: SIG (Shared Assessments) and CAIQ (Cloud Security Alliance).","example":"","flagged":false,"kind":"term","related":["Third-Party Risk Management (TPRM)"],"summary":"A standard list of security questions a vendor fills out, often used when they don't have a SOC 2 report.","tags":["lesson-7"],"title":"Security questionnaire","updatedAt":1790983894355,"id":"security-questionnaire"},{"category":"foundations","createdAt":1790983894413,"detail":"Also called separation of duties (SoD). Common in finance and in IT change management: the person who writes code should not be the only one who approves and deploys it.","example":"One employee creates a vendor payment; a second must approve it before money moves.","flagged":false,"kind":"term","related":["Least privilege","Change management","Preventive control"],"summary":"Splitting a sensitive task so no single person can complete it alone, which prevents fraud and catches mistakes.","tags":["controls","fraud"],"title":"Segregation of duties","updatedAt":1790983894407,"id":"segregation-of-duties"},{"category":"linux","createdAt":1792173300000,"detail":"```\ngetenforce                         # Enforcing, Permissive or Disabled\nsestatus                           # more detail\nls -Z file                         # a file's security label\nsudo ausearch -m avc -ts recent    # recent denials\nsudo restorecon -Rv /path          # reset labels to default\n```\n\n- Enforcing blocks. Permissive only logs. Disabled is off.\n- A mysterious \"permission denied\" can be SELinux even when normal permissions look right.\n- `sudo setenforce 0` switches to permissive until the next reboot. It is fine for testing and wrong as a permanent fix.\n\nThis is defense in depth: even a compromised program stays boxed in. Auditors check that it is enforcing.","example":"","flagged":false,"kind":"term","related":["Defense in depth","Preventive control","AppImage troubleshooting","Fedora"],"summary":"A Linux security layer that limits what each program can do, even when it runs as a powerful user. Fedora and the Red Hat family turn it on by default.","tags":["security","fedora","linux"],"title":"SELinux","updatedAt":1792173299979,"id":"selinux"},{"category":"security","createdAt":1790983894413,"detail":"Most cloud breaches come from customer-side mistakes such as misconfigured storage or weak access.","example":"","flagged":false,"kind":"term","related":["Transfer (risk response)"],"summary":"In cloud computing, the provider secures the infrastructure and the customer secures how they configure and use it.","tags":["cloud"],"title":"Shared responsibility model","updatedAt":1790983894333,"id":"shared-responsibility-model"},{"category":"security","createdAt":1790983894413,"detail":"","example":"Microsoft Sentinel, Splunk.","flagged":false,"kind":"term","related":["Detective control","Logging and monitoring"],"summary":"Security Information and Event Management: a system that collects logs from across the company and raises alerts on suspicious activity.","tags":["operations"],"title":"SIEM","updatedAt":1790983894338,"id":"siem"},{"category":"security","createdAt":1790983894413,"detail":"","example":"Okta, Microsoft Entra ID, Google Workspace.","flagged":false,"kind":"term","related":["Identity and access management (IAM)"],"summary":"One login that gives access to many apps. It makes MFA and offboarding easier because there's one account to protect or disable.","tags":["access"],"title":"Single sign-on (SSO)","updatedAt":1790983894346,"id":"single-sign-on-sso"},{"category":"military","createdAt":1792182600000,"detail":"In an incident, send SITREPs on a fixed rhythm, such as every 30 minutes. Include what you know, what you don't know yet, the actions under way and the time of the next update.","example":"","flagged":false,"kind":"term","related":["Incident Response Plan (IRP)","BLUF","COP"],"summary":"Situation report: a short status update on what is happening, what has been done and what comes next.","tags":["communication","incident","military"],"title":"SITREP","updatedAt":1792182599982,"id":"sitrep"},{"category":"frameworks","createdAt":1790983894413,"detail":"","example":"\"Do your controls actually work, or do they just look good on paper?\" Only Type II answers that.","flagged":false,"kind":"term","related":["SOC 2","Operating effectiveness"],"summary":"Type I checks control design at a single date. Type II checks that controls actually operated over a period of months.","tags":["lesson-5"],"title":"SOC 2 Type I vs Type II","updatedAt":1790983894374,"id":"soc-2-type-i-vs-type-ii"},{"category":"frameworks","createdAt":1790983894413,"detail":"Covers up to five Trust Services Criteria: Security (always required), Availability, Processing Integrity, Confidentiality, Privacy.\n\n- Type I: are controls designed properly at one point in time?\n- Type II: did controls actually work over a period, usually 3–12 months? More valuable.","example":"A large US bank asks a Canadian startup for its SOC 2 Type II before signing.","flagged":false,"kind":"term","related":["SOC 2 Type I vs Type II","Bridge letter","ISO 27001"],"summary":"An audit report, created under AICPA rules, showing a company protects customer data. The standard expectation for B2B software in North America.","tags":["lesson-5","audit"],"title":"SOC 2","updatedAt":1790983894375,"id":"soc-2"},{"category":"military","createdAt":1792182600000,"detail":"- The same thing as a procedure in the policy, standard and procedure hierarchy.\n- Good SOPs are tested with the people who use them.\n- Auditors ask for the SOP and then for evidence that people follow it.","example":"","flagged":false,"kind":"term","related":["Policy, standard, procedure","Administrative control","Evidence"],"summary":"Standard operating procedure: written, repeatable instructions for a routine task.","tags":["process","military"],"title":"SOP","updatedAt":1792182599980,"id":"sop"},{"category":"linux","createdAt":1792173300000,"detail":"```\nssh user@server.example.com\nssh-keygen -t ed25519 -C \"laptop\"\nssh-copy-id user@server.example.com\n```\n\n- The private key stays on your machine (`~/.ssh/id_ed25519`, permissions 600). The public key, the `.pub` file, goes on the server in `~/.ssh/authorized_keys`.\n- Never share the private key, and protect it with a passphrase.\n- Server settings are in `/etc/ssh/sshd_config`. Hardened servers set `PermitRootLogin no` and `PasswordAuthentication no`.\n\nOffboarding must include removing the person's keys, just like removing their accounts.","example":"","flagged":false,"kind":"term","related":["File permissions (chmod)","Multi-factor authentication (MFA)","Identity and access management (IAM)"],"summary":"SSH is the encrypted way to log in to and run commands on another computer. Key pairs can replace passwords.","tags":["network","access","linux"],"title":"SSH and keys","updatedAt":1792173299980,"id":"ssh-and-keys"},{"category":"military","createdAt":1792182600000,"detail":"- The CIS Benchmarks are the commercial equivalent.\n- A Red Hat Enterprise Linux STIG exists, and Fedora is closely related.\n- OpenSCAP can scan a Linux machine against hardening profiles like these.","example":"","flagged":false,"kind":"term","related":["DISA","Vulnerability management","Linux in an audit","SELinux"],"summary":"Security Technical Implementation Guide: detailed configuration hardening checklists published by DISA for operating systems, databases, browsers and more.","tags":["frameworks","hardening","military"],"title":"STIG","updatedAt":1792182599950,"id":"stig"},{"category":"linux","createdAt":1792173300000,"detail":"- On Fedora, members of the `wheel` group can use sudo.\n- Accounts are listed in `/etc/passwd`. Password hashes are in `/etc/shadow`, which only root can read.\n\n```\nwhoami\nid                           # your user and groups\nsudo dnf upgrade             # run one command as root\nsudo usermod -aG wheel newuser   # give a user sudo rights\nsudo visudo                  # safely edit sudo rules\nsudo -l                      # list what you may run with sudo\n```\n\nUse sudo only when a command needs it. A downloaded script run with sudo has full control of the machine.\n\nWho has sudo is one of the first things an access review asks about.","example":"","flagged":false,"kind":"term","related":["Least privilege","Access review","Hashing","Identity and access management (IAM)"],"summary":"root is the all-powerful administrator account. sudo lets an allowed user run one command with root's power.","tags":["basics","security","access","linux"],"title":"sudo and root","updatedAt":1792173299995,"id":"sudo-and-root"},{"category":"linux","createdAt":1792173300000,"detail":"```\nsystemctl status sshd\nsudo systemctl start sshd\nsudo systemctl stop sshd\nsudo systemctl enable --now sshd    # start now and at every boot\nsystemctl --failed                  # what is broken?\nsystemctl list-timers               # scheduled jobs\n```\n\n- Service definitions are \"unit files\" under `/etc/systemd/system` and `/usr/lib/systemd/system`.\n- Add `--user` to manage your own services without root.","example":"","flagged":false,"kind":"term","related":["Logs with journalctl","Scheduled jobs (cron and systemd timers)","Processes and resource use"],"summary":"systemd starts and manages background services on most Linux distributions. systemctl is the command that controls it.","tags":["system","linux"],"title":"systemd and systemctl","updatedAt":1792173299984,"id":"systemd-and-systemctl"},{"category":"incident","createdAt":1790983894413,"detail":"","example":"The team discovers nobody has authority to take the website offline, a gap to fix in the Prepare stage.","flagged":false,"kind":"term","related":["Incident Response Plan (IRP)"],"summary":"A practice session where the team talks through a fake incident to test the response plan.","tags":["lesson-8"],"title":"Tabletop exercise","updatedAt":1790983894350,"id":"tabletop-exercise"},{"category":"controls","createdAt":1790983894413,"detail":"","example":"Encryption, firewalls, automatic screen lock after 5 minutes.","flagged":false,"kind":"term","related":["Administrative control","Physical control"],"summary":"A control built into technology.","tags":["lesson-3"],"title":"Technical control","updatedAt":1790983894391,"id":"technical-control"},{"category":"refintech","createdAt":1790983894413,"detail":"Compliance angles:\n- Express consent for credit checks\n- Collect only what's needed (data minimization)\n- Ontario's Human Rights Code bans discrimination in housing on protected grounds\n- Automated scoring raises AI bias risk","example":"","flagged":false,"kind":"term","related":["Consent","AI bias","Data minimization"],"summary":"Checking rental applicants' identity, income, credit and references. A core feature of tenant-placement platforms.","tags":["rental","ontario"],"title":"Tenant screening","updatedAt":1790983894317,"id":"tenant-screening"},{"category":"linux","createdAt":1792173300000,"detail":"```\npwd                  # where am I?\nls -la               # list files, including hidden ones\ncd ~/Downloads       # change folder (~ is your home folder)\ncd ..                # go up one folder\nmkdir -p notes/grc   # make folders\ncp file copy         # copy\nmv file newname      # move or rename\nrm file              # delete (there is no recycle bin)\ncat file             # print a file\nless file            # page through a file (q to quit)\nman ls               # manual for a command\n```\n\n- Tab completes names. Up arrow recalls earlier commands. Ctrl+C stops a running command. Ctrl+R searches your history.\n- `rm -r` deletes folders and `rm -rf` skips every warning. Check the path before you press Enter.\n- Most commands also accept `--help` for a short summary.","example":"","flagged":false,"kind":"term","related":["Linux filesystem layout","Pipes and redirects","File permissions (chmod)"],"summary":"The terminal is the window where you type commands. The shell, usually bash, is the program that reads and runs them.","tags":["basics","commands","linux"],"title":"Terminal and shell","updatedAt":1792173299998,"id":"terminal-and-shell"},{"category":"thirdparty","createdAt":1790983894413,"detail":"- Due diligence: tier the vendor, review SOC 2 / ISO / questionnaire\n- Contract: security terms, breach notice timeline, right to audit, DPA\n- Monitor: yearly reviews for high-risk vendors\n- Offboard: data returned or deleted, access removed","example":"","flagged":false,"kind":"term","related":["Vendor tiering","Data Processing Agreement (DPA)","Fourth party","OSFI B-10"],"summary":"Managing the risks that come from vendors and partners across the relationship: before signing, in the contract, during, and at exit.","tags":["lesson-7"],"title":"Third-Party Risk Management (TPRM)","updatedAt":1790983894357,"id":"third-party-risk-management-tprm"},{"category":"foundations","createdAt":1790983894413,"detail":"- First line: operations and product teams who run the controls\n- Second line: risk management, compliance, security governance who set frameworks and challenge the first line\n- Third line: internal audit, independent, reporting to the board's audit committee\n\nPublished by the Institute of Internal Auditors (IIA). Interviewers like asking where a GRC role sits.","example":"","flagged":false,"kind":"term","related":["Internal audit","GRC"],"summary":"A way to divide risk responsibilities: the business owns and manages risk, risk and compliance teams oversee it, and internal audit independently checks both.","tags":["governance","interview"],"title":"Three lines model","updatedAt":1790983894408,"id":"three-lines-model"},{"category":"refintech","createdAt":1790983894413,"detail":"Risk factors include properties that are mortgage-free or owner-absent. Controls: strong ID verification, title insurance, alerts on title changes.","example":"","flagged":false,"kind":"term","related":["Know your customer (KYC)","Transfer (risk response)"],"summary":"Fraud where criminals impersonate an owner to sell or mortgage a property they don't own.","tags":["fraud"],"title":"Title fraud","updatedAt":1790983894318,"id":"title-fraud"},{"category":"military","createdAt":1792182600000,"detail":"- TLP:RED: named recipients only\n- TLP:AMBER+STRICT: your organization only\n- TLP:AMBER: your organization and clients who need it\n- TLP:GREEN: the wider community, but not public\n- TLP:CLEAR: no limit\n\nUsed in advisories from the CCCS, CISA and information-sharing groups. Respect the label when forwarding.","example":"","flagged":false,"kind":"term","related":["CCCS","Classification levels","Need to know"],"summary":"Traffic Light Protocol: colour labels that say how widely shared threat information may be passed on.","tags":["intelligence","sharing","military"],"title":"TLP","updatedAt":1792182599963,"id":"tlp"},{"category":"security","createdAt":1790983894413,"detail":"","example":"","flagged":false,"kind":"term","related":["PCI DSS"],"summary":"Replacing sensitive data like a card number with a meaningless token, so the real value is stored only by a secure provider.","tags":["payments"],"title":"Tokenization","updatedAt":1790983894341,"id":"tokenization"},{"category":"risk","createdAt":1790983894413,"detail":"Key rule: you can transfer the work, but not the responsibility. If a vendor leaks your customers' data, regulators and customers still hold you accountable.","example":"Cyber insurance; using Stripe so card numbers never touch your servers.","flagged":false,"kind":"term","related":["Cyber insurance","Third-Party Risk Management (TPRM)","You can transfer the work, not the responsibility"],"summary":"Shift some of a risk to another party, usually through insurance or outsourcing.","tags":["lesson-2","risk-response"],"title":"Transfer (risk response)","updatedAt":1790983894400,"id":"transfer-risk-response"},{"category":"refintech","createdAt":1790983894413,"detail":"Its code of ethics covers duties to clients, disclosure and record keeping. Rules on trust accounts for deposits matter for any fintech touching client funds.","example":"","flagged":false,"kind":"term","related":["Trust account","FINTRAC"],"summary":"Ontario's Trust in Real Estate Services Act, 2002 (TRESA) governs registered real estate professionals; the Real Estate Council of Ontario (RECO) administers it.","tags":["ontario","regulation"],"title":"TRESA and RECO","updatedAt":1790983894321,"id":"tresa-and-reco"},{"category":"refintech","createdAt":1790983894413,"detail":"High-risk area: fraud, errors and reconciliation failures carry regulatory consequences. Expect strong segregation of duties and reconciliation controls.","example":"","flagged":false,"kind":"term","related":["TRESA and RECO","Segregation of duties"],"summary":"A separate account holding client money, such as deposits, that the brokerage must protect and can't mix with its own funds.","tags":["financial"],"title":"Trust account","updatedAt":1790983894320,"id":"trust-account"},{"category":"military","createdAt":1792182600000,"detail":"- Tactic: the goal, such as stealing credentials.\n- Technique: the general method, such as phishing.\n- Procedure: the exact steps a specific group uses.\n\nThreat reports list TTPs so defenders can build detections around behaviour, which is harder for an attacker to change than a single indicator like an IP address.","example":"","flagged":false,"kind":"term","related":["MITRE ATT&CK","APT","Kill chain"],"summary":"Tactics, techniques and procedures: how a particular attacker operates.","tags":["cyber","threats","military"],"title":"TTPs","updatedAt":1792182599993,"id":"ttps"},{"category":"military","createdAt":1792182600000,"detail":"- Used for nuclear weapons and for handling COMSEC keys.\n- It is the same idea as segregation of duties and dual control: large payments, key ceremonies and production changes.","example":"","flagged":false,"kind":"term","related":["Segregation of duties","COMSEC","Trust account"],"summary":"A rule that two authorized people must be present or approve for a sensitive action.","tags":["controls","military"],"title":"Two-person integrity","updatedAt":1792182599968,"id":"two-person-integrity"},{"category":"frameworks","createdAt":1790983894413,"detail":"Frameworks overlap heavily (MFA, encryption, access reviews, training appear in nearly all). GRC tools help maintain the mapping.","example":"One access-review control satisfies SOC 2 CC6, ISO 27001 Annex A access controls and PCI DSS Requirement 7.","flagged":false,"kind":"term","related":["SOC 2","ISO 27001","GRC tools"],"summary":"One set of internal controls mapped to several frameworks at once, so you test once and satisfy many requirements.","tags":["lesson-5","efficiency"],"title":"Unified control framework","updatedAt":1790983894370,"id":"unified-control-framework"},{"category":"thirdparty","createdAt":1790983894413,"detail":"Drivers: what data they access, how critical they are to operations, and whether they connect to your systems.","example":"A vendor storing customer records is high risk; an office snack supplier is low.","flagged":false,"kind":"term","related":["Third-Party Risk Management (TPRM)"],"summary":"Classifying vendors by risk so high-risk ones get deeper review.","tags":["lesson-7"],"title":"Vendor tiering","updatedAt":1790983894356,"id":"vendor-tiering"},{"category":"linux","createdAt":1792173300000,"detail":"```\nsha256sum MyApp-x86_64.AppImage\n```\n\nCompare the output with the checksum on the project's release page. If a signature file is published, check it too:\n\n```\ngpg --verify MyApp.AppImage.sig MyApp.AppImage\n```\n\nA mismatch means a corrupted download or a tampered file. Do not run it.\n\nThis is a small version of software supply chain risk, the same idea as reviewing a vendor before you rely on them.","example":"","flagged":false,"kind":"note","related":["Third-Party Risk Management (TPRM)","Hashing","AppImage"],"summary":"Checking that a file is exactly what the publisher released before you run it.","tags":["security","how-to","linux"],"title":"Verifying a download","updatedAt":1792173299985,"id":"verifying-a-download"},{"category":"security","createdAt":1790983894413,"detail":"Tracks patching deadlines by severity, for example critical within 15–30 days. Overdue criticals are a common KRI.","example":"","flagged":false,"kind":"term","related":["Key risk indicator (KRI)"],"summary":"Continuously finding, ranking and fixing security weaknesses in systems.","tags":["operations"],"title":"Vulnerability management","updatedAt":1790983894340,"id":"vulnerability-management"},{"category":"military","createdAt":1792182600000,"detail":"- Ideas borrowed from the military: defense in depth, the kill chain, red teams, OPSEC, after-action reviews, tabletop exercises and a clear chain of command during incidents.\n- Government and defence frameworks became the base for many commercial ones. NIST SP 800-53 feeds the RMF, FedRAMP and Canada's ITSG-33, and the NIST Cybersecurity Framework grew out of a US effort on critical infrastructure.\n- Banks and large enterprise customers often hand vendors government-style requirements, so this language shows up in security questionnaires, audit meetings and threat reports.\n- Agency threat reports (CCCS, CISA, NSA) use terms like TTPs and APT without explaining them.","example":"","flagged":false,"kind":"note","related":["Defense in depth","Kill chain","Red, blue and purple teams","RMF","NIST SP 800-53"],"summary":"Cyberspace is treated as an operating domain alongside land, sea, air and space, so a lot of security vocabulary and structure comes from defence.","tags":["overview","military"],"title":"Why military and cyber overlap","updatedAt":1792182600000,"id":"why-military-and-cyber-overlap"},{"category":"career","createdAt":1790983894413,"detail":"- FINTRAC client ID verification and record keeping = KYC and evidence\n- Brokerage file reviews = audit and sampling\n- Handling client IDs, pre-approvals and addresses = PIPEDA in practice\n- Knowing wire fraud and title fraud from the front line = risk identification\n- Explaining complex rules to clients = the communication GRC roles need","example":"","flagged":false,"kind":"note","related":["FINTRAC","Real estate wire fraud","GRC roles"],"summary":"Talking points for interviews: I already work under AML, privacy and regulatory rules every day.","tags":["interview"],"title":"Why my real estate background helps","updatedAt":1790983894310,"id":"why-my-real-estate-background-helps"},{"category":"linux","createdAt":1792173300000,"detail":"- Ask the developer for a Linux build or an AppImage, or build from source if the code is available.\n- Run it through Wine. Bottles, available as a Flatpak, makes Wine easier to manage. Steam's Proton does the same for games.\n- Treat an unknown .exe as untrusted. Wine is not a security sandbox.","example":"","flagged":false,"kind":"note","related":["Flatpak","AppImage"],"summary":"A Windows .exe will not run natively on Linux. You have a few options.","tags":["packages","troubleshooting","linux"],"title":"Windows .exe files on Linux","updatedAt":1792173299986,"id":"windows-exe-files-on-linux"},{"category":"risk","createdAt":1790983894413,"detail":"Came up in Lesson 2 (health records startup) and Lesson 7 (vendor breaches). Interviewers like this line.","example":"","flagged":false,"kind":"note","related":["Transfer (risk response)","Third-Party Risk Management (TPRM)"],"summary":"Outsourcing or insuring a risk doesn't move accountability. Customers and regulators still hold you responsible.","tags":["key-idea"],"title":"You can transfer the work, not the responsibility","updatedAt":1790983894312,"id":"you-can-transfer-the-work-not-the-responsibility"},{"category":"military","createdAt":1792182600000,"detail":"- Described in NIST SP 800-207. The DoD's zero trust strategy sets a target of 2027.\n- Built from: strong identity and MFA, least privilege, network segmentation and continuous verification.\n- It replaced the \"castle and moat\" idea that everything inside the network is safe.","example":"","flagged":false,"kind":"term","related":["Multi-factor authentication (MFA)","Least privilege","Identity and access management (IAM)","Defense in depth"],"summary":"A security model that trusts nothing by default. Every user, device and request is verified, whether inside or outside the network.","tags":["cyber","architecture","military"],"title":"Zero trust","updatedAt":1792182599983,"id":"zero-trust"},{"category":"military","createdAt":1792182600000,"detail":"- Format: day, hour, minute, Z, month, year.\n- Use UTC for logs and incident timelines to avoid confusion across time zones. On Linux, `timedatectl` and `date -u` show it.","example":"151630Z OCT 26 is 15 October 2026, 16:30 UTC, which is 12:30 in Toronto during daylight time.","flagged":false,"kind":"term","related":["Logging and monitoring","Logs with journalctl","Linux in an audit"],"summary":"Zulu (Z) means UTC. A date-time group (DTG) writes day, time and zone as one string.","tags":["logs","military"],"title":"Zulu time and DTG","updatedAt":1792182599970,"id":"zulu-time-and-dtg"},{"id":"compliance-officer-role","title":"Compliance Officer (role)","kind":"note","category":"cofficer","summary":"The person who makes sure the company follows the laws, regulations and its own policies, and can prove it.","detail":"**What the job is**\n- Translate rules into policies, procedures and controls people can actually follow.\n- Monitor and test that the controls work, and log what you find.\n- Train staff, advise the business, and report to senior management and the board.\n- Be the contact for regulators such as FINTRAC and FSRA.\n\n**Typical rhythm**\n- Daily: review alerts and escalations, answer questions from the business, approve marketing and new-customer exceptions.\n- Weekly: issues log, sanctions or screening hits, regulatory news.\n- Monthly: monitoring results, training completion, complaints.\n- Quarterly: report to management or the board, update the risk assessment inputs.\n- Annually: policy review, risk assessment, training plan, program review.\n\n**Skills that matter**\n- Reading a regulation and turning it into a checklist.\n- Clear writing, since policies and reports are the work product.\n- Judgement and nerve: being able to say no, or escalate, politely.\n- Evidence habits: if it is not written down, it did not happen.","example":"","related":["Compliance","GRC roles","Three lines model","Compliance vs legal vs risk"],"tags":["role","start-here"],"links":[],"flagged":false,"createdAt":1793043845322,"updatedAt":1793043845322},{"id":"compliance-vs-legal-vs-risk","title":"Compliance vs legal vs risk","kind":"note","category":"cofficer","summary":"Three neighbouring functions that people mix up. Knowing the line between them is a common interview question.","detail":"- **Legal** interprets the law and protects the company's legal position. It gives advice and handles disputes and contracts.\n- **Compliance** turns obligations into day-to-day controls, monitors them, trains people and reports on adherence. It is part of the second line.\n- **Risk** looks at all kinds of risk (not only rule-breaking), measures it and sets limits with the business.\n- **Internal audit** is the third line. It checks independently that the other two are working.\n\nIn a small fintech these roles are often blended. Say which hat you are wearing when you give an opinion.","example":"Legal: \"Does this clause breach the Act?\" Compliance: \"Do we have a control that stops it happening, and can we show it ran?\"","related":["Three lines model","Compliance Officer (role)"],"tags":["role","governance"],"links":[],"flagged":false,"createdAt":1793043845323,"updatedAt":1793043845323},{"id":"compliance-monitoring-and-testing","title":"Compliance monitoring and testing","kind":"term","category":"cofficer","summary":"Regularly checking that controls are operating as designed, and recording the results.","detail":"- **Monitoring** is ongoing and lighter touch (dashboards, samples, alerts).\n- **Testing** is periodic and more formal: pick a sample, check it against the requirement, record pass or fail and why.\n- Build a **monitoring plan**: control, frequency, sample size, owner, evidence kept.\n- Fails go to the issues log with an owner and a due date.\n- Be able to show regulators the plan and the results, not only the policy.","example":"Quarterly test: pull 25 new accounts and confirm ID was verified and the risk rating was recorded before the account was activated.","related":["Issues log and corrective action","Compliance calendar","Evidence"],"tags":["monitoring","process"],"links":[],"flagged":false,"createdAt":1793043845324,"updatedAt":1793043845324},{"id":"compliance-calendar","title":"Compliance calendar","kind":"term","category":"cofficer","summary":"A schedule of every recurring compliance task, deadline and report so nothing is missed.","detail":"- List each obligation, its owner, due date and the evidence to keep.\n- Examples: annual risk assessment, training plan, policy reviews, two-year effectiveness review, licence renewals, vendor reviews, regulatory filings.\n- Review it monthly. Missed deadlines are one of the easiest findings for a regulator to make.","example":"","related":["Compliance monitoring and testing","Regulatory examination readiness"],"tags":["process","planning"],"links":[],"flagged":false,"createdAt":1793043845325,"updatedAt":1793043845325},{"id":"compliance-risk-assessment","title":"Compliance risk assessment","kind":"term","category":"cofficer","summary":"A structured look at where the company could break rules, how likely and how bad, and which controls reduce it.","detail":"- Different from an AML risk assessment, but built the same way: identify obligations, rate inherent risk, rate control strength, derive residual risk.\n- Cover products, customers, channels, geography, vendors and new initiatives.\n- Refresh at least yearly and whenever something big changes (new product, new law, new market).\n- Feeds the monitoring plan: test the high-risk areas more often.","example":"","related":["Risk appetite","Risk-based approach (AML)","Compliance monitoring and testing"],"tags":["risk","process"],"links":[],"flagged":false,"createdAt":1793043845326,"updatedAt":1793043845326},{"id":"regulatory-change-management","title":"Regulatory change management","kind":"term","category":"cofficer","summary":"Tracking new or changed laws and guidance, working out what they mean for you, and updating controls by the effective date.","detail":"**Steps**\n1. Watch sources: FINTRAC, FSRA, OPC, Bank of Canada, Canada Gazette, industry bodies.\n2. Triage: does it apply to us?\n3. Gap analysis: what do we do now versus what is required?\n4. Assign owners and dates, update policy, procedures, systems and training.\n5. Record what you decided and why, even when the answer is \"does not apply\".\n\nKeep a regulatory change log. It is strong evidence in an exam.","example":"Penalty increases, a new reporting duty or an updated guidance page each get a log line and an owner.","related":["Compliance calendar","Bill C-12 and higher penalties"],"tags":["process","regulation"],"links":[],"flagged":false,"createdAt":1793043845327,"updatedAt":1793043845327},{"id":"policy-lifecycle","title":"Policy lifecycle","kind":"term","category":"cofficer","summary":"The path a policy follows: draft, approve, communicate, attest, monitor, review, retire.","detail":"- Every policy has an owner, an approver, a version and a review date.\n- Staff acknowledge it (attestation) so you can show they were told.\n- Review at least annually or after a change in law or process.\n- Keep old versions so you can show what applied on a given date.","example":"","related":["Policy, standard, procedure","Compliance training program"],"tags":["policy","process"],"links":[],"flagged":false,"createdAt":1793043845328,"updatedAt":1793043845328},{"id":"compliance-training-program","title":"Compliance training program","kind":"term","category":"cofficer","summary":"Planned, recorded training so staff know their obligations. It is also a required element of the AML program.","detail":"- Onboarding training for new hires, then annual refreshers.\n- Role-based content: front line spots red flags, engineers handle data properly, executives understand accountability.\n- Keep a written **training plan**, attendance records, content and test results.\n- Measure completion and follow up on late people. Track quiz results to find weak spots.","example":"","related":["Compliance program (PCMLTFA)","Policy lifecycle"],"tags":["training","process"],"links":[],"flagged":false,"createdAt":1793043845329,"updatedAt":1793043845329},{"id":"issues-log-and-corrective-action","title":"Issues log and corrective action","kind":"term","category":"cofficer","summary":"A running register of compliance problems, each with an owner, a fix and a due date.","detail":"- Record: what happened, how found, severity, root cause, owner, action, due date, status, evidence of closure.\n- Escalate overdue or high-severity items.\n- Look for patterns across items, since repeated issues point to a control that needs redesign.\n- If a real breach of a reporting law is found, consider whether and how to report it to the regulator (see voluntary self-declaration).","example":"","related":["Voluntary self-declaration of non-compliance","Compliance monitoring and testing"],"tags":["process","remediation"],"links":[],"flagged":false,"createdAt":1793043845330,"updatedAt":1793043845330},{"id":"regulatory-examination-readiness","title":"Regulatory examination readiness","kind":"term","category":"cofficer","summary":"Being able to hand a regulator the right documents quickly and explain them confidently.","detail":"**Keep ready**\n- Current policies and procedures, with approval dates.\n- Risk assessment and the methodology.\n- Training plan, records and materials.\n- Last effectiveness review and the action plan.\n- Samples of monitoring, reporting and client files.\n- Org chart showing who the compliance officer is and who they report to.\n\n**During the exam**\n- Single point of contact, log every request, give what is asked, do not guess. If unsure, say you will confirm and come back.","example":"FINTRAC typically sends a notice, asks for documents and may interview staff. Practise a mock exam internally.","related":["FINTRAC examination","Compliance program (PCMLTFA)"],"tags":["regulator","process"],"links":[],"flagged":false,"createdAt":1793043845331,"updatedAt":1793043845331},{"id":"reporting-to-the-board","title":"Reporting to the board","kind":"term","category":"cofficer","summary":"Regular, honest compliance reporting to senior management and directors.","detail":"- Show: key risks, test results, issues and ageing, regulatory changes, training status, complaints and incidents, reports filed.\n- Give a view, not only data: what worries you and what you need.\n- Direct access to the board or a committee, without going through the business, helps independence.\n- Keep minutes. They prove oversight happened.","example":"","related":["Compliance Officer (role)","Three lines model"],"tags":["governance","reporting"],"links":[],"flagged":false,"createdAt":1793043845332,"updatedAt":1793043845332},{"id":"code-of-conduct","title":"Code of conduct","kind":"term","category":"cofficer","summary":"A short document describing the behaviour the company expects: honesty, respect, legal compliance, and how to raise concerns.","detail":"- Staff attest to it at hire and every year.\n- Covers conflicts of interest, gifts, confidentiality, fair dealing and speaking up.\n- Breaches have defined consequences, applied consistently.","example":"","related":["Conflict of interest","Whistleblowing","Gifts and hospitality"],"tags":["ethics","policy"],"links":[],"flagged":false,"createdAt":1793043845333,"updatedAt":1793043845333},{"id":"conflict-of-interest","title":"Conflict of interest","kind":"term","category":"cofficer","summary":"A situation where a personal interest could, or could appear to, affect your work judgement.","detail":"- Staff disclose outside roles, investments and family ties relevant to the business or vendors.\n- Compliance reviews and decides: allow, allow with limits, or refuse.\n- In real estate, a classic one is a licensee or employee with a stake in a property or counterparty. Disclosure is normally required.\n- Keep the register current and reviewed.","example":"An employee on the vendor selection panel owns shares in a candidate vendor. Declare it and step back.","related":["Code of conduct","TRESA and RECO"],"tags":["ethics","process"],"links":[],"flagged":false,"createdAt":1793043845334,"updatedAt":1793043845334},{"id":"gifts-and-hospitality","title":"Gifts and hospitality","kind":"term","category":"cofficer","summary":"Rules on what gifts, meals and entertainment staff may give or accept, to avoid bribery or influence.","detail":"- Set a value limit and require pre-approval or logging above it.\n- Never accept anything in exchange for a decision.\n- Extra care with public officials. Canadian and foreign anti-corruption laws apply (Criminal Code, Corruption of Foreign Public Officials Act).\n- Keep a register.","example":"","related":["Code of conduct","Bribery and corruption"],"tags":["ethics","policy"],"links":[],"flagged":false,"createdAt":1793043845335,"updatedAt":1793043845335},{"id":"bribery-and-corruption","title":"Bribery and corruption","kind":"term","category":"cofficer","summary":"Offering or taking something of value to improperly influence a decision. Illegal in Canada and in most countries.","detail":"- Canadian law covers domestic and foreign bribery (Criminal Code and the Corruption of Foreign Public Officials Act).\n- Controls: policy, gifts register, due diligence on agents and vendors, training, accurate books and records.\n- Facilitation payments are a red flag area. Treat them as prohibited unless advised otherwise.","example":"","related":["Gifts and hospitality","Code of conduct"],"tags":["ethics","law"],"links":[],"flagged":false,"createdAt":1793043845336,"updatedAt":1793043845336},{"id":"whistleblowing","title":"Whistleblowing","kind":"term","category":"cofficer","summary":"A safe channel for staff to report suspected wrongdoing, with protection from retaliation.","detail":"- Offer more than one route (manager, compliance, anonymous line).\n- Acknowledge, investigate, document, and close the loop where possible.\n- Retaliation is itself a serious breach.\n- Report trends to the board without exposing the reporter.","example":"","related":["Code of conduct","Complaint handling"],"tags":["ethics","process"],"links":[],"flagged":false,"createdAt":1793043845337,"updatedAt":1793043845337},{"id":"complaint-handling","title":"Complaint handling","kind":"term","category":"cofficer","summary":"A documented way to receive, track, resolve and learn from customer complaints.","detail":"- Log every complaint with date, issue, owner, outcome and timing.\n- Acknowledge quickly, resolve fairly, explain how to escalate.\n- Review for trends: a spike can point to a product, marketing or control failure.\n- Regulated lenders and brokers often have specific complaint-handling duties. Confirm what applies to you.","example":"","related":["Whistleblowing","Reporting to the board"],"tags":["customer","process"],"links":[],"flagged":false,"createdAt":1793043845338,"updatedAt":1793043845338},{"id":"marketing-and-advertising-review","title":"Marketing and advertising review","kind":"term","category":"cofficer","summary":"Compliance checks promotional material before it goes out, so claims are true and required disclosures are present.","detail":"- Check for misleading claims (Competition Act), required rate and fee disclosure for lending products, and consent for electronic messages (CASL).\n- Keep approved versions and the approval record.\n- Applies to emails, web pages, social posts, ads and sales scripts.","example":"A \"lowest rate guaranteed\" banner needs proof, a date and terms before approval.","related":["CASL","Competition Act (misleading advertising)"],"tags":["marketing","process"],"links":[],"flagged":false,"createdAt":1793043845339,"updatedAt":1793043845339},{"id":"records-management","title":"Records management","kind":"term","category":"cofficer","summary":"Keeping the right records for the right time, in a form you can retrieve, and then disposing of them properly.","detail":"- AML records are generally kept for at least five years from the relevant date. Confirm the exact rule for each record type.\n- Privacy law pushes the other way: do not keep personal information longer than needed.\n- A retention schedule balances both.\n- Records must be retrievable within a reasonable time on request, so organise them.","example":"","related":["Data retention","Record retention (AML)"],"tags":["records","process"],"links":[],"flagged":false,"createdAt":1793043845340,"updatedAt":1793043845340},{"id":"compliance-kpis-and-kris","title":"Compliance KPIs and KRIs","kind":"term","category":"cofficer","summary":"Numbers that show whether the compliance program is healthy.","detail":"- Examples: training completion rate, overdue policy reviews, open issues and ageing, test failure rate, alerts reviewed on time, reports filed on time, complaints per 1,000 customers.\n- A **KRI** warns of rising risk (alert backlog growing). A **KPI** measures performance (percent of files tested clean).\n- Set thresholds that trigger escalation.","example":"","related":["Reporting to the board","Compliance monitoring and testing"],"tags":["metrics","reporting"],"links":[],"flagged":false,"createdAt":1793043845341,"updatedAt":1793043845341},{"id":"compliance-certifications","title":"Compliance certifications","kind":"note","category":"cofficer","summary":"Credentials that help a compliance officer, with the best fit for AML-focused fintech work first.","detail":"- **CAMS** (ACAMS): the best-known AML credential and widely asked for in Canadian job postings.\n- **ICA** diplomas and certificates (International Compliance Association): general and AML compliance.\n- **CCEP** (SCCE): general compliance and ethics programs.\n- **CIPP/C** (IAPP): Canadian privacy law.\n- **CRCM**: US-focused, mainly if you work with US banking rules.\n- Canadian courses such as those from the CSI (Canadian Securities Institute) cover compliance basics.\n\nCheck current exam requirements and fees with each provider before you commit.","example":"","related":["GRC certifications","FINTRAC"],"tags":["career","certifications"],"links":[],"flagged":false,"createdAt":1793043845342,"updatedAt":1793043845342},{"id":"first-90-days-as-compliance-officer","title":"First 90 days as compliance officer","kind":"note","category":"cofficer","summary":"A simple plan for starting well: listen, map, then fix the highest risks.","detail":"**Days 1 to 30: learn**\n- Read every policy, the last risk assessment and the last review or exam report.\n- Meet the business owners and engineers. Ask what keeps them up at night.\n- Find out which laws apply and which licences and registrations the company holds.\n\n**Days 31 to 60: map**\n- Build the obligation register and compliance calendar.\n- Review the open issues log and prior findings.\n- Test two or three high-risk controls end to end.\n\n**Days 61 to 90: act**\n- Present a prioritised plan to management.\n- Fix quick wins (training gaps, missing approvals).\n- Set up regular reporting.","example":"","related":["Compliance calendar","Compliance risk assessment"],"tags":["career","planning"],"links":[],"flagged":false,"createdAt":1793043845343,"updatedAt":1793043845343},{"id":"compliance-program-pcmltfa","title":"Compliance program (PCMLTFA)","kind":"term","category":"aml","summary":"The written AML/ATF program that a reporting entity must have. It has five required parts.","detail":"**The five elements**\n1. Appoint a **compliance officer** responsible for the program.\n2. Written, up-to-date **policies and procedures**, approved by a senior officer.\n3. A documented **risk assessment** of your business and clients.\n4. A written, ongoing **training program** and a training plan.\n5. A **two-year effectiveness review** (internal or external) with results reported to senior management within 30 days.\n\nFINTRAC checks all five in an exam. Missing or stale documents are among the most common findings.","example":"","related":["Anti-money laundering (AML)","FINTRAC","Compliance officer appointment (PCMLTFA)","Two-year effectiveness review"],"tags":["aml","core"],"links":[{"label":"FINTRAC: what we do","url":"https://fintrac-canafe.canada.ca/intro-eng"},{"label":"PCMLTFA (Justice Laws)","url":"https://laws-lois.justice.gc.ca/eng/acts/p-24.501/"}],"flagged":false,"createdAt":1793043845344,"updatedAt":1793043845344},{"id":"compliance-officer-appointment-pcmltfa","title":"Compliance officer appointment (PCMLTFA)","kind":"term","category":"aml","summary":"The law requires a named person to be responsible for implementing the AML compliance program.","detail":"- Should have enough authority, knowledge and access to senior management to do the job.\n- In small firms the owner may hold the role. In larger ones it is a dedicated hire, which is what you are applying for.\n- Document the appointment and keep the person's duties in writing.\n- The role usually carries personal exposure, so independence and clear reporting lines matter.","example":"","related":["Compliance program (PCMLTFA)","Compliance Officer (role)"],"tags":["aml","role"],"links":[{"label":"PCMLTFA (Justice Laws)","url":"https://laws-lois.justice.gc.ca/eng/acts/p-24.501/"}],"flagged":false,"createdAt":1793043845345,"updatedAt":1793043845345},{"id":"risk-based-approach-aml","title":"Risk-based approach (AML)","kind":"term","category":"aml","summary":"Spend more control effort where money-laundering risk is higher and less where it is lower.","detail":"- Assess risk by **clients, products and services, delivery channels, geography**, and new technology.\n- Low risk: simplified measures where allowed. High risk: enhanced due diligence and closer monitoring.\n- The rating must be written, applied consistently and revisited when facts change.\n- The risk assessment is what justifies your procedures.","example":"A foreign client buying through a numbered company and paying by third-party wire rates higher than a local salaried buyer with a mortgage.","related":["Compliance risk assessment","Enhanced due diligence (EDD)","Know your customer (KYC)"],"tags":["aml","risk"],"links":[{"label":"FINTRAC: what we do","url":"https://fintrac-canafe.canada.ca/intro-eng"}],"flagged":false,"createdAt":1793043845346,"updatedAt":1793043845346},{"id":"money-laundering-stages","title":"Money laundering stages","kind":"term","category":"aml","summary":"The three classic steps criminals use to make dirty money look clean: placement, layering, integration.","detail":"- **Placement**: getting cash or proceeds into the financial system.\n- **Layering**: moving it around through accounts, companies, transfers and purchases to hide the trail.\n- **Integration**: bringing it back as apparently legitimate wealth, for example a property sale.\n\nReal estate is attractive for integration because it stores large value in one transaction.","example":"","related":["Anti-money laundering (AML)","Red flags in real estate"],"tags":["aml","concept"],"links":[],"flagged":false,"createdAt":1793043845347,"updatedAt":1793043845347},{"id":"terrorist-financing","title":"Terrorist financing","kind":"term","category":"aml","summary":"Raising or moving money, often clean money, to support terrorism.","detail":"- Amounts may be small, so threshold-based rules can miss it.\n- Reporting duties are strict. A terrorist property report to the authorities is required immediately when you hold property of a listed person or entity.\n- Screening against listed entities is a core control.","example":"","related":["Sanctions screening","Anti-money laundering (AML)"],"tags":["aml","concept"],"links":[{"label":"FINTRAC: what we do","url":"https://fintrac-canafe.canada.ca/intro-eng"}],"flagged":false,"createdAt":1793043845348,"updatedAt":1793043845348},{"id":"suspicious-transaction-report-str","title":"Suspicious transaction report (STR)","kind":"term","category":"aml","summary":"A report to FINTRAC when you have reasonable grounds to suspect a transaction or attempt is related to money laundering or terrorist financing.","detail":"- Applies to completed **and attempted** transactions, of any amount. There is no minimum.\n- Must be sent **as soon as practicable** after you complete the measures that let you reach reasonable grounds to suspect.\n- Report even if the client walks away.\n- It is illegal to tell the client you filed one (see tipping off).\n- Keep the file showing how you reached your conclusion.","example":"A buyer asks to pay a deposit in cash in smaller amounts across several days, then cancels when asked for ID.","related":["Reasonable grounds to suspect","Tipping off","FINTRAC reports at a glance"],"tags":["aml","reporting"],"links":[{"label":"FINTRAC: what we do","url":"https://fintrac-canafe.canada.ca/intro-eng"}],"flagged":false,"createdAt":1793043845349,"updatedAt":1793043845349},{"id":"reasonable-grounds-to-suspect","title":"Reasonable grounds to suspect","kind":"term","category":"aml","summary":"The threshold for filing an STR: more than a hunch, less than proof.","detail":"- Based on facts, context and indicators, not on a single factor.\n- Consider what you know about the client and the usual pattern for that business.\n- Write down the reasoning. Both over- and under-reporting can be a problem, but missing a reportable transaction is the bigger risk.\n- FINTRAC publishes sector indicators to guide judgement.","example":"","related":["Suspicious transaction report (STR)","Red flags in real estate"],"tags":["aml","reporting"],"links":[{"label":"FINTRAC: what we do","url":"https://fintrac-canafe.canada.ca/intro-eng"}],"flagged":false,"createdAt":1793043845350,"updatedAt":1793043845350},{"id":"tipping-off","title":"Tipping off","kind":"term","category":"aml","summary":"Telling someone that a suspicious transaction report has been or will be made. This is prohibited.","detail":"- Train staff to stay neutral when they have concerns. Do not accuse the client.\n- Limit who knows an STR was filed.\n- Giving a normal reason for a delay (\"we need more documents\") is fine.","example":"","related":["Suspicious transaction report (STR)"],"tags":["aml","reporting"],"links":[],"flagged":false,"createdAt":1793043845351,"updatedAt":1793043845351},{"id":"fintrac-reports-at-a-glance","title":"FINTRAC reports at a glance","kind":"note","category":"aml","summary":"The main reports a reporting entity sends to FINTRAC and the usual triggers. Confirm current details on the FINTRAC site.","detail":"- **STR**: suspicion of money laundering or terrorist financing, any amount.\n- **LCTR (Large Cash Transaction Report)**: receiving **$10,000 or more in cash** in a single transaction, or in several within 24 hours that add up.\n- **LVCTR (Large Virtual Currency Transaction Report)**: receiving **$10,000 or more in virtual currency**, with the same 24-hour aggregation idea.\n- **LPEPR (Large Payment or Disbursement report related to a PEP)**: certain large payments tied to politically exposed persons for some sectors.\n- **Terrorist property report**: immediately, when you hold property of a listed person or group.\n- **EFT reports** apply mainly to financial entities and money services businesses.\n\nWhich reports apply depends on your sector and activity, so check your own obligations.","example":"","related":["Suspicious transaction report (STR)","24-hour rule","Large cash transaction report (LCTR)"],"tags":["aml","reporting","cheatsheet"],"links":[{"label":"FINTRAC: what we do","url":"https://fintrac-canafe.canada.ca/intro-eng"}],"flagged":false,"createdAt":1793043845352,"updatedAt":1793043845352},{"id":"large-cash-transaction-report-lctr","title":"Large cash transaction report (LCTR)","kind":"term","category":"aml","summary":"A report required when you receive $10,000 or more in cash.","detail":"- Triggered by a single receipt or by several in a 24-hour period that total $10,000 or more (the 24-hour rule).\n- Cash means physical bills and coins, not cheques or wires.\n- Report is due within 15 calendar days of the transaction.\n- You must also verify the identity of the person.","example":"","related":["24-hour rule","FINTRAC reports at a glance"],"tags":["aml","reporting"],"links":[{"label":"FINTRAC: what we do","url":"https://fintrac-canafe.canada.ca/intro-eng"}],"flagged":false,"createdAt":1793043845353,"updatedAt":1793043845353},{"id":"24-hour-rule","title":"24-hour rule","kind":"term","category":"aml","summary":"Multiple transactions in a 24-hour period are treated as one if they are by or for the same person or entity and add up to the threshold.","detail":"- Applies to cash and virtual currency reports and some others.\n- 24 hours is a rolling window, not a calendar day.\n- Systems should aggregate by client. Manual checks cover gaps.\n- Splitting payments to avoid a threshold (structuring) is itself a red flag.","example":"Three $4,000 cash deposits in one afternoon total $12,000 and trigger an LCTR.","related":["Large cash transaction report (LCTR)","Structuring"],"tags":["aml","reporting"],"links":[{"label":"FINTRAC: what we do","url":"https://fintrac-canafe.canada.ca/intro-eng"}],"flagged":false,"createdAt":1793043845354,"updatedAt":1793043845354},{"id":"structuring","title":"Structuring","kind":"term","category":"aml","summary":"Breaking up transactions into smaller amounts to stay under a reporting threshold.","detail":"- Also called smurfing when many people are used.\n- Look for repeated amounts just under $10,000, many deposits on the same day, or several people paying for one purchase.\n- Structuring is a strong reason to suspect and file an STR.","example":"","related":["24-hour rule","Suspicious transaction report (STR)"],"tags":["aml","red-flag"],"links":[],"flagged":false,"createdAt":1793043845355,"updatedAt":1793043845355},{"id":"politically-exposed-person-pep","title":"Politically exposed person (PEP)","kind":"term","category":"aml","summary":"Someone who holds, or recently held, a prominent public role, plus certain family members and close associates. Higher bribery and corruption risk.","detail":"- Includes foreign PEPs, domestic PEPs and heads of international organisations. Rules differ by type and by sector.\n- Typical steps: determine if the client is a PEP, get senior management approval to keep the relationship (for higher-risk cases), establish source of funds and wealth, monitor more closely.\n- Not every PEP is a criminal. The point is extra care.","example":"","related":["Enhanced due diligence (EDD)","Source of funds vs source of wealth"],"tags":["aml","kyc"],"links":[{"label":"FINTRAC: what we do","url":"https://fintrac-canafe.canada.ca/intro-eng"}],"flagged":false,"createdAt":1793043845356,"updatedAt":1793043845356},{"id":"enhanced-due-diligence-edd","title":"Enhanced due diligence (EDD)","kind":"term","category":"aml","summary":"Extra checks for higher-risk clients, beyond standard identification.","detail":"- Get more information on the client, the purpose of the relationship, and the source of funds and wealth.\n- Senior approval for onboarding or continuing.\n- Closer ongoing monitoring and more frequent reviews.\n- Triggers: high-risk rating, PEP, high-risk geography, unusual structure, adverse media, a ministerial directive.","example":"","related":["Risk-based approach (AML)","Politically exposed person (PEP)","Know your customer (KYC)"],"tags":["aml","kyc"],"links":[],"flagged":false,"createdAt":1793043845357,"updatedAt":1793043845357},{"id":"source-of-funds-vs-source-of-wealth","title":"Source of funds vs source of wealth","kind":"term","category":"aml","summary":"Source of funds is where the money for this transaction comes from. Source of wealth is how the person built their overall assets.","detail":"- Funds: \"This deposit came from the sale of my previous home.\" Back it up with a closing statement.\n- Wealth: \"I own a trucking company I founded in 2008.\"\n- EDD usually needs both. Collect evidence, not just a statement.","example":"","related":["Enhanced due diligence (EDD)","Politically exposed person (PEP)"],"tags":["aml","kyc"],"links":[],"flagged":false,"createdAt":1793043845358,"updatedAt":1793043845358},{"id":"customer-identification-methods","title":"Customer identification methods","kind":"term","category":"aml","summary":"The approved ways to verify who someone is: government photo ID, credit file, dual-process, reliance or agent, and others.","detail":"- **Government-issued photo ID** that is valid, authentic and current, checked in person or by approved technology.\n- **Credit file** method: a Canadian credit file at least three years old matching the person, from a credit reporting agency.\n- **Dual-process** method: two reliable, independent sources that agree.\n- **Reliance** on another reporting entity or an **agent** under written agreement.\n- Entities: confirm existence using records and verify who the people acting are.\n- Record the method, date and details.\n\nCheck the current FINTRAC guidance on each method for the exact conditions.","example":"","related":["Know your customer (KYC)","Beneficial ownership"],"tags":["aml","kyc"],"links":[{"label":"FINTRAC: what we do","url":"https://fintrac-canafe.canada.ca/intro-eng"}],"flagged":false,"createdAt":1793043845359,"updatedAt":1793043845359},{"id":"third-party-determination","title":"Third party determination","kind":"term","category":"aml","summary":"Working out whether someone is acting on another person's behalf, and recording who that other person is.","detail":"- Ask in a standard way. If yes, record the third party's name, address, occupation and relationship.\n- If unsure, treat as a possible third party and note why.\n- Someone paying for a property they will not own is a classic red flag.","example":"","related":["Beneficial ownership","Know your customer (KYC)"],"tags":["aml","kyc"],"links":[],"flagged":false,"createdAt":1793043845360,"updatedAt":1793043845360},{"id":"ongoing-monitoring","title":"Ongoing monitoring","kind":"term","category":"aml","summary":"Keeping watch over a business relationship to spot unusual activity and keep client information current.","detail":"- Review transactions against what you expect for that client.\n- Refresh KYC periodically, more often for high risk.\n- Escalate and document anything unusual, even if it does not become an STR.\n- Required for relationships, not one-off deals only.","example":"","related":["Risk-based approach (AML)","Know your customer (KYC)"],"tags":["aml","monitoring"],"links":[],"flagged":false,"createdAt":1793043845361,"updatedAt":1793043845361},{"id":"sanctions-screening","title":"Sanctions screening","kind":"term","category":"aml","summary":"Checking clients and counterparties against government lists of sanctioned people, entities and countries.","detail":"- Canada's regimes: Special Economic Measures Act, Justice for Victims of Corrupt Foreign Officials Act (Sergei Magnitsky Law), United Nations Act, plus Criminal Code listed terrorist entities.\n- Screen at onboarding, whenever lists change, and on payments.\n- Handle partial matches with a documented review: false positive or true match.\n- A true match means you generally must freeze and report. Get legal advice at once.","example":"Name-match score of 88 percent on a buyer: compare date of birth and country before clearing it, and record the decision.","related":["Sanctions regimes in Canada","Terrorist financing"],"tags":["aml","sanctions"],"links":[{"label":"Special Economic Measures Act","url":"https://laws-lois.justice.gc.ca/eng/acts/S-14.5/"}],"flagged":false,"createdAt":1793043845362,"updatedAt":1793043845362},{"id":"sanctions-regimes-in-canada","title":"Sanctions regimes in Canada","kind":"note","category":"aml","summary":"A quick map of where Canadian sanctions come from. Details change often, so always check the current lists.","detail":"- **SEMA**: country-specific regulations (for example Russia) and listed persons.\n- **Magnitsky Law**: sanctions on foreign officials involved in gross human rights violations or corruption.\n- **United Nations Act**: implements UN Security Council measures.\n- **Criminal Code**: listed terrorist entities.\n- Global Affairs Canada publishes the consolidated list. Use a screening tool that updates automatically.\n- Know the difference between **sanctions** (freeze and prohibit dealing) and **ministerial directives** (apply enhanced measures to transactions with certain jurisdictions).","example":"","related":["Sanctions screening","Ministerial directives"],"tags":["aml","sanctions"],"links":[],"flagged":false,"createdAt":1793043845363,"updatedAt":1793043845363},{"id":"ministerial-directives","title":"Ministerial directives","kind":"term","category":"aml","summary":"Instructions from the Minister of Finance requiring reporting entities to apply special measures to dealings with particular jurisdictions or entities.","detail":"- Often tied to money-laundering concerns about a country. Measures can include treating transactions as high risk and applying enhanced scrutiny.\n- Maintain a list of directives in force and build them into the risk assessment and screening rules.","example":"","related":["Sanctions regimes in Canada","Enhanced due diligence (EDD)"],"tags":["aml","regulation"],"links":[{"label":"FINTRAC: what we do","url":"https://fintrac-canafe.canada.ca/intro-eng"}],"flagged":false,"createdAt":1793043845364,"updatedAt":1793043845364},{"id":"red-flags-in-real-estate","title":"Red flags in real estate","kind":"note","category":"aml","summary":"Warning signs that a real estate or mortgage deal may involve laundering. Use as a checklist, never as proof on its own.","detail":"- Buyer is unconcerned about price, property features or financing terms.\n- Funds from a third party, a foreign account, or a company with no clear purpose.\n- Rapid resale (flipping) at an unexplained price change.\n- Cash payments or deposits in round amounts, or payments just under thresholds.\n- Complex ownership: trusts, shells, nominees, no clear beneficial owner.\n- Client reluctant to give ID or to explain the source of funds.\n- Mortgage paid off early, or large unexplained down payment.\n- Use of lawyers' trust accounts with no related legal work.\n- Reliance on an intermediary who will not name the principal.","example":"","related":["Money laundering stages","Reasonable grounds to suspect","Real estate wire fraud","Title fraud"],"tags":["aml","red-flag","real-estate"],"links":[{"label":"FINTRAC: what we do","url":"https://fintrac-canafe.canada.ca/intro-eng"}],"flagged":false,"createdAt":1793043845365,"updatedAt":1793043845365},{"id":"record-retention-aml","title":"Record retention (AML)","kind":"term","category":"aml","summary":"Keeping AML records, such as ID records, reports and transaction records, for the required period, generally at least five years.","detail":"- Must be able to produce records to FINTRAC within the time requested, typically 30 days.\n- Confirm how long each record type must be kept and from what date it is counted.\n- Store securely and in line with privacy law.","example":"","related":["Records management","Data retention"],"tags":["aml","records"],"links":[{"label":"FINTRAC: what we do","url":"https://fintrac-canafe.canada.ca/intro-eng"}],"flagged":false,"createdAt":1793043845366,"updatedAt":1793043845366},{"id":"two-year-effectiveness-review","title":"Two-year effectiveness review","kind":"term","category":"aml","summary":"A review, at least every two years, of whether the compliance program actually works.","detail":"- Covers policies, risk assessment, training and how they operate in practice.\n- Done by someone independent of the day-to-day program: an internal auditor, or an outside party. In some cases it may be done by an internal person who is not responsible for the program.\n- Results and any updates are reported to a senior officer within 30 days.\n- Track the findings to closure.","example":"","related":["Compliance program (PCMLTFA)","Issues log and corrective action"],"tags":["aml","review"],"links":[{"label":"FINTRAC: what we do","url":"https://fintrac-canafe.canada.ca/intro-eng"}],"flagged":false,"createdAt":1793043845367,"updatedAt":1793043845367},{"id":"mortgage-sector-aml-obligations","title":"Mortgage sector AML obligations","kind":"note","category":"aml","summary":"Mortgage administrators, brokers and lenders became reporting entities under the PCMLTFA in October 2024.","detail":"- They must have a full compliance program, verify identity, keep records and report suspicious transactions.\n- Real estate brokers, sales representatives and developers were already covered.\n- A real estate fintech may fall under more than one category depending on what it does: confirm which with legal counsel and FINTRAC guidance.","example":"","related":["Compliance program (PCMLTFA)","TRESA and RECO"],"tags":["aml","real-estate"],"links":[{"label":"FINTRAC: what we do","url":"https://fintrac-canafe.canada.ca/intro-eng"}],"flagged":false,"createdAt":1793043845368,"updatedAt":1793043845368},{"id":"bill-c-12-and-higher-penalties","title":"Bill C-12 and higher penalties","kind":"note","category":"aml","summary":"A federal law passed in 2026 that raised AML penalties sharply and reshaped enforcement. Check what is in force.","detail":"- Received Royal Assent on 26 March 2026.\n- Increases administrative monetary penalty maximums to roughly **40 times** the previous levels, and adds other enforcement tools.\n- Some parts, such as broader enrolment of reporting entities, depend on regulations and dates still to come. Verify current status on the FINTRAC site.\n- Practical effect: expect tougher exams and less tolerance for repeat or systemic failures.","example":"","related":["Administrative monetary penalties (AMPs)","FINTRAC examination"],"tags":["aml","regulation","check-status"],"links":[{"label":"FINTRAC: what we do","url":"https://fintrac-canafe.canada.ca/intro-eng"}],"flagged":false,"createdAt":1793043845369,"updatedAt":1793043845369},{"id":"administrative-monetary-penalties-amps","title":"Administrative monetary penalties (AMPs)","kind":"term","category":"aml","summary":"Fines FINTRAC can impose for non-compliance, without going to court.","detail":"- Violations are classed as minor, serious or very serious.\n- Factors: harm done, compliance history, ability to pay, cooperation.\n- FINTRAC publishes the names of penalized entities, so reputational damage matters too.\n- Higher penalty ceilings were introduced in 2026 (see Bill C-12).","example":"","related":["Bill C-12 and higher penalties","FINTRAC examination"],"tags":["aml","enforcement"],"links":[{"label":"FINTRAC: what we do","url":"https://fintrac-canafe.canada.ca/intro-eng"}],"flagged":false,"createdAt":1793043845370,"updatedAt":1793043845370},{"id":"fintrac-examination","title":"FINTRAC examination","kind":"term","category":"aml","summary":"FINTRAC's compliance review of a reporting entity: documents, interviews and sample testing.","detail":"- Triggers: risk-based selection, sector sweeps, reports, tip-offs.\n- They assess the five program elements and sample your reporting, record keeping and identification.\n- Outcomes: findings letter, action plan, possible penalty.\n- Respond on time, fix root causes and keep evidence.","example":"","related":["Regulatory examination readiness","Administrative monetary penalties (AMPs)"],"tags":["aml","regulator"],"links":[{"label":"FINTRAC: what we do","url":"https://fintrac-canafe.canada.ca/intro-eng"}],"flagged":false,"createdAt":1793043845371,"updatedAt":1793043845371},{"id":"voluntary-self-declaration-of-non-compliance","title":"Voluntary self-declaration of non-compliance","kind":"term","category":"aml","summary":"A way to tell FINTRAC about a compliance problem you found yourself, before they find it.","detail":"- Shows good faith and can be considered in how FINTRAC responds.\n- Explain what happened, how many records were affected, root cause and the fix.\n- Decide with senior management and legal advice.","example":"","related":["Issues log and corrective action","FINTRAC examination"],"tags":["aml","process"],"links":[{"label":"FINTRAC: what we do","url":"https://fintrac-canafe.canada.ca/intro-eng"}],"flagged":false,"createdAt":1793043845372,"updatedAt":1793043845372},{"id":"pcmltfa","title":"PCMLTFA","kind":"term","category":"regs","summary":"Proceeds of Crime (Money Laundering) and Terrorist Financing Act. Canada's main AML law, enforced by FINTRAC.","detail":"- Sets duties for reporting entities: compliance program, identification, record keeping, reporting.\n- Supported by regulations that set the details.\n- Penalties include administrative fines and, for some offences, criminal penalties.","example":"","related":["FINTRAC","Compliance program (PCMLTFA)","Bill C-12 and higher penalties"],"tags":["law","aml"],"links":[{"label":"PCMLTFA (Justice Laws)","url":"https://laws-lois.justice.gc.ca/eng/acts/p-24.501/"}],"flagged":false,"createdAt":1793043845373,"updatedAt":1793043845373},{"id":"casl","title":"CASL","kind":"term","category":"regs","summary":"Canada's Anti-Spam Legislation: rules for commercial electronic messages.","detail":"- Need **consent** (express or implied), **identification** of the sender, and a working **unsubscribe**.\n- Applies to emails, texts and some social messages.\n- Keep proof of consent.\n- Penalties can reach into the millions per violation, and directors can be personally exposed.\n- Enforced by the CRTC, the Competition Bureau and the OPC.","example":"","related":["Consent","Marketing and advertising review"],"tags":["law","marketing"],"links":[{"label":"Canada's anti-spam legislation","url":"https://fightspam.gc.ca/"}],"flagged":false,"createdAt":1793043845374,"updatedAt":1793043845374},{"id":"rpaa","title":"RPAA","kind":"term","category":"regs","summary":"Retail Payment Activities Act. Payment service providers must register with the Bank of Canada and meet risk and safeguarding rules.","detail":"- Registration began on 1 November 2024.\n- Requires an operational risk and incident response framework, safeguarding of end-user funds, and reporting of incidents.\n- Applies if you perform payment functions (for example holding funds, initiating or authorizing payments) in Canada. Check whether your products fit.\n- Dates for some obligations have been phased. Confirm the current schedule on the Bank of Canada site.","example":"","related":["Incident Response Plan (IRP)","Trust account"],"tags":["law","payments","check-status"],"links":[{"label":"Bank of Canada: retail payments supervision","url":"https://www.bankofcanada.ca/core-functions/retail-payments-supervision/"}],"flagged":false,"createdAt":1793043845375,"updatedAt":1793043845375},{"id":"fsra","title":"FSRA","kind":"term","category":"regs","summary":"Financial Services Regulatory Authority of Ontario. Regulates mortgage brokerages, agents and administrators, and others.","detail":"- Licenses mortgage brokerages, brokers, agents and administrators under the Mortgage Brokerages, Lenders and Administrators Act, 2006.\n- Expects a principal broker to supervise and keep proper records and controls.\n- Publishes guidance and conducts exams and enforcement.\n- Other provinces have their own regulators.","example":"","related":["TRESA and RECO","Mortgage sector AML obligations"],"tags":["regulator","ontario"],"links":[{"label":"FSRA","url":"https://www.fsrao.ca/"}],"flagged":false,"createdAt":1793043845376,"updatedAt":1793043845376},{"id":"competition-act-misleading-advertising","title":"Competition Act (misleading advertising)","kind":"term","category":"regs","summary":"Federal law that bans false or misleading claims in marketing.","detail":"- Applies to prices, discounts, performance claims and \"free\" offers.\n- Drip pricing (hiding fees until late) is addressed.\n- Keep evidence to support claims before they are published.\n- Administrative penalties can be large.","example":"","related":["Marketing and advertising review"],"tags":["law","marketing"],"links":[{"label":"Competition Bureau","url":"https://competition-bureau.canada.ca/"}],"flagged":false,"createdAt":1793043845377,"updatedAt":1793043845377},{"id":"criminal-interest-rate","title":"Criminal interest rate","kind":"term","category":"regs","summary":"The Criminal Code caps the annual percentage rate on credit. The cap was lowered to 35 percent APR from 1 January 2025.","detail":"- Relevant for lenders and fintech credit products. Some exemptions exist for certain commercial loans.\n- Build the APR calculation into product design and testing.\n- Confirm current exemptions and limits with legal counsel.","example":"","related":["Marketing and advertising review"],"tags":["law","lending"],"links":[],"flagged":false,"createdAt":1793043845378,"updatedAt":1793043845378},{"id":"provincial-real-estate-and-mortgage-regulators","title":"Provincial real estate and mortgage regulators","kind":"note","category":"regs","summary":"Who regulates what depends on the province. In Ontario, RECO oversees real estate and FSRA oversees mortgages.","detail":"- Ontario: RECO (under TRESA) for brokerages and salespeople, FSRA for mortgage brokering.\n- BC: BC Financial Services Authority and the Real Estate Council of BC.\n- Quebec: OACIQ for real estate brokerage, AMF for financial services.\n- Expect licence conditions, advertising rules and trust account rules in each province.\n- A fintech working across provinces must map each one.","example":"","related":["TRESA and RECO","FSRA"],"tags":["regulator","provincial"],"links":[],"flagged":false,"createdAt":1793043845379,"updatedAt":1793043845379},{"id":"regulator-relationship-management","title":"Regulator relationship management","kind":"note","category":"regs","summary":"How to deal with regulators well: be early, honest and organised.","detail":"- Know each regulator's contact points and what you must report.\n- Report issues before they ask where you can.\n- Keep one record of all communications.\n- Be factual in written responses and avoid speculation.\n- Follow through on commitments by the date you gave.","example":"","related":["FINTRAC examination","Voluntary self-declaration of non-compliance"],"tags":["regulator","process"],"links":[],"flagged":false,"createdAt":1793043845380,"updatedAt":1793043845380},{"id":"real-estate-fintech-compliance-map","title":"Real estate fintech compliance map","kind":"note","category":"cofficer","summary":"One-page map of the rules a real estate fin
