<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GRC Field Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: three-pane working file — category index | entry ledger | open entry. Collapses to chips + list/detail on phones. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#E4E9EE; --fg:#15202B; --muted:#5B6876; --line:#D3DAE1;
  --accent:#1C5B87; --accent-fg:#FFFFFF; --accent-soft:#DAE7F1; --flag:#A35F00; --flag-soft:#F7E8CC; --danger:#B3261E; --danger-soft:#F8DEDB;
  --f-display:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151C; --surface:#161F29; --surface-2:#1E2935; --fg:#E3E9EF; --muted:#93A1B0; --line:#293543;
  --accent:#82B8DF; --accent-fg:#0F151C; --accent-soft:#1A3246; --flag:#E5A851; --flag-soft:#38290F; --danger:#F08B80; --danger-soft:#3B1C1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#161F29; --surface-2:#1E2935; --fg:#E3E9EF; --muted:#93A1B0; --line:#293543;
  --accent:#82B8DF; --accent-fg:#0F151C; --accent-soft:#1A3246; --flag:#E5A851; --flag-soft:#38290F; --danger:#F08B80; --danger-soft:#3B1C1A; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em;margin:0;white-space:nowrap}
.brand .count{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.search{position:relative;flex:1 1 260px;max-width:420px}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}

.panes{display:grid;grid-template-columns:230px minmax(280px,360px) minmax(0,1fr);min-height:0}
.rail,.ledger,.detail{min-height:0;overflow-y:auto}
.rail{border-right:1px solid var(--line);padding:18px 12px}
.ledger{border-right:1px solid var(--line);background:var(--surface)}
.detail{padding:28px 32px 48px}

.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rail .label{padding:0 10px 6px}
.rail nav{display:flex;flex-direction:column;gap:1px;margin-bottom:18px}
.catbtn{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:6px;width:100%;text-align:left;padding:6px 10px;border:0;border-radius:6px;background:transparent;cursor:pointer;font-size:14px}
.catbtn:hover{background:var(--surface-2)}
.catbtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg);font-weight:600}
.catbtn .code{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.catbtn[aria-pressed="true"] .code{color:var(--accent)}
.catbtn .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.kinds{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 18px}
.pill{padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px}
.pill[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chiprow{display:none}

.ledger-head{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.ledger-head h2{font-family:var(--f-display);font-size:15px;font-weight:700;margin:0}
.ledger ul{list-style:none;margin:0;padding:0}
.row{display:block;width:100%;text-align:left;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer}
.row:hover{background:var(--surface-2)}
.row[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.row .t{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.row .t span.title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.tag-code{font-family:var(--f-mono);font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--surface-2);color:var(--muted);flex:none}
.kind-note{font-family:var(--f-mono);font-size:10.5px;padding:1px 6px;border-radius:4px;border:1px dashed var(--muted);color:var(--muted);flex:none}
.flagdot{width:8px;height:8px;border-radius:50%;background:var(--flag);flex:none}
.empty{padding:28px 18px;color:var(--muted);font-size:14px}
.empty strong{display:block;color:var(--fg);font-family:var(--f-display);font-size:16px;margin-bottom:4px}

/* detail */
.entry{max-width:720px}
.back{display:none;margin-bottom:14px}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.eyebrow .code{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:500}
.entry h2.title{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,4vw,36px);line-height:1.12;letter-spacing:-.02em;margin:0 0 14px;text-wrap:balance}
.lead{font-size:18px;line-height:1.55;margin:0 0 24px;max-width:65ch}
.sect{margin:0 0 24px;max-width:65ch}
.sect h3{margin:0 0 8px}
.sect p{margin:0 0 10px}
.sect ul{margin:0 0 10px;padding-left:20px}
.sect li{margin-bottom:4px}
.example{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 var(--r) var(--r) 0;padding:12px 16px}
.example p:last-child{margin-bottom:0}
.links{display:flex;flex-wrap:wrap;gap:6px}
.link{padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px}
.link:hover{border-color:var(--accent);color:var(--accent)}
.link.missing{border-style:dashed;color:var(--muted);cursor:default}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.flagbanner{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--r);background:var(--flag-soft);color:var(--flag);font-size:14px;font-weight:500;margin-bottom:18px;max-width:65ch}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:16px;margin-top:8px}
.meta .when{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-right:auto}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r);background:var(--danger-soft);color:var(--danger);font-size:14px;width:100%}

/* welcome */
.welcome h2{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.02em;margin:0 0 8px}
.welcome p{color:var(--muted);max-width:60ch}
.stats{display:flex;flex-wrap:wrap;gap:28px;margin:22px 0}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted)}
.recent{margin-top:12px}

/* form */
form.editor{max-width:720px;display:flex;flex-direction:column;gap:16px}
form.editor h2{font-family:var(--f-display);font-weight:800;font-size:24px;margin:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
.field .hint{font-size:12.5px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.field textarea{resize:vertical;min-height:80px;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;width:max-content}
.seg button{padding:7px 14px;border:0;background:var(--surface);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.err{color:var(--danger);font-size:13.5px}
.actions{display:flex;gap:10px;flex-wrap:wrap}

/* flashcards */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.card{width:min(560px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:16px;max-height:100%;overflow:auto}
.card .top{display:flex;justify-content:space-between;align-items:center}
.card .q{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance;margin:6px 0}
.card .a{border-top:1px dashed var(--line);padding-top:14px}
.card .a p{margin:0 0 10px}
.card .nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}

code{font-family:var(--f-mono);font-size:.88em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.codewrap{position:relative;margin:0 0 12px;max-width:100%}
.codewrap pre{margin:0;padding:12px 70px 12px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.codewrap pre code{background:none;padding:0;font-size:13px;line-height:1.55;white-space:pre}
.codewrap .copy{position:absolute;top:6px;right:6px;padding:3px 10px;font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20}
.status{padding:8px 20px;font-size:13px;background:var(--flag-soft);color:var(--flag)}

@media (max-width:1000px){
  .panes{grid-template-columns:minmax(260px,330px) minmax(0,1fr)}
  .rail{display:none}
  .chiprow{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
  .chiprow .pill{flex:none}
}
@media (max-width:700px){
  header.top{padding:12px 16px}
  .search{max-width:none;order:3;flex-basis:100%}
  .panes{grid-template-columns:minmax(0,1fr)}
  .app[data-view="list"] .detail{display:none}
  .app[data-view="detail"] .ledger,.app[data-view="detail"] .chiprow{display:none}
  .detail{padding:18px 16px 40px}
  .back{display:inline-flex}
  .two{grid-template-columns:1fr}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:no-preference){.row,.catbtn,.btn{transition:background .12s}}
</style>
</head>
<body>

<div class="app" id="app" data-view="list">
  <header class="top">
    <div class="brand"><h1>GRC Field Guide</h1><span class="count" id="count"></span></div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search terms, notes, tags" autocomplete="off" aria-label="Search">
    </div>
    <button class="btn" id="cardsBtn" type="button">Flashcards</button>
    <button class="btn" id="exportBtn" type="button" title="Download a backup of all entries">Export</button>
    <button class="btn" id="importBtn" type="button" title="Add entries from a backup file">Import</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <button class="btn primary" id="newBtn" type="button">+ New entry</button>
  </header>
  <div style="min-height:0;display:grid;grid-template-rows:auto auto 1fr">
    <div id="status" class="status" hidden></div>
    <div class="chiprow" id="chips"></div>
    <div class="panes">
      <aside class="rail" id="rail"></aside>
      <section class="ledger" id="ledger" aria-label="Entries"></section>
      <main class="detail" id="detail"></main>
    </div>
  </div>
</div>
<div id="overlay" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>const SEED=[{"category":"military","createdAt":1792182600000,"detail":"- The military equivalent of a post-incident review.\n- Works best when it is blameless, so people share honestly.\n- Use it after tabletop exercises and real incidents, and feed the results into the risk register.","example":"","flagged":false,"kind":"term","related":["Post-incident review","Tabletop exercise","Risk register"],"summary":"After-action review: a structured debrief that asks what was supposed to happen, what did happen, why they differ, and what to keep or change.","tags":["incident","process","military"],"title":"AAR","updatedAt":1792182599981,"id":"aar"},{"category":"risk","createdAt":1790983894413,"detail":"","example":"A few minutes of website downtime once a year.","flagged":false,"kind":"term","related":["Risk appetite","Residual risk"],"summary":"Knowingly live with a risk because it is small or fixing it costs more than the harm. Acceptance should be documented and signed off by someone with authority.","tags":["lesson-2","risk-response"],"title":"Accept (risk response)","updatedAt":1790983894398,"id":"accept-risk-response"},{"category":"security","createdAt":1790983894413,"detail":"","example":"","flagged":false,"kind":"term","related":["Least privilege","Evidence"],"summary":"A periodic check, often quarterly, that each person's access is still appropriate. Managers or system owners sign off.","tags":["access","audit"],"title":"Access review","updatedAt":1790983894344,"id":"access-review"},{"category":"linux","createdAt":1792173300000,"detail":"**Option 1: Gear Lever.** It is a Flatpak app that manages AppImages for you, including menu entries and updates for apps that support them.\n\n```\nflatpak install flathub it.mijorus.gearlever\n```\n\n**Option 2: write the launcher yourself.** Create `~/.local/share/applications/myapp.desktop`:\n\n```\n[Desktop Entry]\nType=Application\nName=My App\nExec=/home/yourname/Applications/MyApp-x86_64.AppImage\nIcon=/home/yourname/Applications/myapp.png\nTerminal=false\nCategories=Utility;\n```\n\nThen refresh the menu:\n\n```\nupdate-desktop-database ~/.local/share/applications\n```\n\n- Use the full path in `Exec` and `Icon`. A `~` does not work there.\n- To get an icon, run the AppImage with `--appimage-extract`, then copy a .png from the `squashfs-root` folder.\n- To run it from the terminal by name, see PATH and shell config.","example":"","flagged":false,"kind":"note","related":["Running an AppImage on Fedora","Flatpak","PATH and shell config"],"summary":"Two ways to make an AppImage show up in the app launcher: Gear Lever, or a hand-written .desktop file.","tags":["appimage","how-to","linux"],"title":"Adding an AppImage to the app menu","updatedAt":1792173299988,"id":"adding-an-appimage-to-the-app-menu"},{"category":"controls","createdAt":1790983894413,"detail":"","example":"Annual security training; a policy requiring employees to lock their computers.","flagged":false,"kind":"term","related":["Technical control","Policy, standard, procedure"],"summary":"A control made of policies, procedures and training that people must follow.","tags":["lesson-3"],"title":"Administrative control","updatedAt":1790983894390,"id":"administrative-control"},{"category":"ai","createdAt":1790983894413,"detail":"Location, postal code or name can act as proxies for protected grounds, so a model can discriminate without ever seeing them.","example":"AI rental screening that rejects far more applicants from certain neighbourhoods.","flagged":false,"kind":"term","related":["Tenant screening","EU AI Act"],"summary":"When an AI system produces unfair results for certain groups, often because of skewed training data or proxy variables.","tags":["lesson-8"],"title":"AI bias","updatedAt":1790983894329,"id":"ai-bias"},{"category":"military","createdAt":1792182600000,"detail":"- Air gaps are not perfect. The Stuxnet malware crossed one on infected USB drives.\n- Controls: strict rules on removable media and one-way transfer devices called data diodes.\n- Common in industrial control systems as well as defence.","example":"","flagged":false,"kind":"term","related":["Defense in depth","Classification levels","Physical control"],"summary":"An air gap is a network physically separated from the internet and other networks. US classified networks include NIPRNet (unclassified), SIPRNet (secret) and JWICS (top secret and SCI).","tags":["cyber","networks","military"],"title":"Air gap and classified networks","updatedAt":1792182599984,"id":"air-gap-and-classified-networks"},{"category":"refintech","createdAt":1790983894413,"detail":"Canada's law is the Proceeds of Crime (Money Laundering) and Terrorist Financing Act (PCMLTFA), enforced by FINTRAC.","example":"","flagged":false,"kind":"term","related":["FINTRAC","Know your customer (KYC)","Beneficial ownership"],"summary":"Laws and controls that stop criminals from disguising illegal money as legitimate, for example through property purchases.","tags":["aml"],"title":"Anti-money laundering (AML)","updatedAt":1790983894324,"id":"anti-money-laundering-aml"},{"category":"linux","createdAt":1792173300000,"detail":"- **RPM through dnf:** first choice when Fedora has it. Signed, and it updates with the system.\n- **Flatpak:** a good second choice. Sandboxed, large catalogue, one command updates everything.\n- **AppImage:** best when the developer only offers that. One file, easy to try and remove. Updates are on you and there is no sandbox.\n- **Tarball or building from source:** last resort.\n\nThe security angle: every app you install outside the distro's repositories is a vendor you are trusting. Prefer sources that sign their releases, and keep a list of what you installed by hand.","example":"","flagged":false,"kind":"note","related":["dnf and RPM","Flatpak","AppImage","Third-Party Risk Management (TPRM)"],"summary":"Which packaging to pick when an app offers more than one.","tags":["packages","comparison","linux"],"title":"AppImage, Flatpak or RPM","updatedAt":1792173299987,"id":"appimage-flatpak-or-rpm"},{"category":"linux","createdAt":1792173300000,"detail":"**FUSE error** (\"AppImages require FUSE to run\" or \"error loading libfuse.so.2\"). Install FUSE 2 support:\n\n```\nsudo dnf install fuse fuse-libs\n```\n\n**No FUSE, or you would rather not install it.** Run in extract mode, or unpack once and run the unpacked copy:\n\n```\n./MyApp-x86_64.AppImage --appimage-extract-and-run\n./MyApp-x86_64.AppImage --appimage-extract\n./squashfs-root/AppRun\n```\n\n- \"Permission denied\": you skipped `chmod +x`, or the file is on a drive mounted `noexec`. Move it into your home folder.\n- \"Exec format error\": wrong CPU build. Compare `uname -m` with the file name.\n- Closes with no message: start it from a terminal to see the error. Missing libraries are the usual cause.\n- Electron apps that complain about the \"SUID sandbox helper\": adding `--no-sandbox` works around it, but it switches off a protection, so do it only for apps you trust.\n- Still blocked with normal permissions correct: SELinux may be denying it. Look for recent denials with `sudo ausearch -m avc -ts recent`. Do not turn SELinux off to fix this.","example":"","flagged":false,"kind":"note","related":["FUSE","Running an AppImage on Fedora","SELinux","Disk and storage commands"],"summary":"Fixes for the usual reasons an AppImage will not start on Fedora.","tags":["appimage","troubleshooting","linux"],"title":"AppImage troubleshooting","updatedAt":1792173299989,"id":"appimage-troubleshooting"},{"category":"linux","createdAt":1792173300000,"detail":"- Nothing is installed system-wide and no root access is needed. Delete the file to remove the app.\n- It must match your CPU: x86_64 for most PCs, aarch64 for ARM. Check with `uname -m`.\n- It does not update through dnf. Check for new releases yourself unless the app has its own updater.\n- It runs with all your user permissions, because there is no sandbox by default.","example":"A download named something like MyApp-1.4.2-x86_64.AppImage.","flagged":false,"kind":"term","related":["Running an AppImage on Fedora","AppImage troubleshooting","FUSE","Verifying a download","AppImage, Flatpak or RPM"],"summary":"A single downloadable file that contains an app and what it needs to run on most Linux distributions. You make it executable and run it, with no install step.","tags":["packages","appimage","linux"],"title":"AppImage","updatedAt":1792173299992,"id":"appimage"},{"category":"military","createdAt":1792182600000,"detail":"- Researchers give groups names or numbers, such as APT29.\n- Typical targets: governments, defence suppliers, critical infrastructure and financial firms. Goals are espionage, disruption or theft.\n- Most companies are more likely to face criminals such as ransomware gangs, but threat reports use the term constantly.","example":"","flagged":false,"kind":"term","related":["TTPs","Ransomware","MITRE ATT&CK"],"summary":"Advanced persistent threat: a well-resourced attacker, often linked to a state, that stays inside a network for a long time.","tags":["cyber","threats","military"],"title":"APT","updatedAt":1792182599991,"id":"apt"},{"category":"linux","createdAt":1792173300000,"detail":"```\ntar -xf file.tar.gz              # extract (works for most tar formats)\ntar -czf backup.tar.gz folder/   # create\nunzip file.zip\nzip -r archive.zip folder/\n```","example":"","flagged":false,"kind":"note","related":["Terminal and shell"],"summary":"Pack and unpack the common archive formats.","tags":["commands","linux"],"title":"Archives (tar and zip)","updatedAt":1792173299972,"id":"archives-tar-and-zip"},{"category":"military","createdAt":1792182600000,"detail":"- Granted after an assessment, usually with conditions and an expiry date.\n- Equivalent to a risk acceptance sign-off, or a go-live approval in a commercial company.","example":"","flagged":false,"kind":"term","related":["RMF","Residual risk","POA&M","Accept (risk response)"],"summary":"Authority to operate: a formal decision by a senior official to accept the remaining risk and let a system run.","tags":["frameworks","us","military"],"title":"ATO","updatedAt":1792182599952,"id":"ato"},{"category":"audit","createdAt":1790983894413,"detail":"- Internal audit: the company's own team, finding problems before outsiders do\n- External audit: an independent firm; produces SOC 2 reports and ISO certifications","example":"","flagged":false,"kind":"term","related":["Internal audit","Evidence","Sampling"],"summary":"An independent check of whether a company does what it claims.","tags":["lesson-6"],"title":"Audit","updatedAt":1790983894369,"id":"audit"},{"category":"risk","createdAt":1790983894413,"detail":"Only realistic when the activity is optional. You can't avoid a data breach entirely if your business needs customer data.","example":"A startup with no security team decides not to collect health records yet.","flagged":false,"kind":"term","related":["Data minimization"],"summary":"Stop doing the activity that creates the risk.","tags":["lesson-2","risk-response"],"title":"Avoid (risk response)","updatedAt":1790983894399,"id":"avoid-risk-response"},{"category":"security","createdAt":1790983894413,"detail":"","example":"","flagged":false,"kind":"term","related":["Corrective control","RTO and RPO"],"summary":"Copying data so it can be restored after loss. A backup only counts if restores are tested.","tags":["resilience"],"title":"Backup and recovery","updatedAt":1790983894336,"id":"backup-and-recovery"},{"category":"refintech","createdAt":1790983894413,"detail":"Hidden ownership through numbered companies is a known money-laundering pattern in real estate.","example":"","flagged":false,"kind":"term","related":["Anti-money laundering (AML)"],"summary":"Identifying the real people who ultimately own or control a company or trust, not just the name on paper.","tags":["aml"],"title":"Beneficial ownership","updatedAt":1790983894322,"id":"beneficial-ownership"},{"category":"military","createdAt":1792182600000,"detail":"Use it in risk reports and emails to executives. Busy readers decide from the first line.","example":"BLUF: We need approval to renew the vendor. Risk is medium. Decision needed by Friday.","flagged":false,"kind":"term","related":["SITREP","Risk register"],"summary":"Bottom line up front: put the conclusion or the decision you need in the first sentence, then the supporting details.","tags":["communication","military"],"title":"BLUF","updatedAt":1792182599972,"id":"bluf"},{"category":"incident","createdAt":1790983894413,"detail":"- GDPR: regulator within 72 hours of becoming aware\n- PIPEDA: as soon as feasible, when there's a real risk of significant harm\n- Vendor contracts: require vendors to tell you quickly (often 24–72 hours), or your own clock is at risk","example":"Breach discovered Monday morning → GDPR deadline Thursday morning.","flagged":false,"kind":"note","related":["GDPR","Real risk of significant harm (RROSH)","Data Processing Agreement (DPA)"],"summary":"Who to notify, and how fast, depends on the law and where users live.","tags":["key-idea"],"title":"Breach notification clocks","updatedAt":1790983894309,"id":"breach-notification-clocks"},{"category":"audit","createdAt":1790983894413,"detail":"","example":"","flagged":false,"kind":"term","related":["SOC 2"],"summary":"A letter from a vendor covering the gap between the end of their last SOC 2 period and today, stating no major changes to controls.","tags":["vendors"],"title":"Bridge letter","updatedAt":1790983894359,"id":"bridge-letter"},{"category":"security","createdAt":1790983894413,"detail":"","example":"","flagged":false,"kind":"term","related":["RTO and RPO","Backup and recovery"],"summary":"BCP keeps the business running during a disruption; DR restores the technology.","tags":["resilience"],"title":"Business continuity and disaster recovery (BCP/DR)","updatedAt":1790983894334,"id":"business-continuity-and-disaster-recovery-bcp-dr"},{"category":"security","createdAt":1790983894413,"detail":"","example":"","flagged":false,"kind":"term","related":["Real estate wire fraud","Phishing"],"summary":"Fraud where criminals impersonate a trusted person by email to redirect payments.","tags":["threats","fraud"],"title":"Business email compromise (BEC)","updatedAt":1790983894330,"id":"business-email-compromise-bec"},{"category":"military","createdAt":1792182600000,"detail":"- Malware on an infected computer \"phones home\" to a C2 server (also written C&C) for instructions.\n- Defenders look for it in unusual outbound traffic, odd DNS requests and connections at regular intervals, called beaconing.\n- It is a tactic in MITRE ATT&CK and a stage in the cyber kill chain.","example":"","flagged":false,"kind":"term","related":["Kill chain","MITRE ATT&CK","Logging and monitoring","Detective control"],"summary":"Command and control: how a commander directs forces. In cyber, the channel an attacker uses to control compromised machines.","tags":["cyber","military"],"title":"C2","updatedAt":1792182599998,"id":"c2"},{"category":"military","createdAt":1792182600000,"detail":"- ISR on its own means intelligence, surveillance and reconnaissance: gathering information about an adversary and the environment.\n- The heavy reliance on networks and software makes these systems a prime cyber target.\n- Suppliers in this space face the strictest requirements, such as CMMC and personnel clearances.","example":"","flagged":false,"kind":"term","related":["C2","CMMC","Intelligence disciplines (SIGINT, HUMINT, OSINT)"],"summary":"Command, control, communications, computers, intelligence, surveillance and reconnaissance: the systems that let military forces see, decide and communicate.","tags":["cyber","military"],"title":"C4ISR","updatedAt":1792182599997,"id":"c4isr"},{"category":"military","createdAt":1792182600000,"detail":"Defence suppliers deal with DND's security requirements and the Contract Security Program. See CPCSC for the planned supplier certification.","example":"","flagged":false,"kind":"term","related":["CPCSC","CSE","Classification levels"],"summary":"Canadian Armed Forces and the Department of National Defence: Canada's military and the civilian department that supports it.","tags":["canada","organizations","military"],"title":"CAF and DND","updatedAt":1792182599956,"id":"caf-and-dnd"},{"category":"military","createdAt":1792182600000,"detail":"- Publishes alerts, sector advisories and baseline controls for small and medium organizations, plus the ITSG guidance series.\n- Its advisories use TLP labels.","example":"","flagged":false,"kind":"term","related":["CSE","ITSG-33","TLP"],"summary":"Canadian Centre for Cyber Security: Canada's technical authority on cyber security, part of CSE. It issues alerts and guidance for governments and businesses.","tags":["canada","organizations","military"],"title":"CCCS","updatedAt":1792182599957,"id":"cccs"},{"category":"military","createdAt":1792182600000,"detail":"In an incident, someone must have authority to take a system offline. If the tabletop exercise shows nobody does, fix it in the response plan and name deputies too.","example":"","flagged":false,"kind":"term","related":["Incident Response Plan (IRP)","Tabletop exercise","Three lines model"],"summary":"The line of authority that shows who gives orders and who reports to whom.","tags":["incident","governance","military"],"title":"Chain of command","updatedAt":1792182599974,"id":"chain-of-command"},{"category":"security","createdAt":1790983894413,"detail":"Auditors test it heavily. Look for approval before deployment and segregation between who writes and who approves.","example":"","flagged":false,"kind":"term","related":["Segregation of duties"],"summary":"A controlled process for changes to production systems: request, review, approve, test, deploy, record.","tags":["operations","audit"],"title":"Change management","updatedAt":1790983894339,"id":"change-management"},{"category":"military","createdAt":1792182600000,"detail":"- Canada: Protected A, B and C cover sensitive information outside the national interest, such as personal or business information held by government, rising from limited to extremely grave injury. Confidential, Secret and Top Secret cover the national interest.\n- US: SCI (sensitive compartmented information) sits on top of Top Secret and needs extra access approval.\n- A security clearance is the vetting that lets someone see classified material at a given level, always paired with need to know.\n- In Canada, private companies on government contracts can be screened through PSPC's Contract Security Program.\n- Commercial data classification (public, internal, confidential, restricted) works the same way.","example":"","flagged":false,"kind":"term","related":["Need to know","SCIF","CUI","Personal information (PI)"],"summary":"Labels that say how much damage disclosure could cause and who may see the information. US: Confidential, Secret, Top Secret. Canada: Protected A, B and C, plus Confidential, Secret and Top Secret.","tags":["classification","military"],"title":"Classification levels","updatedAt":1792182599967,"id":"classification-levels"},{"category":"controls","createdAt":1790983894413,"detail":"One control can do two jobs: antivirus that finds and deletes a virus is detective and corrective.\n\nMistake I made: called a camera preventive. Its main job is recording, so it's detective (and physical). Some frameworks add \"deterrent\" for the discouraging effect.","example":"","flagged":false,"kind":"note","related":["Control","Detective control"],"summary":"Ask two questions: when does it act (before, during, after)? Is it technology, a rule, or something physical?","tags":["lesson-3","mistakes"],"title":"Classifying a control","updatedAt":1790983894311,"id":"classifying-a-control"},{"category":"military","createdAt":1792182600000,"detail":"- Level 1: basic safeguards for federal contract information (15 practices).\n- Level 2: aligned to NIST SP 800-171 (110 practices).\n- Level 3: adds a subset of NIST SP 800-172.\n- Rollout is phased, starting in late 2025. Check the current status.\n- Prime contractors pass the requirements down to their subcontractors.","example":"","flagged":false,"kind":"term","related":["NIST SP 800-171","CUI","CPCSC","Third-Party Risk Management (TPRM)"],"summary":"Cybersecurity Maturity Model Certification: the US DoD program that requires defence contractors to prove they meet cyber requirements, by self-assessment or third-party assessment.","tags":["frameworks","us","military"],"title":"CMMC","updatedAt":1792182599947,"id":"cmmc"},{"category":"military","createdAt":1792182600000,"detail":"- Incident leads compare COAs, such as containing now versus watching the attacker.\n- CONOPS documents appear in system design and defence contracts.\n- An OPORD follows a fixed five-paragraph order: situation, mission, execution, sustainment, command and signal.","example":"","flagged":false,"kind":"term","related":["Incident Response Plan (IRP)","Chain of command"],"summary":"Planning terms. A course of action (COA) is one way to reach a goal. A concept of operations (CONOPS) describes how a system or mission will work. An operation order (OPORD) gives the instructions to carry it out.","tags":["planning","military"],"title":"COA, CONOPS and OPORD","updatedAt":1792182599975,"id":"coa-conops-and-opord"},{"category":"military","createdAt":1792182600000,"detail":"- In policy writing, state the why, not just the rule.\n- In an incident, \"protect client data first, then restore service\" lets responders make good decisions without waiting for approval.","example":"","flagged":false,"kind":"term","related":["Policy, standard, procedure","Chain of command","Risk appetite"],"summary":"A short statement of the purpose and desired end state of an operation, so people can adapt when the plan falls apart.","tags":["governance","communication","military"],"title":"Commander's intent","updatedAt":1792182599973,"id":"commander-s-intent"},{"category":"audit","createdAt":1790983894413,"detail":"Easy to miss. When reviewing a vendor's SOC 2, check the CUEC section and confirm your company actually does them.","example":"The vendor secures its platform, but you must manage which of your users have accounts.","flagged":false,"kind":"term","related":["SOC 2","Third-Party Risk Management (TPRM)"],"summary":"Controls a vendor's SOC 2 report says the customer must run themselves for the vendor's controls to be effective.","tags":["vendors","interview"],"title":"Complementary user entity controls (CUECs)","updatedAt":1790983894358,"id":"complementary-user-entity-controls-cuecs"},{"category":"foundations","createdAt":1790983894413,"detail":"Compliance asks: are we following the rules, and can we prove it?\n\nRules come from outside (laws like PIPEDA, standards like PCI DSS, customer contracts) and inside (company policies). A company can be compliant and still be at risk, because laws don't cover every threat.","example":"In real estate: FINTRAC client ID verification and brokerage policies. In tech: breach reporting under PIPEDA and passing a SOC 2 audit.","flagged":false,"kind":"term","related":["Risk","GRC","PIPEDA"],"summary":"Following the rules that apply to you: laws, regulations, industry standards, contracts with customers, and your own internal policies.","tags":["core","lesson-1"],"title":"Compliance","updatedAt":1790983894412,"id":"compliance"},{"category":"military","createdAt":1792182600000,"detail":"- Covers encryption, authentication and careful handling of the keys. In the military the keys themselves are controlled material.\n- Today it overlaps with encryption and key management in commercial security.","example":"","flagged":false,"kind":"term","related":["Encryption","INFOSEC","Two-person integrity"],"summary":"Communications security: measures that keep communications from being read, altered or faked by anyone else.","tags":["cyber","military"],"title":"COMSEC","updatedAt":1792182599995,"id":"comsec"},{"category":"privacy","createdAt":1790983894413,"detail":"Express consent (a clear yes) is needed for sensitive data like credit checks. Implied consent can work for less sensitive, expected uses.","example":"A landlord needs a tenant's written consent before pulling a credit report.","flagged":false,"kind":"term","related":["PIPEDA","Tenant screening"],"summary":"Permission from a person to collect, use or share their personal information. It must be meaningful: people need to understand what they're agreeing to.","tags":["canada"],"title":"Consent","updatedAt":1790983894380,"id":"consent"},{"category":"refintech","createdAt":1790983894413,"detail":"Relevant for income verification and mortgage pre-qualification. Rollout is ongoing, so check the current status.","example":"","flagged":false,"kind":"term","related":["Consent","OSFI B-10"],"summary":"Canada's open banking framework, letting consumers securely share their financial data with approved third parties.","tags":["canada","trend"],"title":"Consumer-driven banking","updatedAt":1790983894316,"id":"consumer-driven-banking"},{"category":"audit","createdAt":1790983894413,"detail":"","example":"","flagged":false,"kind":"term","related":["GRC tools","Evidence"],"summary":"Collecting evidence and checking controls automatically all year instead of once before the audit.","tags":["lesson-6","trend"],"title":"Continuous monitoring","updatedAt":1790983894361,"id":"continuous-monitoring"},{"category":"controls","createdAt":1790983894413,"detail":"Classify every control two ways:\n- By function: preventive, detective, corrective\n- By implementation: technical, administrative, physical","example":"A locked server room is physical and preventive.","flagged":false,"kind":"term","related":["Preventive control","Detective control","Corrective control","Classifying a control"],"summary":"Any safeguard that reduces a risk. Mitigating a risk means applying controls.","tags":["lesson-3"],"title":"Control","updatedAt":1790983894395,"id":"control"},{"category":"military","createdAt":1792182600000,"detail":"A US federal term. In industry it is called business continuity and disaster recovery.","example":"","flagged":false,"kind":"term","related":["Business continuity and disaster recovery (BCP/DR)","RTO and RPO","PACE plan"],"summary":"Continuity of operations: plans to keep essential functions running during and after a disruption.","tags":["resilience","military"],"title":"COOP","updatedAt":1792182599978,"id":"coop"},{"category":"military","createdAt":1792182600000,"detail":"A security operations dashboard or incident status page plays this role. It stops people acting on different versions of the facts.","example":"","flagged":false,"kind":"term","related":["SITREP","SIEM","Logging and monitoring"],"summary":"Common operating picture: one shared view of the situation that everyone works from.","tags":["communication","military"],"title":"COP","updatedAt":1792182599976,"id":"cop"},{"category":"controls","createdAt":1790983894413,"detail":"","example":"Restoring data from backups; antivirus deleting a virus it found.","flagged":false,"kind":"term","related":["Backup and recovery","Detective control"],"summary":"Fixes things after a problem, restoring normal operation.","tags":["lesson-3"],"title":"Corrective control","updatedAt":1790983894392,"id":"corrective-control"},{"category":"military","createdAt":1792182600000,"detail":"Announced in 2025. Details and timelines are still rolling out, so check the current status.","example":"","flagged":false,"kind":"term","related":["CMMC","CAF and DND","CCCS"],"summary":"Canadian Program for Cyber Security Certification: Canada's planned certification program for defence suppliers, similar in approach to CMMC.","tags":["frameworks","canada","military"],"title":"CPCSC","updatedAt":1792182599946,"id":"cpcsc"},{"category":"military","createdAt":1792182600000,"detail":"- The Canadian Centre for Cyber Security is part of CSE.\n- The CSE Act (2019) covers foreign intelligence, cyber security, defensive and active cyber operations, and technical help to partners.","example":"","flagged":false,"kind":"term","related":["CCCS","Five Eyes","OCO and DCO","ITSG-33"],"summary":"Communications Security Establishment: Canada's signals intelligence and cyber security agency.","tags":["canada","organizations","military"],"title":"CSE","updatedAt":1792182599958,"id":"cse"},{"category":"military","createdAt":1792182600000,"detail":"Contractors protect it under NIST SP 800-171 and CMMC.","example":"","flagged":false,"kind":"term","related":["NIST SP 800-171","CMMC","Classification levels"],"summary":"Controlled unclassified information: US government information that is not classified but still must be protected. It replaced older labels such as FOUO.","tags":["classification","us","military"],"title":"CUI","updatedAt":1792182599964,"id":"cui"},{"category":"risk","createdAt":1790983894413,"detail":"Insurers increasingly require controls such as MFA, backups and endpoint protection before they'll issue a policy, so it ties directly to the control program.","example":"","flagged":false,"kind":"term","related":["Transfer (risk response)","Multi-factor authentication (MFA)"],"summary":"Insurance that helps pay for breach costs: investigation, notification, legal fees, lawsuits and sometimes ransom.","tags":["risk-response"],"title":"Cyber insurance","updatedAt":1790983894396,"id":"cyber-insurance"},{"category":"military","createdAt":1792182600000,"detail":"It has shared a leader with the NSA since it was created. Check the current arrangement.","example":"","flagged":false,"kind":"term","related":["NSA","OCO and DCO"],"summary":"United States Cyber Command: the US military command for cyberspace operations, based at Fort Meade, Maryland.","tags":["us","organizations","military"],"title":"CYBERCOM","updatedAt":1792182599961,"id":"cybercom"},{"category":"privacy","createdAt":1790983894413,"detail":"\"Just in case\" is a red flag. Data you never collected can't be stolen, so minimization lowers risk as well as meeting the law.","example":"An app collecting birthdates \"in case we need them later\" violates this principle.","flagged":false,"kind":"term","related":["PIPEDA","Data retention"],"summary":"Only collect the personal information you actually need for a stated purpose. Also called limiting collection.","tags":["lesson-4","principle"],"title":"Data minimization","updatedAt":1790983894381,"id":"data-minimization"},{"category":"thirdparty","createdAt":1790983894413,"detail":"","example":"","flagged":false,"kind":"term","related":["GDPR","Third-Party Risk Management (TPRM)"],"summary":"A contract spelling out how a vendor may use your personal data, how they protect it and what happens at the end. Required under GDPR.","tags":["lesson-7","contracts"],"title":"Data Processing Agreement (DPA)","updatedAt":1790983894354,"id":"data-processing-agreement-dpa"},{"category":"privacy","createdAt":1790983894413,"detail":"Keep data only as long as needed for its purpose or as required by law, then securely destroy it. Laws can also set minimums: FINTRAC records must generally be kept at least five years.","example":"","flagged":false,"kind":"term","related":["Data minimization","FINTRAC"],"summary":"Rules for how long data is kept and when it must be deleted.","tags":["data"],"title":"Data retention","updatedAt":1790983894378,"id":"data-retention"},{"category":"controls","createdAt":1790983894413,"detail":"","example":"A house with a lock, an alarm and cameras. A login with a password, MFA and unusual-login alerts.","flagged":false,"kind":"term","related":["Control"],"summary":"Layering several controls so if one fails, others still protect you.","tags":["lesson-3","principle"],"title":"Defense in depth","updatedAt":1790983894388,"id":"defense-in-depth"},{"category":"audit","createdAt":1790983894413,"detail":"","example":"3 of 25 sampled former employees still had access a month after leaving.","flagged":false,"kind":"term","related":["Remediation plan","Sampling"],"summary":"A problem an auditor finds where a control failed or is missing. Also called a finding or exception.","tags":["lesson-6"],"title":"Deficiency","updatedAt":1790983894364,"id":"deficiency"},{"category":"controls","createdAt":1790983894413,"detail":"","example":"Alerts on logins from an unusual country; a security camera; reviewing bank statements.","flagged":false,"kind":"term","related":["Preventive control","SIEM"],"summary":"Spots a problem while or after it happens.","tags":["lesson-3"],"title":"Detective control","updatedAt":1790983894393,"id":"detective-control"},{"category":"military","createdAt":1792182600000,"detail":"","example":"","flagged":false,"kind":"term","related":["STIG","DoD"],"summary":"Defense Information Systems Agency: provides IT and communications support to the US military and publishes the STIGs.","tags":["us","organizations","military"],"title":"DISA","updatedAt":1792182599959,"id":"disa"},{"category":"linux","createdAt":1792173300000,"detail":"```\ndf -h          # free space per drive\ndu -sh *       # size of each item in this folder\nlsblk -f       # drives, partitions, filesystems\n```\n\n- Drives appear as devices such as `/dev/nvme0n1` and are mounted into the folder tree.\n- `/etc/fstab` lists what mounts at boot.\n- A mount option called `noexec` blocks running programs from that drive, a common reason an AppImage gives \"Permission denied\".","example":"","flagged":false,"kind":"note","related":["Linux filesystem layout","AppImage troubleshooting","Full-disk encryption (LUKS)"],"summary":"Commands for free space, folder sizes and seeing which drives are attached and how they are mounted.","tags":["system","commands","linux"],"title":"Disk and storage commands","updatedAt":1792173299977,"id":"disk-and-storage-commands"},{"category":"linux","createdAt":1792173300000,"detail":"```\nsudo dnf upgrade --refresh       # update everything\ndnf search keyword               # find a package\ndnf info packagename             # details\nsudo dnf install packagename\nsudo dnf remove packagename\ndnf provides /usr/bin/command    # which package supplies this command?\ndnf history                      # what changed, and when\ndnf check-update                 # pending updates\nrpm -qa | grep name              # is it installed?\nsudo dnf install ./file.rpm      # install a downloaded .rpm\n```\n\n- Packages from Fedora's repositories are signed and update along with the system.\n- Adding a third-party repository means trusting that vendor with your whole system. Add only the ones you need.\n- On Ubuntu and Debian, apt does the same job.\n\n`dnf history` and `dnf check-update` are standard patching evidence.","example":"","flagged":false,"kind":"term","related":["Flatpak","Vulnerability management","Evidence","AppImage, Flatpak or RPM"],"summary":"dnf is Fedora's package manager for installing, updating and removing software from trusted repositories. RPM is the package file format it uses.","tags":["packages","fedora","linux"],"title":"dnf and RPM","updatedAt":1792173299994,"id":"dnf-and-rpm"},{"category":"military","createdAt":1792182600000,"detail":"- Sets standards that spread into industry: STIGs, the RMF and CMMC.\n- Since late 2025 the administration also uses \"Department of War\" as a secondary name, while DoD remains the statutory name. Check current usage.","example":"","flagged":false,"kind":"term","related":["DISA","CYBERCOM","NSA","CMMC"],"summary":"United States Department of Defense, the parent department of the US military.","tags":["us","organizations","military"],"title":"DoD","updatedAt":1792182599962,"id":"dod"},{"category":"refintech","createdAt":1790983894413,"detail":"Controls focus on signer identity, audit trails and tamper-evident documents.","example":"","flagged":false,"kind":"term","related":["Know your customer (KYC)","Evidence"],"summary":"Signing documents digitally. Widely used for real estate agreements, with conditions set by provincial electronic commerce laws.","tags":["documents"],"title":"Electronic signatures","updatedAt":1790983894315,"id":"electronic-signatures"},{"category":"military","createdAt":1792182600000,"detail":"- Examples: jamming radar, jamming or spoofing GPS.\n- Relevance outside the military: wireless attacks such as rogue Wi-Fi access points and GPS spoofing that affects time sync or location-based systems.","example":"","flagged":false,"kind":"term","related":["Intelligence disciplines (SIGINT, HUMINT, OSINT)","C4ISR"],"summary":"Using the radio spectrum to attack, protect or gather information, through jamming, spoofing and listening.","tags":["cyber","military"],"title":"Electronic warfare (EW)","updatedAt":1792182599986,"id":"electronic-warfare-ew"},{"category":"security","createdAt":1790983894413,"detail":"- At rest: stored data (databases, laptops)\n- In transit: data moving over networks (TLS / HTTPS)","example":"","flagged":false,"kind":"term","related":["Hashing","Technical control"],"summary":"Scrambling data so only someone with the key can read it.","tags":["data"],"title":"Encryption","updatedAt":1790983894343,"id":"encryption"},{"category":"ai","createdAt":1790983894413,"detail":"Requirements phase in over several years and timelines have been under discussion, so check the current status.","example":"","flagged":false,"kind":"term","related":["ISO 42001","NIST AI Risk Management Framework"],"summary":"The first major AI law. It sorts AI systems by risk, with the strictest rules for high-risk uses such as hiring and credit decisions.","tags":["lesson-8","international"],"title":"EU AI Act","updatedAt":1790983894328,"id":"eu-ai-act"},{"category":"audit","createdAt":1790983894413,"detail":"Good evidence is complete, dated and system-generated where possible. Always compare a report against the full population.","example":"\"All laptops are encrypted\" → device-management report showing encryption on each laptop, plus the full laptop inventory to prove none are missing.","flagged":false,"kind":"term","related":["Sampling","Continuous monitoring"],"summary":"Proof that a control works. If you can't prove it, it didn't happen. Also called artifacts.","tags":["lesson-6"],"title":"Evidence","updatedAt":1790983894367,"id":"evidence"},{"category":"linux","createdAt":1792173300000,"detail":"```\nsudo dnf upgrade --refresh\nsudo dnf install fuse fuse-libs\nflatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo\nmkdir -p ~/Applications\ngetenforce\nsudo firewall-cmd --state\nlsblk -f\n```\n\nWhat each line does: update the system, add FUSE support for AppImages, add the Flathub app store, create a home for AppImages, then confirm SELinux, the firewall and disk encryption are on.","example":"","flagged":false,"kind":"note","related":["AppImage","FUSE","Flatpak","SELinux","firewalld","Full-disk encryption (LUKS)"],"summary":"A first-day checklist for a Fedora machine, including the pieces that make AppImages work.","tags":["fedora","how-to","linux"],"title":"Fedora setup checklist","updatedAt":1792173299969,"id":"fedora-setup-checklist"},{"category":"linux","createdAt":1792173300000,"detail":"- Packages: dnf and RPM. Flatpak is included on the Workstation edition.\n- SELinux is on by default.\n- A new release comes out about every six months and each is supported for roughly 13 months, so plan to upgrade.\n- Workstation uses the GNOME desktop.\n\nCheck your version:\n\n```\ncat /etc/os-release\n```","example":"","flagged":false,"kind":"term","related":["Linux distribution (distro)","SELinux","dnf and RPM","Fedora setup checklist"],"summary":"A community Linux distribution sponsored by Red Hat, known for current software and strong security defaults. It is the upstream of Red Hat Enterprise Linux.","tags":["basics","fedora","linux"],"title":"Fedora","updatedAt":1792173299999,"id":"fedora"},{"category":"linux","createdAt":1792173300000,"detail":"`ls -l` shows something like `-rwxr-xr--`. After the first character, the three triplets are owner, group and others. Read is 4, write is 2, execute is 1, so 755 means owner rwx, group r-x, others r-x.\n\n```\nls -l myfile\nchmod +x myfile                 # make it runnable\nchmod 644 notes.txt             # owner reads and writes, others read\nchmod 600 ~/.ssh/id_ed25519     # private key: only you\nsudo chown user:group file      # change the owner\n```\n\n- 755 is typical for programs and folders, 644 for normal files, 600 for secrets.\n- \"Permission denied\" usually means the file lacks the right permission, or you need sudo.\n\nThis is least privilege applied to files. Auditors check that sensitive files are not readable by everyone.","example":"","flagged":false,"kind":"term","related":["Least privilege","sudo and root","Running an AppImage on Fedora","SSH and keys"],"summary":"Settings that say who can read, write or run each file: the owner, the owner's group, and everyone else.","tags":["basics","security","linux"],"title":"File permissions (chmod)","updatedAt":1792173299996,"id":"file-permissions-chmod"},{"category":"refintech","createdAt":1790983894413,"detail":"Real estate obligations include:\n- A compliance program (compliance officer, policies, risk assessment, training, two-year effectiveness review)\n- Verifying client identity and keeping records\n- Determining third parties and politically exposed persons\n- Reporting suspicious transactions and large cash transactions ($10,000+)\n\nFintechs serving brokerages often build features that support these obligations.","example":"An agent verifying a buyer's photo ID and recording the details on the FINTRAC form.","flagged":false,"kind":"term","related":["Anti-money laundering (AML)","Know your customer (KYC)","Data retention"],"summary":"Canada's financial intelligence unit. It enforces anti-money-laundering rules under the PCMLTFA, and real estate brokers, sales representatives and developers are reporting entities.","tags":["canada","aml","interview"],"title":"FINTRAC","updatedAt":1790983894325,"id":"fintrac"},{"category":"linux","createdAt":1792173300000,"detail":"```\nsudo firewall-cmd --state\nsudo firewall-cmd --list-all\nsudo firewall-cmd --add-port=8080/tcp --permanent\nsudo firewall-cmd --reload\n```\n\n- A change made without `--permanent` disappears at reboot.\n- Open only the ports for services you actually run.","example":"","flagged":false,"kind":"term","related":["Preventive control","Linux networking commands","Defense in depth"],"summary":"Fedora's default firewall service. It decides which network traffic is allowed in, using zones.","tags":["security","network","fedora","linux"],"title":"firewalld","updatedAt":1792173299978,"id":"firewalld"},{"category":"military","createdAt":1792182600000,"detail":"Joint cyber advisories are often co-signed by these partners' agencies, including Canada's CCCS.","example":"","flagged":false,"kind":"term","related":["CCCS","NSA","TLP"],"summary":"The intelligence-sharing alliance of Canada, the United States, the United Kingdom, Australia and New Zealand.","tags":["organizations","intelligence","military"],"title":"Five Eyes","updatedAt":1792182599955,"id":"five-eyes"},{"category":"linux","createdAt":1792173300000,"detail":"```\nflatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo\nflatpak install flathub it.mijorus.gearlever\nflatpak run it.mijorus.gearlever\nflatpak update\nflatpak list\nflatpak uninstall it.mijorus.gearlever\n```\n\n- App IDs look like `org.name.App`. Find them on flathub.org.\n- The sandbox limits which files and devices an app can touch. Flatseal, itself a Flatpak app, shows and changes those permissions.\n- Fedora Workstation includes Flatpak, and the Software app can install from it.","example":"","flagged":false,"kind":"term","related":["AppImage, Flatpak or RPM","Least privilege","Adding an AppImage to the app menu"],"summary":"A way to install desktop apps that run in a sandbox, with updates handled separately from the operating system. Flathub is the main app store.","tags":["packages","linux"],"title":"Flatpak","updatedAt":1792173299993,"id":"flatpak"},{"category":"thirdparty","createdAt":1790983894413,"detail":"","example":"Your payroll provider's cloud host.","flagged":false,"kind":"term","related":["Third-Party Risk Management (TPRM)"],"summary":"Your vendor's vendors. You can't check them directly, so you ask your vendors how they manage their own suppliers.","tags":["lesson-7"],"title":"Fourth party","updatedAt":1790983894352,"id":"fourth-party"},{"category":"linux","createdAt":1792173300000,"detail":"```\nlsblk -f      # look for crypto_LUKS in the FSTYPE column\n```\n\n- Fedora's installer offers to encrypt the disk. It is far easier to choose it at install time than to add it later.\n- The command output, with the date, answers the audit question \"are all laptops encrypted?\".","example":"","flagged":false,"kind":"term","related":["Encryption","Evidence","Preventive control"],"summary":"LUKS is the standard full-disk encryption on Linux. Without the passphrase, the data on a lost or stolen laptop cannot be read.","tags":["security","data","linux"],"title":"Full-disk encryption (LUKS)","updatedAt":1792173299976,"id":"full-disk-encryption-luks"},{"category":"linux","createdAt":1792173300000,"detail":"On Fedora the AppImage error \"dlopen(): error loading libfuse.so.2\" means the FUSE 2 library is missing. Install it, or run the AppImage in extract mode. Newer AppImages built with a static runtime may not need it.","example":"","flagged":false,"kind":"term","related":["AppImage troubleshooting","AppImage"],"summary":"Filesystem in Userspace. It lets ordinary programs mount a filesystem without root, and it is how most AppImages open themselves.","tags":["appimage","linux"],"title":"FUSE","updatedAt":1792173299991,"id":"fuse"},{"category":"privacy","createdAt":1790983894413,"detail":"- Regulators must be notified of qualifying breaches within 72 hours of becoming aware\n- Fines up to €20 million or 4% of global annual revenue\n- Requires a Data Processing Agreement with vendors who handle personal data","example":"A Toronto app with users in France must comply.","flagged":false,"kind":"term","related":["Data Processing Agreement (DPA)","PIPEDA"],"summary":"The EU's privacy law, the most influential in the world. It applies to any company anywhere that handles EU residents' data.","tags":["international","lesson-4"],"title":"GDPR","updatedAt":1790983894382,"id":"gdpr"},{"category":"career","createdAt":1790983894413,"detail":"- ISC2 CC (Certified in Cybersecurity): entry-level foundation\n- CompTIA Security+: broad security foundation\n- IAPP CIPP/C: Canadian privacy law; CIPM: privacy program management\n- ISACA CISA: IT audit; CRISC: IT risk\n- ISC2 CISSP: senior, requires experience","example":"","flagged":false,"kind":"term","related":["GRC"],"summary":"Credentials that signal GRC knowledge to employers.","tags":["career","lesson-8"],"title":"GRC certifications","updatedAt":1790983894314,"id":"grc-certifications"},{"category":"career","createdAt":1790983894413,"detail":"- GRC / compliance analyst: maintains controls, collects evidence, supports audits\n- Risk analyst: runs the risk register and assessments\n- Privacy analyst: privacy laws, consent, data requests\n- Third-party risk analyst: vendor reviews\n- IT auditor: tests controls\n- AI governance specialist: newer, focused on AI risk","example":"","flagged":false,"kind":"term","related":["GRC certifications","Three lines model"],"summary":"Common job titles in the field and what they do.","tags":["career","lesson-8"],"title":"GRC roles","updatedAt":1790983894313,"id":"grc-roles"},{"category":"audit","createdAt":1790983894413,"detail":"Examples: Vanta, Drata, OneTrust, AuditBoard, ServiceNow GRC. Familiarity with one is a plus on a resume.","example":"","flagged":false,"kind":"term","related":["Continuous monitoring","Unified control framework"],"summary":"Software that tracks controls, risks and vendors, and automatically gathers audit evidence from company systems.","tags":["tools","career"],"title":"GRC tools","updatedAt":1790983894360,"id":"grc-tools"},{"category":"foundations","createdAt":1790983894413,"detail":"- Governance: who decides, policies, oversight by leadership and the board\n- Risk: identify, assess, respond, monitor\n- Compliance: meet laws, standards and contracts, and keep evidence that you do\n\nIn tech companies GRC teams sit between security, legal, IT and the business. Much of the day-to-day work is maintaining controls and evidence for audits.","example":"A fintech GRC analyst might own the SOC 2 audit, keep the risk register current, and review new vendors before contracts are signed.","flagged":false,"kind":"term","related":["Compliance","Risk","Risk register","SOC 2"],"summary":"Governance, Risk and Compliance: the combined practice of setting direction (governance), managing what could go wrong (risk), and proving you follow the rules (compliance).","tags":["core"],"title":"GRC","updatedAt":1790983894413,"id":"grc"},{"category":"security","createdAt":1790983894413,"detail":"Unlike encryption, hashing can't be reversed with a key. Plain-text password storage is both a risk and a compliance failure.","example":"","flagged":false,"kind":"term","related":["Encryption"],"summary":"A one-way transformation of data. Used to store passwords so the original can't be read back.","tags":["data","lesson-1"],"title":"Hashing","updatedAt":1790983894342,"id":"hashing"},{"category":"security","createdAt":1790983894413,"detail":"Joiner–Mover–Leaver: give access when people join, adjust when they change roles, and remove it on their last day. Leaver failures are a classic audit finding.","example":"","flagged":false,"kind":"term","related":["Least privilege","Access review","Single sign-on (SSO)"],"summary":"The processes and tools that control who can access what: creating accounts, granting permissions, and removing access.","tags":["access"],"title":"Identity and access management (IAM)","updatedAt":1790983894347,"id":"identity-and-access-management-iam"},{"category":"incident","createdAt":1790983894413,"detail":"Stages: Prepare → Detect and analyze → Contain, eradicate, recover → Post-incident review.\n\nCompliance's job during an incident: do we have to report this, to whom, and by when?","example":"","flagged":false,"kind":"term","related":["Tabletop exercise","Post-incident review","Real risk of significant harm (RROSH)"],"summary":"A written plan for handling security incidents: roles, decision authority, contacts, steps and notification duties.","tags":["lesson-8"],"title":"Incident Response Plan (IRP)","updatedAt":1790983894351,"id":"incident-response-plan-irp"},{"category":"military","createdAt":1792182600000,"detail":"- An older government term. Cybersecurity usually focuses on the digital side.\n- Confidentiality, integrity and availability (the CIA triad) are the three goals.\n- The word covers paper records too, which matters for a brokerage.","example":"","flagged":false,"kind":"term","related":["COMSEC","OPSEC","ISO 27001"],"summary":"Information security: protecting information in any form, on paper or in systems, so it stays confidential, accurate and available.","tags":["cyber","military"],"title":"INFOSEC","updatedAt":1792182599994,"id":"infosec"},{"category":"risk","createdAt":1790983894413,"detail":"","example":"The inherent risk of holding a customer database is high.","flagged":false,"kind":"term","related":["Residual risk","Control"],"summary":"How risky something is before any safeguards are in place.","tags":["lesson-2"],"title":"Inherent risk","updatedAt":1790983894403,"id":"inherent-risk"},{"category":"military","createdAt":1792182600000,"detail":"- US cleared defence contractors must run formal insider threat programs.\n- A good program combines HR, security and IT monitoring.\n- Useful controls: least privilege, segregation of duties, regular access reviews, activity monitoring and fast offboarding.","example":"An employee downloads the full client list the week before resigning.","flagged":false,"kind":"term","related":["Least privilege","Segregation of duties","Access review","Identity and access management (IAM)"],"summary":"Risk from people who already have legitimate access and misuse it, on purpose or by mistake.","tags":["cyber","people","military"],"title":"Insider threat","updatedAt":1792182599985,"id":"insider-threat"},{"category":"military","createdAt":1792182600000,"detail":"- OSINT is the one that crosses into everyday work. Attackers research targets from public sources like LinkedIn, company sites and property records, then use it for phishing.\n- Defenders use OSINT for threat intelligence and for due diligence.\n- In AML and KYC work, adverse media searches are OSINT.","example":"","flagged":false,"kind":"term","related":["OPSEC","Know your customer (KYC)","Phishing"],"summary":"The main ways intelligence is gathered: SIGINT from signals, HUMINT from people, OSINT from open sources, GEOINT from imagery and location.","tags":["cyber","intelligence","military"],"title":"Intelligence disciplines (SIGINT, HUMINT, OSINT)","updatedAt":1792182599988,"id":"intelligence-disciplines-sigint-humint-osint"},{"category":"audit","createdAt":1790983894413,"detail":"","example":"","flagged":false,"kind":"term","related":["Three lines model","Readiness assessment"],"summary":"The company's own independent audit function. It reports to the board's audit committee and checks whether controls and risk management work.","tags":["lesson-6"],"title":"Internal audit","updatedAt":1790983894368,"id":"internal-audit"},{"category":"frameworks","createdAt":1790983894413,"detail":"Built around the risk management cycle. The 2022 version's Annex A lists 93 controls. Certificates last three years with yearly surveillance audits.","example":"","flagged":false,"kind":"term","related":["SOC 2","ISO 42001","Risk management cycle"],"summary":"The international standard for an Information Security Management System (ISMS). Companies earn a formal certification from an accredited body.","tags":["lesson-5","international"],"title":"ISO 27001","updatedAt":1790983894373,"id":"iso-27001"},{"category":"ai","createdAt":1790983894413,"detail":"","example":"","flagged":false,"kind":"term","related":["ISO 27001","EU AI Act"],"summary":"A certifiable international standard for an AI management system, modelled on ISO 27001.","tags":["lesson-8"],"title":"ISO 42001","updatedAt":1790983894327,"id":"iso-42001"},{"category":"military","createdAt":1792182600000,"detail":"- Its control catalogue is based on NIST SP 800-53.\n- Used on federal systems and by suppliers who handle government information.\n- Compare it with the RMF.","example":"","flagged":false,"kind":"term","related":["CSE","NIST SP 800-53","RMF"],"summary":"IT Security Risk Management: A Lifecycle Approach. The Government of Canada's guidance from CSE for managing IT security risk.","tags":["frameworks","canada","military"],"title":"ITSG-33","updatedAt":1792182599945,"id":"itsg-33"},{"category":"risk","createdAt":1790983894413,"detail":"","example":"Number of critical vulnerabilities unpatched past 30 days; percentage of staff overdue on security training.","flagged":false,"kind":"term","related":["Risk appetite","Continuous monitoring"],"summary":"A measurable signal that a risk is growing, used as an early warning.","tags":["metrics"],"title":"Key risk indicator (KRI)","updatedAt":1790983894397,"id":"key-risk-indicator-kri"},{"category":"military","createdAt":1792182600000,"detail":"Lockheed Martin's cyber kill chain has seven stages:\n- Reconnaissance\n- Weaponization\n- Delivery\n- Exploitation\n- Installation\n- Command and control\n- Actions on objectives\n\nDefenders map their controls to the stages. Catching an attack early gives the most time to respond.","example":"","flagged":false,"kind":"term","related":["C2","Defense in depth","TTPs","MITRE ATT&CK"],"summary":"A model of the steps an attack goes through. Breaking any step stops the attack. It comes from the military targeting cycle: find, fix, track, target, engage, assess.","tags":["cyber","threats","military"],"title":"Kill chain","updatedAt":1792182599992,"id":"kill-chain"},{"category":"refintech","createdAt":1790983894413,"detail":"Digital ID verification (document scan plus selfie match) is a common real estate fintech feature. It creates sensitive biometric and ID data to protect.","example":"","flagged":false,"kind":"term","related":["FINTRAC","Personal information (PI)"],"summary":"Verifying who a client is and understanding their activity, so you can spot risk and meet AML rules.","tags":["aml"],"title":"Know your customer (KYC)","updatedAt":1790983894323,"id":"know-your-customer-kyc"},{"category":"controls","createdAt":1790983894413,"detail":"Reduces the damage from a mistake or a compromised account. Enforced through role-based access and regular access reviews.","example":"A support rep can view customer tickets but not the company's financial records.","flagged":false,"kind":"term","related":["Role-based access control (RBAC)","Access review","Segregation of duties"],"summary":"Give people only the access they need to do their job, and nothing more.","tags":["lesson-3","principle"],"title":"Least privilege","updatedAt":1790983894387,"id":"least-privilege"},{"category":"linux","createdAt":1792173300000,"detail":"- The kernel is the core that talks to the hardware. A distro is the kernel plus everything around it.\n- Fedora, RHEL, Rocky Linux and AlmaLinux are the Red Hat family: RPM packages, dnf and SELinux.\n- Ubuntu and Debian use apt and .deb packages.\n- Most commands work the same everywhere. Package management is the main difference.\n\nMany company servers run a Red Hat family distro or Ubuntu. Fedora is the upstream of RHEL, so what you learn on Fedora carries over.","example":"","flagged":false,"kind":"term","related":["Fedora","dnf and RPM"],"summary":"A complete operating system built around the Linux kernel, packaged with tools, a package manager and a desktop. Fedora, Ubuntu, Debian and Red Hat Enterprise Linux are distros.","tags":["basics","linux"],"title":"Linux distribution (distro)","updatedAt":1792173300000,"id":"linux-distribution-distro"},{"category":"linux","createdAt":1792173300000,"detail":"- `/home/yourname`, also written `~`: your files and app settings\n- `/etc`: system configuration files\n- `/var/log`: logs\n- `/usr`: installed programs and libraries\n- `/opt`: optional third-party software\n- `/tmp`: temporary files\n- `/dev`, `/proc`, `/sys`: virtual files that represent devices and the running system\n- `/mnt` and `/media`: where drives get mounted\n\nHidden files start with a dot, such as `~/.bashrc` or `~/.config`. Paths are case-sensitive, so `Notes` and `notes` are different folders.\n\nIn an audit, `/etc` is where settings are checked and `/var/log` is where activity is checked.","example":"","flagged":false,"kind":"term","related":["Terminal and shell","Disk and storage commands","Evidence"],"summary":"Everything lives under one root folder, /, with standard places for settings, logs, programs and your own files.","tags":["basics","linux"],"title":"Linux filesystem layout","updatedAt":1792173299997,"id":"linux-filesystem-layout"},{"category":"linux","createdAt":1792173300000,"detail":"- Patching: `dnf history`, `dnf check-update`\n- Admin rights: `getent group wheel`, `sudo -l`\n- All accounts: `getent passwd`\n- SSH hardening: `sudo grep -E \"PermitRootLogin|PasswordAuthentication\" /etc/ssh/sshd_config`\n- Firewall: `sudo firewall-cmd --list-all`\n- SELinux: `getenforce`\n- Disk encryption: `lsblk -f`\n- Listening services: `sudo ss -tulpn`\n- Logging: `journalctl` and `systemctl status auditd`\n- Clock sync: `timedatectl`\n\nCapture the output with the date and the host name. That is evidence. For an interview, be ready to say which control each check proves.","example":"","flagged":false,"kind":"note","related":["Evidence","Sampling","Least privilege","Access review","Logging and monitoring","Defense in depth","SELinux","Full-disk encryption (LUKS)"],"summary":"What auditors ask about a Linux server or laptop, and the command that produces the evidence.","tags":["audit","interview","linux"],"title":"Linux in an audit","updatedAt":1792173299970,"id":"linux-in-an-audit"},{"category":"linux","createdAt":1792173300000,"detail":"```\nip a                            # my IP addresses\nip route                        # default gateway\nping -c 4 example.com\nsudo ss -tulpn                  # what is listening on which port\ncurl -I https://example.com     # fetch the headers\ndig example.com                 # DNS lookup\nnmcli device status             # network connections\n```\n\n`ss -tulpn` is a quick answer to \"what services are exposed on this machine?\", a question security reviews always ask.","example":"","flagged":false,"kind":"note","related":["firewalld","SSH and keys"],"summary":"The short list for checking addresses, connectivity and what is listening.","tags":["network","commands","linux"],"title":"Linux networking commands","updatedAt":1792173299981,"id":"linux-networking-commands"},{"category":"security","createdAt":1790983894413,"detail":"","example":"","flagged":false,"kind":"term","related":["SIEM","Detective control"],"summary":"Recording system activity and reviewing it to detect problems and support investigations.","tags":["operations"],"title":"Logging and monitoring","updatedAt":1790983894337,"id":"logging-and-monitoring"},{"category":"linux","createdAt":1792173300000,"detail":"```\njournalctl -e                           # newest entries\njournalctl -u sshd --since \"1 hour ago\"\njournalctl -b -p err                    # errors since the last boot\njournalctl -f                           # follow live\n```\n\nSome programs also write plain files under `/var/log`. In a company these logs are usually sent to a central SIEM so they cannot be erased by whoever caused the problem.","example":"","flagged":false,"kind":"note","related":["Logging and monitoring","SIEM","Detective control","Evidence"],"summary":"journalctl reads the system log that systemd keeps. Logs show who logged in, what failed and when.","tags":["system","logs","linux"],"title":"Logs with journalctl","updatedAt":1792173299983,"id":"logs-with-journalctl"},{"category":"military","createdAt":1792182600000,"detail":"- US Army: 17C Cyber Operations Specialist and 25B Information Technology Specialist\n- US Navy: Cryptologic Technician Networks (CTN)\n- US Air Force: 1B4X1 Cyber Warfare Operations\n- Many roles in logistics, signals, intelligence and administration build skills that carry over to compliance work: procedures, records, inspections, briefings.\n- A security clearance shows a person was vetted. It does not show what they can do.\n- Titles differ by country and era, so ask what the person actually did day to day.","example":"","flagged":false,"kind":"note","related":["SOP","AAR","Classification levels","GRC roles"],"summary":"A rough guide for reading military résumés and working with people who served.","tags":["career","military"],"title":"Military jobs that map to GRC and IT","updatedAt":1792182599999,"id":"military-jobs-that-map-to-grc-and-it"},{"category":"risk","createdAt":1790983894413,"detail":"","example":"Requiring a home inspection before buying; adding MFA to stop account takeovers.","flagged":false,"kind":"term","related":["Control","Transfer (risk response)"],"summary":"Reduce a risk's likelihood or impact by adding controls. The most common response.","tags":["lesson-2","risk-response"],"title":"Mitigate (risk response)","updatedAt":1790983894401,"id":"mitigate-risk-response"},{"category":"security","createdAt":1792182600000,"detail":"- Tactics are goals, such as Initial Access, Persistence, Lateral Movement, Exfiltration and Command and Control.\n- Techniques have IDs. T1566 is Phishing.\n- Uses: mapping detections, planning red team work, finding gaps in coverage, and answering vendor questionnaires.","example":"","flagged":false,"kind":"term","related":["TTPs","Kill chain","C2","Red, blue and purple teams","Phishing"],"summary":"A public knowledge base of attacker tactics and techniques drawn from real incidents, used to describe attacks and test defences.","tags":["frameworks","threats","military"],"title":"MITRE ATT&CK","updatedAt":1792182599944,"id":"mitre-att-ck"},{"category":"security","createdAt":1790983894413,"detail":"One of the most effective controls against account takeover. Phishing-resistant MFA (passkeys, hardware keys) beats SMS codes.","example":"","flagged":false,"kind":"term","related":["Identity and access management (IAM)","Preventive control"],"summary":"Logging in with two or more kinds of proof: something you know (password), have (phone, key) or are (fingerprint).","tags":["access"],"title":"Multi-factor authentication (MFA)","updatedAt":1790983894348,"id":"multi-factor-authentication-mfa"},{"category":"military","createdAt":1792182600000,"detail":"Useful on phone calls for serial numbers, case IDs and reference codes. Do not read passwords aloud.","example":"","flagged":false,"kind":"term","related":["Zulu time and DTG","NATO"],"summary":"A spelling code for reading letters over voice: Alfa, Bravo, Charlie, Delta, Echo, Foxtrot, Golf, Hotel, India, Juliett, Kilo, Lima, Mike, November, Oscar, Papa, Quebec, Romeo, Sierra, Tango, Uniform, Victor, Whiskey, X-ray, Yankee, Zulu.","tags":["communication","military"],"title":"NATO phonetic alphabet","updatedAt":1792182599969,"id":"nato-phonetic-alphabet"},{"category":"military","createdAt":1792182600000,"detail":"- Treats cyberspace as an operational domain.\n- Its cooperative cyber defence centre in Tallinn produced the Tallinn M
